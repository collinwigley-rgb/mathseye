<script>
function shortWhy(p){ const ss = (p.steps || []).filter(s => !/^Another way/.test(s)); return ss.length ? ss[ss.length-1] : ""; }
const DATA = __DATA__;
const BRANDS = __BRANDS__;
const MEMBERS = __MEMBERS__;
const ICONS = __ICONS__;
__BURST__
const getBrand = () => { try { const v = localStorage.getItem("mathseye.brand"); if (BRANDS.some(b => b.id === v)) return v; } catch(e) {} return "classic"; };
const applyBrand = (id) => { document.documentElement.dataset.brand = id; };
applyBrand(getBrand());
const KEY = "mathseye.unit2.study.v2" + (window.mathseyeNs || "");
let save = {solved:{}, clean:{}, mission:null, day:{d:"", n:0}};
try { Object.assign(save, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e) {} };
const today = () => new Date().toISOString().slice(0,10);
const bump = () => { if (save.day.d !== today()) save.day = {d:today(), n:0}; save.day.n++; };
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LV = {foundation:"Base skill", builds:"Builds on one earlier lesson", mixed:"Mixes several lessons"};
const LVTXT = {foundation:"This one mostly uses this lesson's skill plus things you learned in earlier grades.", builds:"This one uses this lesson's skill together with one earlier lesson from this unit.", mixed:"This one combines several lessons. If you get stuck, try the earlier lessons first."};
const WIN = ["Nailed it.","Clean take.","On beat.","That's the one.","Stage-ready."];
const MARK = `<svg width="52" height="42" viewBox="0 0 120 96" role="img" aria-label="Mathseye" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 54 C26 16 94 16 114 54 C94 92 26 92 6 54Z" stroke-width="7"/><g stroke-width="6"><path d="M60 30 V78 M36 54 H84"/><path d="M43 37 L77 71 M77 37 L43 71"/></g><path d="M104 8 Q106 22 118 24 Q106 26 104 40 Q102 26 90 24 Q102 22 104 8Z" fill="var(--accent2,currentColor)" stroke="none"/></svg>`;
const S = {view:"home", lesson:null, cur:null, open:null, test:null, sheet:null, timer:null};
const probs = DATA.problems, byId = Object.fromEntries(probs.map(p => [p.id, p]));
const subDone = (s) => probs.filter(p => p.sub===s && save.solved[p.id]).length, subAll = (s) => probs.filter(p => p.sub===s).length;
function parseNum(s){ s = String(s).trim().replace(/[−–]/g,"-").replace(/[$,]/g,"").replace(/\s+/g," ");
  let m = s.match(/^(-?)(\d+) (\d+)\/(\d+)$/); if (m) return (m[1]?-1:1)*(+m[2] + m[3]/m[4]);
  m = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/); if (m) return m[1]/m[2];
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s); return NaN; }
function evalExpr(src){ let s = String(src).replace(/[−–]/g,"-").replace(/[×x*·]/g,"*").replace(/÷/g,"/").replace(/[$,]/g,"").trim(); if (!s || /[^0-9+\-*\/().\s]/.test(s)) return NaN;
  const toks = [], re = /\s*(\d+\s+\d+\/\d+|\d*\.?\d+|[()+\-*\/])/y; let pos = 0, m; while (pos < s.length) { re.lastIndex = pos; m = re.exec(s); if (!m) break; toks.push(m[1]); pos = re.lastIndex; } if (s.slice(pos).trim()) return NaN;
  let i = 0; const peek = () => toks[i], eat = () => toks[i++];
  const numTok = (t) => { const q = t.match(/^(\d+)\s+(\d+)\/(\d+)$/); return q ? +q[1] + q[2] / q[3] : parseFloat(t); };
  function factor(){ const t = eat(); if (t === undefined) throw 0; if (t === "-") return -factor(); if (t === "(") { const v = expr(); if (eat() !== ")") throw 0; return v; } if (/^[\d.]/.test(t)) return numTok(t); throw 0; }
  function term(){ let v = factor(); while (peek() === "*" || peek() === "/") { const o = eat(), r = factor(); v = o === "*" ? v * r : v / r; } return v; }
  function expr(){ let v = term(); while (peek() === "+" || peek() === "-") { const o = eat(), r = term(); v = o === "+" ? v + r : v - r; } return v; }
  try { const v = expr(); return i === toks.length && isFinite(v) ? v : NaN; } catch(e) { return NaN; } }
const answerVal = (v) => { const x = parseNum(v); return isNaN(x) ? evalExpr(v) : x; };
const isExpr = (v) => isNaN(parseNum(v)) && !isNaN(evalExpr(v));
function fmtVal(x){ if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x)); for (let d = 2; d <= 12; d++) { const n = x * d; if (Math.abs(n - Math.round(n)) < 1e-9) { const w = Math.floor(Math.abs(n) / d), r = Math.abs(Math.round(n)) - w * d; return (x < 0 ? "-" : "") + (w ? w + " " : "") + r + "/" + d; } } return String(+x.toFixed(4)); }
const isRight = (p, v) => p.kind === "choice" ? v === p.correct : Math.abs(parseNum(v) - p.answer) <= (p.tol || 1e-9);   // a plain number only
const isSetup = (p, v) => p.kind !== "choice" && isExpr(v) && Math.abs(evalExpr(v) - p.answer) <= (p.tol || 1e-9);   // the problem written out: right idea, not an answer yet
const SETUP_MSG = "That's the right setup. Now work it out and type just the number.";
function barModel(m, full){ const W = 360, pad = 8, groups = Math.ceil(m.pieces / m.chunk), n = groups * m.chunk, cw = (W - 2 * pad) / n, y0 = 34, bh = 36; let s = `<svg viewBox="0 0 ${W} ${full ? 128 : 92}" class="bm" role="img" aria-label="Bar picture: ${esc(m.start)} drawn as ${m.pieces} pieces of size ${esc(m.piece)}">`;
  s += `<text x="${W / 2}" y="18" text-anchor="middle" class="bmt">${esc(m.start)} is ${m.pieces} piece${m.pieces === 1 ? "" : "s"} of ${esc(m.piece)}</text>`;
  for (let i = 0; i < n; i++) s += `<rect x="${pad + i * cw}" y="${y0}" width="${cw}" height="${bh}" rx="3" class="${i < m.pieces ? "bf" : "be"}"/>`;
  if (full) { for (let g = 0; g < groups; g++) s += `<rect x="${pad + g * m.chunk * cw + 1}" y="${y0 - 3}" width="${m.chunk * cw - 2}" height="${bh + 6}" rx="6" class="bg"/>`;
    s += `<text x="${W / 2}" y="${y0 + bh + 26}" text-anchor="middle" class="bmt">groups of ${esc(m.div)} (${m.chunk} piece${m.chunk === 1 ? "" : "s"} each)</text><text x="${W / 2}" y="${y0 + bh + 46}" text-anchor="middle" class="bmt big">${m.pieces} ÷ ${m.chunk} = ${esc(m.count)} group${m.count === "1" ? "" : "s"}</text>`; }
  else s += `<text x="${W / 2}" y="${y0 + bh + 24}" text-anchor="middle" class="bmt">How many groups of ${m.chunk} piece${m.chunk === 1 ? "" : "s"} fit in ${m.pieces}?</text>`;
  return s + "</svg>"; }
function senseCard(s){ const el = $(`<div class="say"><b>Quick check</b><p style="margin:6px 0 10px">${esc(s.q)}</p><div class="row">${s.options.map((o, i) => `<button class="btn" data-i="${i}">${esc(o)}</button>`).join("")}</div><p class="sres" style="margin:10px 0 0" aria-live="polite"></p></div>`);
  el.querySelector(".row").onclick = e => { const b = e.target.closest("button"); if (!b) return; const ok = +b.dataset.i === s.correct; el.querySelector(".sres").textContent = (ok ? "Yes. " : "Not quite. ") + s.why; }; return el; }
const exprNote = (p, v, right) => { if (p.kind === "choice" || !isExpr(v)) return ""; if (right) return `That works out to ${fmtVal(answerVal(v))}. `; return (!/[()]/.test(v) && (String(v).match(/\//g) || []).length >= 2) ? "Tip: put each fraction in parentheses, like (3/4)/(1/2). " : ""; };
function graphSVG(g){ const W=380,H=270,L=46,B=38,T=14,R=18,pw=W-L-R,ph=H-T-B,X=v=>L+v/g.xmax*pw,Y=v=>T+ph-v/g.ymax*ph; let s=`<svg class="g" viewBox="0 0 ${W} ${H}" role="img" aria-label="A graph">`;
  for(let i=0;i<=g.xmax;i++) s+=`<line class="gr" x1="${X(i)}" y1="${T}" x2="${X(i)}" y2="${T+ph}"/><text x="${X(i)}" y="${T+ph+18}" text-anchor="middle">${i}</text>`;
  const ys = g.ymax>10?2:1; for(let i=0;i<=g.ymax;i+=ys) s+=`<line class="gr" x1="${L}" y1="${Y(i)}" x2="${L+pw}" y2="${Y(i)}"/><text x="${L-8}" y="${Y(i)+4}" text-anchor="end">${i}</text>`;
  s+=`<line class="ax" x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}"/><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}"/>`;
  g.lines.forEach((ln,i)=>{ s+=`<polyline class="${i?'ln2':'ln'}" points="${ln.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`; if(ln.label){const e=ln.pts[ln.pts.length-1]; s+=`<text class="lb" x="${X(e[0])+6}" y="${Y(e[1])+4}">${ln.label}</text>`;}});
  (g.dots||[]).forEach(d=>{ s+=`<circle class="dot" cx="${X(d[0])}" cy="${Y(d[1])}" r="5"/><text class="lb" x="${X(d[0])-8}" y="${Y(d[1])-10}" text-anchor="end">(${d[0]}, ${d[1]})</text>`;});
  return s+`<text x="${L+pw/2}" y="${H-4}" text-anchor="middle">${g.xl}</text><text x="12" y="${T+ph/2}" transform="rotate(-90 12 ${T+ph/2})" text-anchor="middle">${g.yl}</text></svg>`; }
const tableHTML = (t) => `<div class="tw"><table class="t"><tr><th>x</th>${t.x.map(v=>`<td>${esc(v)}</td>`).join("")}</tr><tr><th>y</th>${t.y.map(v=>`<td>${esc(v)}</td>`).join("")}</tr></table></div>`;
const visual = (p) => p.graph ? graphSVG(p.graph) : p.table ? tableHTML(p.table) : "";

      const hb = $(`<div class="row"></div>`); const w = $(`<button class="btn ghost">Why am I learning this?</button>`); w.onclick = () => openSheet("why", p); const u = $(`<button class="btn ghost">What does this use?</button>`); u.onclick = () => openSheet("deps", p); hb.append(w, u); if ((p.facts || []).length || p.shortcut) { const f = $(`<button class="btn ghost">Math facts and shortcuts</button>`); f.onclick = () => openSheet("facts", p); hb.append(f); } act.append(hb); if (p.sense) act.append(senseCard(p.sense)); }
    if (st.steps) act.append($(`<div class="say"><b>How it works</b><ol class="steps">${p.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><p style="margin:0"><b>Answer:</b> ${esc(p.show)}</p></div>`));
  };
  function helpMenu(p){ const bg = $(`<div class="sheetbg"><div class="sheet pop" role="dialog" aria-modal="true" aria-label="Help"><h2>Need something else?</h2><button class="btn" id="w">Why am I learning this?</button><button class="btn" id="u">What does this use?</button>${(p.facts || []).length || p.shortcut ? '<button class="btn" id="f">Math facts and shortcuts</button>' : ""}<button class="btn primary" id="c">Back to the problem</button></div></div>`);
    const root = document.getElementById("sheet"); root.innerHTML = ""; root.append(bg); const shut = () => { root.innerHTML = ""; }; bg.onclick = e => { if (e.target === bg) shut(); };
    bg.querySelector("#c").onclick = shut; bg.querySelector("#w").onclick = () => openSheet("why", p); bg.querySelector("#u").onclick = () => openSheet("deps", p); if (bg.querySelector("#f")) bg.querySelector("#f").onclick = () => openSheet("facts", p); bg.querySelector("#c").focus(); }
  function check(v){ if (v === null || v === "" || v === undefined) { st.msg = p.kind==="choice" ? "Pick an answer first." : "Type an answer first."; st.win = false; return draw(); }
    if (isSetup(p, v)) { st.win = false; st.msg = SETUP_MSG; st.input = ""; return draw(); }
    res.tries++; if (isRight(p, v)) { res.done = true; recordStat(p, res, st); const clean = res.tries === 1 && res.hints === 0; if (clean && !st.flagged) { const w = save.work && save.work[base.id]; if (w) { w.c = (w.c || 0) + 1; if (w.c >= 3) delete save.work[base.id]; persist(); } } else flagWork(base.id, st); if (st.v < 0) { save.solved[p.id] = true; if (clean) save.clean[p.id] = true; } else if ((m.rev || []).includes(base.id)) baseRes.done = true; bump(); persist(); st.win = true; st.msg = exprNote(p, v, true) + (clean ? "You did that on your own. " + WIN[(m.i*2)%WIN.length] : WIN[(m.i*2+1)%WIN.length]); S.cur = st; render(); burst(document.querySelector(".say.win")); return; }
    if (!isSetup(p, v)) flagWork(base.id, st);
    st.win = false; st.msg = exprNote(p, v, false) + "Not quite yet. Try again, or tap I'm stuck."; st.input = ""; st.shake = true; persist(); render(); }
  const solvedNow = res.done; if (solvedNow && !st.msg) { st.win = true; st.msg = "Got it!"; }
  draw(); el.append(card); return el; },
summary(){ const m = save.mission, n = m ? m.ids.length : 0, ok = m ? m.ids.filter(id => m.res[id] && m.res[id].done).length : 0, clean = m ? m.ids.filter(id => save.clean[id] && m.res[id] && m.res[id].tries === 1 && m.res[id].hints === 0).length : 0;
  const el = $(`<div class="stack"><header><h1>That's a wrap!</h1></header><section class="card"><div class="big-n">${ok}</div><p class="lead">problem${ok===1?"":"s"} solved${clean?`, ${clean} with no help`:""}. That's real progress.</p></section>
  <button class="btn primary big" id="again">Encore: another mission</button><div class="row"><button class="btn" id="brk">Take a 2-minute break</button><button class="btn" id="home">I'm done for now</button></div></div>`);
  save.mission = null; persist(); el.querySelector("#again").onclick = () => buildMission(null); el.querySelector("#brk").onclick = () => go("brk"); el.querySelector("#home").onclick = () => go("home"); return el; },
brk(){ let left = 120; const el = $(`<div class="stack"><header><h1>Intermission</h1><p class="sub">Your brain works better after a break. Pick any.</p></header><section class="card"><ul class="steps"><li>Stand up and stretch your arms up high.</li><li>Drink some water.</li><li>Look out a window for 20 seconds.</li></ul><div class="timer" id="tm" aria-live="off">2:00</div><button class="btn primary big" id="start">Start a 2-minute timer</button></section><button class="btn" id="home">Back to home</button></div>`);
  el.querySelector("#home").onclick = () => go("home"); el.querySelector("#start").onclick = e => { e.target.disabled = true; clearInterval(S.timer); S.timer = setInterval(() => { left--; const tm = document.getElementById("tm"); if (tm) tm.textContent = Math.floor(left/60) + ":" + String(left%60).padStart(2,"0"); if (left <= 0) { clearInterval(S.timer); if (tm) tm.textContent = "Ready when you are."; } }, 1000); }; return el; },
testIntro(){ const el = $(`<div class="stack"></div>`); el.append(backBar("Home", () => go("home")), $(`<section class="card"><p class="eyebrow">Dress rehearsal</p><h2>Practice test: 14 questions, no hints</h2><p class="lead muted">Two from each lesson, mixed up like the real test. At the end you see which lessons to look at again. You can stop anytime.</p><button class="btn primary big" id="st">Start the test</button></section>`)); el.querySelector("#st").onclick = () => { const picks = []; DATA.subs.forEach(s => picks.push(...probs.filter(p => p.sub === s).sort(() => Math.random()-.5).slice(0,2))); S.test = {list:picks.map(p => p.variants && Math.random() < .6 ? Object.assign({}, p, p.variants[Math.floor(Math.random()*p.variants.length)]) : p).sort(() => Math.random()-.5), i:0, ans:[], input:"", pick:null, all:false}; go("testQ"); }; return el; },
testQ(){ const T = S.test, p = T.list[T.i]; const el = $(`<div class="stack"></div>`);
  const top = $(`<div class="top"><button class="btn quiet" id="exit">✕ Stop</button><span class="muted">Question ${T.i+1} of ${T.list.length}</span></div>`); top.querySelector("#exit").onclick = () => go("home"); el.append(top, $(`<div class="bar" aria-hidden="true"><i style="width:${T.i/T.list.length*100}%"></i></div>`));
  const c = $(`<section class="card"><p class="problem">${esc(p.text)}</p><div class="vis">${visual(p)}</div><div class="in"></div><button class="btn primary big nx">${T.i+1<T.list.length?"Next":"Finish"}</button><span class="ref" aria-label="Reference number">#${p.ref}</span></section>`), inp = c.querySelector(".in");
  const draw = () => { inp.innerHTML = ""; if (p.kind === "choice") { const o = $(`<div class="opts">${p.options.map((t,i)=>`<button aria-pressed="${T.pick===i}" data-i="${i}">${esc(t)}</button>`).join("")}</div>`); o.onclick = e => { const b = e.target.closest("button"); if (b) { T.pick = +b.dataset.i; draw(); } }; inp.append(o); }
    else { inp.append($(`<div class="answer">${T.input ? esc(T.input) : '<span class="ph">Tap the numbers below</span>'}</div>`)); const keys = ["7","8","9","⌫","4","5","6","−","1","2","3","/","0",".","(",")","×","÷","+","␣"]; const pad = $(`<div class="pad">${keys.map(k=>`<button data-k="${k}" class="${k==='␣'?'sp':''}">${k==="␣"?"space":k}</button>`).join("")}</div>`); pad.onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k; T.input = k==="⌫" ? T.input.slice(0,-1) : (T.input.length < 14 ? T.input + (k==="␣" ? " " : k) : T.input); draw(); }; inp.append(pad); } };
  draw(); c.querySelector(".nx").onclick = () => { T.ans[T.i] = p.kind==="choice" ? T.pick : T.input; T.input = ""; T.pick = null; if (T.i+1 < T.list.length) { T.i++; go("testQ"); } else go("testDone"); }; el.append(c); return el; },
testDone(){ const T = S.test, right = T.list.filter((p,i) => isRight(p, T.ans[i])).length, rev = [...new Set(T.list.filter((p,i) => !isRight(p, T.ans[i])).map(p => p.sub))].sort();
  const el = $(`<div class="stack"><header><h1>Test finished</h1></header><section class="card"><div class="big-n">${right}<span class="muted" style="font-size:28px"> of ${T.list.length}</span></div><p class="lead">${rev.length ? "Look at these lessons again:" : "Every lesson looks solid. Nice work."}</p><div class="row">${rev.map(s=>`<button class="btn" data-s="${s}">${s} · ${esc(DATA.lessons[s].title)}</button>`).join("")}</div></section><button class="btn primary big" id="again">Try a new test</button><button class="btn" id="see">${T.all?"Hide my answers":"See my answers"}</button><button class="btn quiet" id="home">Home</button></div>`);
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => buildMission(b.dataset.s)); el.querySelector("#again").onclick = () => go("testIntro"); el.querySelector("#home").onclick = () => go("home"); el.querySelector("#see").onclick = () => { T.all = !T.all; render(); };
  if (T.all) { const res = $(`<div class="res"></div>`); T.list.forEach((p,i) => { const ok = isRight(p, T.ans[i]), mine = p.kind==="choice" ? (T.ans[i]==null ? "(no answer)" : p.options[T.ans[i]]) : (T.ans[i] || "(no answer)"); res.append($(`<div class="it"><span>${esc(p.text)} <small class="muted">#${p.ref}</small></span><span>Your answer: ${esc(mine)}</span>${ok?'<span class="ok">Got it ✓</span>':`<span class="rv">Look at lesson ${p.sub}. Answer: ${esc(p.show)}</span>`}</div>`)); }); el.insertBefore(res, el.querySelector("#home")); } return el; }
};
/* Coming back from MathFacts ("Practice it"): return to the same problem, hints and typing included. */
if (save.cur && save.mission && save.mission.ids[save.mission.i] === save.cur.id) { S.cur = save.cur; S.view = "mission"; }
if (save.cur) { save.cur = null; persist(); }
render();
</script>
