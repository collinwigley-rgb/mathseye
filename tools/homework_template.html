<title>Unit 2 Homework</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/*STUDY_STYLE*/
.snip{color:var(--muted);font-size:16px;display:block;margin-top:2px}.item{background:var(--panel);width:100%;text-align:left;padding:16px 18px;min-height:64px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.done{color:var(--good);font-weight:600;white-space:nowrap}.hd{font-family:var(--display);font-size:20px;margin:6px 0 0}
.pics{display:flex;flex-wrap:wrap;gap:10px;margin:0}.pics img{max-width:100%;max-height:340px;border-radius:12px;background:#fff;border:1px solid var(--line)}.pg{margin:0;font-size:.85rem;color:var(--muted)}
body.learning #app{max-width:1180px;margin:0 auto;height:calc(100dvh - 34px);padding:8px 14px calc(8px + env(safe-area-inset-bottom));box-sizing:border-box;display:flex;flex-direction:column}
.lscreen{flex:1;min-height:0;display:flex}.card.learn{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:12px 18px 10px;margin:0}
.ltop{display:flex;align-items:center;gap:14px}.ltop .back{padding:6px 4px;min-height:0;white-space:nowrap}.dots{display:flex;gap:6px;flex:1}.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}.dots i.past{background:var(--muted)}.dots i.on{background:var(--accent,#e8b04a)}
.lhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.lhead h2{margin:0;font-size:clamp(1.3rem,3.2vmin,1.9rem)}.lhead .eyebrow{margin:0}
.lmain{flex:1;min-height:0;display:grid;gap:14px;grid-template-columns:1.15fr 1fr}.lmain.nopic{grid-template-columns:1fr}
.lpics{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}.pw{flex:1 1 0;min-height:0;min-width:0}.pw img{width:100%;height:100%;object-fit:contain;object-position:center;border-radius:12px;background:#fff;border:1px solid var(--line);box-sizing:border-box}
.ltext{min-height:0;overflow:auto;font-size:clamp(1rem,2.3vmin,1.25rem)}.ltext .problem{font-size:inherit;margin:0 0 8px}.ltext .steps li{margin:6px 0}.ltext .pts li{font-size:inherit;margin:8px 0}.ltext .opt{font-size:inherit;padding:10px 14px;margin:6px 0}.ltext .say{margin:8px 0}
.card.learn .act .row{display:flex;gap:10px}.card.learn .act .btn{flex:1;min-height:0;padding:10px 16px}.card.learn .act .btn.ghost{flex:0 0 auto}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:0}.lfoot .ref{position:static}
@media (max-aspect-ratio:1/1){.lmain{grid-template-columns:1fr;grid-template-rows:minmax(0,.9fr) minmax(0,1fr)}.lmain.nopic{grid-template-rows:1fr}.lpics{flex-direction:row}}
.pagebg{align-items:stretch}.pagesheet{width:min(96vw,900px);max-height:96dvh;height:96dvh;display:flex;flex-direction:column;padding:10px}.pghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.pgscroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}.pgscroll img{width:100%;display:block;border-radius:8px}.pagebtn{align-self:flex-start;margin:6px 0 0}.lfoot .pagebtn{margin:0;padding:6px 14px;min-height:0;font-size:.95rem}
.zhost{position:relative}.zoomicon{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:#2b2350;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.2)}.lhead.zhost .zoomicon,.pe.zhost .zoomicon{position:static;display:inline-grid;width:34px;height:34px;margin-left:auto}
.ways{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.wt{border:2px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:6px 14px;font:inherit;font-size:.95rem;cursor:pointer}.wt.on{border-color:var(--accent,#e8b04a);background:rgba(232,176,74,.18);font-weight:600}
.wnote{margin:0 0 8px}.rt{display:grid;gap:6px;margin:6px 0 10px;overflow-x:auto}.rr{display:flex;gap:6px;align-items:center}.rr b{min-width:34px}.rr span{flex:1;min-width:44px;text-align:center;padding:8px 4px;border-radius:10px;border:2px solid var(--line);font-variant-numeric:tabular-nums}.rr span.hit{border-color:#7bc27b;font-weight:700}
.blocks{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.blk{flex:1 1 60px;padding:0 4px;min-height:56px;border-radius:12px;border:2px dashed var(--line);background:transparent;color:inherit;font:inherit;cursor:pointer}.blk.on{border:2px solid var(--accent,#e8b04a);background:rgba(232,176,74,.22);font-weight:600}
.zl{display:block;margin:6px 0}.zl input{display:block;width:100%;height:36px;margin-top:6px}.bars{display:grid;gap:8px;margin:8px 0}.bar{position:relative;height:30px;border-radius:8px;background:var(--line);overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px}.bar .bd{background:#4a7fc0}.bar .br{background:#e8704a}.bar small{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#fff;font-weight:600}
.learnbtn{display:block;width:100%;text-align:left;padding:16px 18px;border-radius:16px;border:2px solid var(--accent,#e8b04a);background:transparent;color:inherit;font:inherit;cursor:pointer;margin:0 0 6px}.learnbtn b{display:block;font-size:1.25rem}.learnbtn span{color:var(--muted)}.learnbtn.small{padding:10px 14px}.learnbtn.small b{font-size:1rem}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:14px;border:2px solid var(--line);background:transparent;color:inherit;font:inherit;font-size:1.1rem;cursor:pointer}.opt.good{border-color:#7bc27b}.opt.try{border-color:var(--accent,#e8b04a)}.term.open{border-color:var(--accent,#e8b04a)}.term span{display:block;margin-top:6px;color:var(--muted)}.pts li{margin:10px 0;font-size:1.1rem}
.fig{margin:0;padding:12px 16px;border:2px dashed var(--line);border-radius:14px;color:var(--muted)}
.errmsg{color:var(--accent);margin:0}
.card>.eyebrow.pe{padding-right:9em}
</style>
<div id="app"></div><div id="sheet"></div>
<script src="../profile.js"></script>
<script src="../build.js"></script>
<script src="../feedback.js"></script>
<script src="../sync.js"></script>
<script src="../fractions.js"></script>
<script src="../keypad.js"></script>
<script>
function shortWhy(p){ const ss = (p.steps || []).filter(s => !/^Another way/.test(s)); return ss.length ? ss[ss.length-1] : ""; }
const DATA = __DATA__;
const BRANDS = __BRANDS__;
__BURST__
const getBrand = () => { try { const v = localStorage.getItem("mathseye.brand"); if (BRANDS.some(b => b.id === v)) return v; } catch(e) {} return "classic"; };
const applyBrand = (id) => { document.documentElement.dataset.brand = id; };
applyBrand(getBrand());
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LV = {foundation:"Base skill", builds:"Builds on one earlier lesson", mixed:"Mixes several lessons"};
const LVTXT = {foundation:"This one mostly uses this lesson's skill plus things you learned in earlier grades.", builds:"This one uses this lesson's skill together with one earlier lesson from this unit.", mixed:"This one combines several lessons. If you get stuck, try the earlier lessons first."};
/*HELPERS*/
const MARK = `__MARK__`;
const PKEY = "mathseye.pack.unit2", HKEY = "mathseye.hw.unit2.v1" + (window.mathseyeNs || "");
let PACK = null; try { PACK = JSON.parse(localStorage.getItem(PKEY) || "null"); } catch(e) {}
let hw = {done:{}}; try { Object.assign(hw, JSON.parse(localStorage.getItem(HKEY) || "{}")); } catch(e) {}
const persist = () => { try { localStorage.setItem(HKEY, JSON.stringify(hw)); } catch(e) {} window.mathseyeSync && mathseyeSync.touch(); };
const S = {view:"home", sub:null, id:null, hints:0, shown:false, steps:false, msg:"", alt:null, err:""};
const ORDER = ["2.1","2.2","2.3","2.4","2.5","2.6","2.8","review","extra"];
const SHEETS = [["lesson","From the lesson pages"],["practice","Extra practice"],["review","Topic review"],["extra","Recovery packet"]];
const subTitle = (s) => s === "review" ? "Topic review" : s === "extra" ? "Recovery packet" : (DATA.lessons[s] ? DATA.lessons[s].title : s);
const whyFor = (sub) => (DATA.lessons[sub] && DATA.lessons[sub].why) || (PACK && PACK.why && PACK.why[sub]) || null;
const packBy = (sub) => PACK.problems.filter(p => p.sub === sub);
const isPack = (o) => o && o.format === "mathseye-homework-pack" && o.unit === 2 && Array.isArray(o.problems) && o.problems.length && o.problems.every(p => p.id && p.text && Array.isArray(p.hints) && p.sub);
function importText(text, cb){ try { const o = JSON.parse(text); if (!isPack(o)) throw new Error("That isn't a Unit 2 homework pack."); localStorage.setItem(PKEY, JSON.stringify(o)); PACK = o; cb(""); } catch(e) { cb(e.message || "Couldn't read the pack."); } }
/* The pack lives on the server (not in git). Fetch it when the page opens: show the saved copy right away, refresh quietly. */
let LOADING = !PACK, LOADFAIL = false;
function fetchPack(){ return fetch("/api/pack?unit=2", {cache: "no-store"}).then(r => r.ok ? r.text() : Promise.reject(r.status)).then(t => {
    const had = PACK ? JSON.stringify(PACK) : ""; let o; try { o = JSON.parse(t); } catch(e) { throw 0; } if (!isPack(o)) throw 0;
    if (JSON.stringify(o) !== had) { try { localStorage.setItem(PKEY, JSON.stringify(o)); } catch(e) {} const first = !PACK; PACK = o; if (first || S.view === "home") render(); }
    LOADING = false; LOADFAIL = false; }).catch(() => { LOADING = false; if (!PACK) { LOADFAIL = true; render(); } }); }
function importFile(file, cb){ const r = new FileReader(); r.onerror = () => cb("Couldn't read that file."); r.onload = () => importText(r.result, cb); r.readAsText(file); }

/* ---------- help sheets ---------- */
function openSheet(kind, p){ const root = document.getElementById("sheet"); root.innerHTML = ""; let more = false;
  const draw = () => { root.innerHTML = ""; const w = whyFor(p.sub); let body;
    if (kind === "why") body = `<h2>Why am I learning this?</h2><p class="lead">${esc(p.why_focus || "")}</p>${w ? `<dl><dt>Why you need it</dt><dd>${esc(w.why_you_need_it)}</dd><dt>Where you'll see it</dt><dd>${esc(w.real_life)}</dd>${more ? `<dt>The goal</dt><dd>${esc(w.goal)}</dd><dt>How it helps later</dt><dd>${esc(w.supports_future)}</dd><dt>Building block</dt><dd>${esc(w.building_block)}</dd>` : ""}</dl>${more ? "" : '<button class="btn quiet" id="more">Tell me more</button>'}` : ""}`;
    else { const d = p.deps || {level:"foundation", concepts:[]}; body = `<h2>What does this use?</h2><div><span class="lvl">${LV[d.level] || ""}</span></div><p class="lead">${LVTXT[d.level] || ""}</p><ul class="cl">${(d.concepts || []).filter(c => DATA.concepts[c]).map(c => { const k = DATA.concepts[c]; return `<li><span><b>${esc(k.name)}</b><small>${esc(k.plain)}</small></span><span class="tag">${esc(k.origin)}</span></li>`; }).join("")}</ul>`; }
    const bg = $(`<div class="sheetbg"><div class="sheet pop" role="dialog" aria-modal="true" aria-label="Help">${body}<button class="btn primary" id="close">Back to the problem</button></div></div>`);
    const shut = () => { root.innerHTML = ""; }; bg.onclick = e => { if (e.target === bg) shut(); }; bg.querySelector("#close").onclick = shut; const m = bg.querySelector("#more"); if (m) m.onclick = () => { more = true; draw(); };
    root.append(bg); bg.querySelector("#close").focus(); };
  draw(); }
function helpMenu(p){ const root = document.getElementById("sheet"); root.innerHTML = ""; const bg = $(`<div class="sheetbg"><div class="sheet pop" role="dialog" aria-modal="true" aria-label="Help"><h2>Need something else?</h2><button class="btn" id="w">Why am I learning this?</button><button class="btn" id="u">What does this use?</button><button class="btn primary" id="c">Back to the problem</button></div></div>`);
  const shut = () => { root.innerHTML = ""; }; bg.onclick = e => { if (e.target === bg) shut(); }; bg.querySelector("#c").onclick = shut; bg.querySelector("#w").onclick = () => openSheet("why", p); bg.querySelector("#u").onclick = () => openSheet("deps", p); root.append(bg); bg.querySelector("#c").focus(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("sheet").innerHTML = ""; });

/* whole printed page, on demand */
function pageSheet(sub, pg){ const root = document.getElementById("sheet"); root.innerHTML = "";
  const bg = $(`<div class="sheetbg pagebg"><div class="sheet pop pagesheet" role="dialog" aria-modal="true" aria-label="Page ${pg}"><div class="pghead"><b>Page ${pg}</b><button class="btn primary" id="close">Close</button></div><div class="pgscroll"><img src="/api/img?f=${encodeURIComponent(sub + "_page" + pg + ".jpg")}" alt="Your book, page ${pg}"></div></div></div>`);
  const shut = () => { root.innerHTML = ""; }; bg.onclick = e => { if (e.target === bg) shut(); }; bg.querySelector("#close").onclick = shut; root.append(bg); bg.querySelector("#close").focus(); }
const ZOOM = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l5.5 5.5M7.5 10h5"/></svg>`;
const pageBtn = (sub, pg) => { const b = $(`<button class="zoomicon" aria-label="See the whole page (${pg})" title="See the whole page (${pg})">${ZOOM}</button>`); b.onclick = e => { e.stopPropagation(); pageSheet(sub, pg); }; return b; };
function wayView(c, way, body){ const C = c.calc || {per:1, len:1, from:"in.", to:"ft"}, f = fmtN;
  if (way === "table") { const n = Math.min(S.tbl || 1, C.len), cols = Array.from({length:n}, (_, i) => i + 1);
    body.innerHTML = `<p class="wnote">Tap to build the table one inch at a time. Every inch adds ${f(C.per)} ${C.to}.</p><div class="rt"><div class="rr"><b>${C.from}</b>${cols.map(i => `<span>${i}</span>`).join("")}</div><div class="rr"><b>${C.to}</b>${cols.map(i => `<span class="${i === C.len ? "hit" : ""}">${f(i * C.per)}</span>`).join("")}</div></div>`;
    if (n < C.len) { const b = $(`<button class="btn primary">Add 1 more inch</button>`); b.onclick = () => go("learn", {tbl:n + 1}); body.append(b); }
    else body.append($(`<p class="say win">${C.len} ${C.from} lines up with ${f(C.len * C.per)} ${C.to}. That is the real length.</p>`)); }
  else if (way === "groups") { const n = Math.min(S.grp || 0, C.len);
    body.innerHTML = `<p class="wnote">Each block is 1 inch on the drawing. Tap a block to turn it into ${f(C.per)} ${C.to} of real life.</p><div class="blocks">${Array.from({length:C.len}, (_, i) => `<button class="blk ${i < n ? "on" : ""}" data-i="${i}" aria-label="Block ${i + 1}">${i < n ? f(C.per) + " " + C.to : "1 " + C.from}</button>`).join("")}</div><p class="say ${n === C.len ? "win" : ""}">${n ? `${n} block${n > 1 ? "s" : ""} × ${f(C.per)} ${C.to} = ${f(n * C.per)} ${C.to}` : "Tap the first block."}${n === C.len ? ` That is the real length: ${C.len} groups of ${f(C.per)}.` : ""}</p>`;
    body.querySelectorAll(".blk").forEach(b => b.onclick = () => go("learn", {grp:Math.max(n, +b.dataset.i + 1)})); }
  else if (way === "zoom") { const v = S.zoom == null ? 1 : S.zoom;
    body.innerHTML = `<p class="wnote">Slide the drawing length and watch the real length grow by the same amount each time.</p><label class="zl">Drawing: <b class="zv">${f(v)}</b> ${C.from}<input type="range" min="0.5" max="${C.len}" step="0.5" value="${v}"></label><div class="bars"><div class="bar"><i class="bd" style="width:${v / (C.len * C.per) * 100}%"></i><small>drawing</small></div><div class="bar"><i class="br" style="width:${v * C.per / (C.len * C.per) * 100}%"></i><small>real</small></div></div><p class="say zt">${f(v)} ${C.from} on the drawing → <b>${f(v * C.per)} ${C.to}</b> in real life (${f(v)} × ${f(C.per)})</p>`;
    const inp = body.querySelector("input"); inp.oninput = () => { const x = +inp.value; S.zoom = x; body.querySelector(".zv").textContent = f(x); body.querySelector(".bd").style.width = (x / (C.len * C.per) * 100) + "%"; body.querySelector(".br").style.width = (x / C.len * 100) + "%"; body.querySelector(".zt").innerHTML = `${f(x)} ${C.from} on the drawing → <b>${f(x * C.per)} ${C.to}</b> in real life (${f(x)} × ${f(C.per)})`; }; }
  else if (way === "estimate") { const E = c.est;
    body.innerHTML = `<p class="wnote">${esc(E.q)}</p>` + E.opts.map((o, i) => `<button class="opt ${S.est === i ? (o.ok ? "good" : "try") : ""}" data-i="${i}">${esc(o.t)}</button>`).join("") + (S.est != null ? `<p class="say ${E.opts[S.est].ok ? "win" : ""}" role="status">${esc(E.opts[S.est].say)}${E.opts[S.est].ok ? " " + esc(E.after) : ""}</p>` : "");
    body.querySelectorAll(".opt").forEach(b => b.onclick = () => go("learn", {est:+b.dataset.i})); } }
/* ---------- navigation ---------- */
function go(view, extra){ Object.assign(S, extra || {}, {view}); render(); window.scrollTo(0, 0); }
function render(){ const app = document.getElementById("app"); app.innerHTML = ""; document.body.classList.toggle("learning", S.view === "learn"); app.append(VIEWS[S.view]()); const h = app.querySelector("h1,h2"); if (h) { h.tabIndex = -1; h.focus({preventScroll:true}); } }
const backBar = (label, fn) => { const t = $(`<div class="top"><button class="btn quiet">← ${label}</button></div>`); t.querySelector("button").onclick = fn; return t; };
const logo = () => `<a class="logo" href="../" aria-label="Mathseye, back to home">${MARK}<span class="wm">MATHSEYE</span></a>`;

/* ---------- alternates: same lesson, same kind of problem, new numbers ---------- */
function newAlt(p){ const bySub = DATA.problems.filter(x => x.sub === p.sub), same = bySub.filter(x => x.type === p.type); const pool = same.length ? same : (bySub.length ? bySub : DATA.problems);
  const base = pool[Math.floor(Math.random() * pool.length)], all = [base, ...base.variants.map(v => Object.assign({}, base, v))]; let pick = all[0];
  for (let i = 0; i < 6; i++) { pick = all[Math.floor(Math.random() * all.length)]; if (!S.alt || pick.text !== S.alt.p.text) break; }
  S.alt = {p:pick, input:"", pick:null, hints:0, tries:0, solved:false, steps:false, msg:"", win:false}; }

const LRESET = {step:0, pick:null, flip:null, way:null, tbl:1, grp:0, zoom:null, est:null};
const fmtN = x => String(+(+x).toFixed(2));
const VIEWS = {
home(){ const el = $(`<div class="stack"><header>${logo()}<h1 style="margin-top:14px">Unit 2 Homework</h1><p class="sub">You work each problem on your worksheet. I give nudges, never just the answer.</p></header></div>`);
  const file = $(`<input type="file" accept=".json,application/json" id="f" hidden>`); el.append(file);
  const pick = () => file.click(); file.onchange = () => { if (file.files[0]) importFile(file.files[0], err => { S.err = err; render(); }); };
  if (!PACK) { const c = $(`<section class="card"><p class="eyebrow">Getting ready</p><h2>${LOADFAIL ? "Couldn't get the homework" : "Getting the homework…"}</h2><p class="lead muted">${LOADFAIL ? "Check the internet and try again." : "One moment."}</p>${S.err ? `<p class="errmsg" role="alert">${esc(S.err)}</p>` : ""}${LOADFAIL ? `<button class="btn primary big" id="again">Try again</button><button class="btn quiet" id="pk">Or choose a pack file</button>` : ""}</section>`);
    if (LOADFAIL) { c.querySelector("#again").onclick = () => { LOADFAIL = false; LOADING = true; render(); fetchPack(); }; c.querySelector("#pk").onclick = pick; } el.append(c); return el; }
  const tiles = $(`<div class="tiles"></div>`);
  ORDER.filter(s => packBy(s).length).forEach(s => { const ps = packBy(s), d = ps.filter(p => hw.done[p.id]).length, b = $(`<button class="tile"><small>${/^\d/.test(s) ? "Lesson " + s : "Extra"}</small><b>${esc(subTitle(s))}</b><span class="bar" aria-hidden="true"><i style="width:${d / ps.length * 100}%"></i></span><small>${d} of ${ps.length} done</small></button>`); b.onclick = () => go("lesson", {sub:s}); tiles.append(b); });
  el.append(tiles);  if (S.err) el.append($(`<p class="errmsg" role="alert">${esc(S.err)}</p>`)); return el; },
lesson(){ const el = $(`<div class="stack"></div>`); el.append(backBar("Unit 2 Homework", () => go("home")), $(`<header><h1>${esc(subTitle(S.sub))}</h1><p class="sub">Pick the problem you're working on.</p></header>`));
  const L = PACK.lessons && PACK.lessons[S.sub];
  if (L) { const b = $(`<button class="learnbtn"><b>Learn it first</b><span>${L.cards.length} quick cards with the pictures from your book. Just tap.</span></button>`); b.onclick = () => go("learn", {card:0, ...LRESET, from:"lesson"}); el.append(b); }
  SHEETS.forEach(([sh, name]) => { const ps = packBy(S.sub).filter(p => p.sheet === sh); if (!ps.length) return; el.append($(`<h2 class="hd">${name}</h2>`));
    ps.forEach(p => { const b = $(`<button class="item"><span><b>${esc(p.label)}</b><span class="snip">${esc(p.text.length > 80 ? p.text.slice(0, 78) + "…" : p.text)}</span></span>${hw.done[p.id] ? '<span class="done">✓ done</span>' : ""}</button>`); b.onclick = () => go("prob", {id:p.id, hints:0, shown:false, steps:false, msg:""}); el.append(b); }); }); return el; },
learn(){ const L = PACK.lessons[S.sub], c = L.cards[S.card], n = L.cards.length, el = $(`<div class="lscreen"></div>`);
  const leave = () => S.from === "prob" ? go("prob", {id:S.id, hints:S.hints || 0, shown:!!S.shown, steps:false, msg:""}) : go("lesson");
  const dots = Array.from({length:n}, (_, i) => `<i class="${i === S.card ? "on" : i < S.card ? "past" : ""}"></i>`).join("");
  const pics = c.img && c.img.length ? `<div class="lpics n${c.img.length}">${c.img.map(f => `<div class="pw"><img src="/api/img?f=${encodeURIComponent(f)}" alt="Picture from your book"></div>`).join("")}</div>` : "";
  const card = $(`<section class="card learn"><div class="ltop"><button class="btn quiet back">← ${S.from === "prob" ? "Back to the problem" : esc(subTitle(S.sub))}</button><div class="dots" aria-label="Card ${S.card + 1} of ${n}">${dots}</div></div><div class="lhead"><p class="eyebrow">${esc(c.tag)}</p><h2>${esc(c.title)}</h2></div><div class="lmain ${pics ? "" : "nopic"}">${pics}<div class="ltext">${c.text ? `<p class="problem">${esc(c.text)}</p>` : ""}<div class="body"></div></div></div><div class="act"></div><div class="lfoot"></div></section>`);
  card.querySelector(".back").onclick = leave;
  const body = card.querySelector(".body"), act = card.querySelector(".act");
  const nav = (ok) => { const row = $(`<div class="row"></div>`);
    if (S.card > 0) { const b = $(`<button class="btn ghost">← Back</button>`); b.onclick = () => go("learn", {card:S.card - 1, ...LRESET}); row.append(b); }
    const last = S.card === n - 1, nx = $(`<button class="btn primary big">${last ? (S.from === "prob" ? "Back to the problem" : "I'm ready for the problems") : "Next →"}</button>`);
    nx.disabled = !ok; nx.onclick = () => last ? leave() : go("learn", {card:S.card + 1, ...LRESET}); row.append(nx); act.append(row); };
  const way = c.ways ? (S.way || "steps") : null;
  if (c.ways) { const tabs = $(`<div class="ways" role="tablist" aria-label="Another way to think about it">${c.ways.map(([id, nm]) => `<button role="tab" class="wt ${id === way ? "on" : ""}" aria-selected="${id === way}" data-w="${id}">${esc(nm)}</button>`).join("")}</div>`); tabs.querySelectorAll(".wt").forEach(b => b.onclick = () => go("learn", {way:b.dataset.w})); card.querySelector(".ltext").prepend(tabs); }
  if (way && way !== "steps") { wayView(c, way, body); nav(true); }
  else if (c.k === "steps") { body.innerHTML = `<ol class="steps">${c.steps.slice(0, S.step + 1).map(t => `<li>${esc(t)}</li>`).join("")}</ol>`;
    if (S.step < c.steps.length - 1) { const row = $(`<div class="row"></div>`);
      if (S.card > 0) { const bk = $(`<button class="btn ghost">← Back</button>`); bk.onclick = () => go("learn", {card:S.card - 1, ...LRESET}); row.append(bk); }
      const m = $(`<button class="btn primary big">Show the next step</button>`); m.onclick = () => go("learn", {step:S.step + 1}); row.append(m); act.append(row); } else nav(true); }
  else if (c.k === "choice") { body.innerHTML = c.options.map((o, i) => `<button class="opt ${S.pick === i ? (o.ok ? "good" : "try") : ""}" data-i="${i}">${esc(o.t)}</button>`).join("") + (S.pick != null ? `<p class="say ${c.options[S.pick].ok ? "win" : ""}" role="status">${esc(c.options[S.pick].say)}</p>` : "");
    body.querySelectorAll(".opt").forEach(b => b.onclick = () => go("learn", {pick:+b.dataset.i})); nav(S.pick != null); }
  else if (c.k === "key") { body.innerHTML = `<ul class="pts">${c.points.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`; nav(true); }
  else if (c.k === "words") { body.innerHTML = c.terms.map((t, i) => `<button class="opt term ${S.flip === i ? "open" : ""}" data-i="${i}"><b>${esc(t.t)}</b>${S.flip === i ? `<span>${esc(t.d)}</span>` : ""}</button>`).join(""); body.querySelectorAll(".term").forEach(b => b.onclick = () => go("learn", {flip:S.flip === +b.dataset.i ? null : +b.dataset.i})); nav(true); }
  const foot = card.querySelector(".lfoot"); foot.append($(`<span class="ref" aria-label="Reference number">#${c.ref || ""}</span>`));
  if (window.mathseyeFeedback) foot.prepend(mathseyeFeedback.button(() => ({ref: "#" + c.ref, text: [c.title, c.text || "", (c.img || []).join(", ")].filter(Boolean).join(" · "), where: "Homework · Learn it first · " + subTitle(S.sub) + " · " + c.tag, extra: {card: c.id}})));
  if (c.pg) { const z = pageBtn(S.sub, c.pg); const host = card.querySelector(".lpics") || card.querySelector(".lhead"); host.classList.add("zhost"); host.append(z); }
  el.append(card); return el; },
prob(){ const p = PACK.problems.find(x => x.id === S.id), el = $(`<div class="stack"></div>`), done = !!hw.done[p.id];
  el.append(backBar("Back", () => go("lesson")));
  const LL = PACK.lessons && PACK.lessons[p.sub], lc = LL && LL.links[p.id];
  if (lc) { const b = $(`<button class="learnbtn small"><b>Show me how this works</b><span>A quick look at the idea behind this one.</span></button>`); b.onclick = () => go("learn", {sub:p.sub, card:LL.cards.findIndex(c => c.id === lc), ...LRESET, from:"prob", id:p.id, hints:S.hints, shown:S.shown}); el.append(b); }
  const card = $(`<section class="card"><p class="eyebrow pe">${esc(subTitle(p.sub))} · ${esc(p.label)}</p><p class="problem">${esc(p.text)}</p>${p.img && p.img.length ? `<p class="pics">${p.img.map(i => `<img src="/api/img?f=${encodeURIComponent(i.f)}" alt="Picture from the worksheet, page ${i.pg}" loading="lazy">`).join("")}</p>` : p.figure ? `<p class="fig">Look at the picture on your worksheet. ${esc(p.figure)}</p>` : ""}<div class="vis">${p.table && Array.isArray(p.table.x) ? tableHTML(p.table) : ""}</div><p class="say">Work it out on your worksheet first. Tap I'm stuck any time for a nudge.</p><ul class="nudges"></ul><div class="act"></div><span class="ref" aria-label="Reference number">#${p.ref || ""}</span></section>`);
  const nud = card.querySelector(".nudges"), act = card.querySelector(".act");
  if (p.pg) { const host = card.querySelector(".pics") || card.querySelector(".pe"); host.classList.add("zhost"); host.append(pageBtn(p.sub, p.pg)); }
  const draw = () => { nud.innerHTML = p.hints.slice(0, S.hints).map(h => `<li class="say">${esc(h)}</li>`).join(""); act.innerHTML = "";
    if (!S.shown) { const row = $(`<div class="row"></div>`); const fin = $(`<button class="btn primary big">I finished: check my work</button>`); fin.onclick = () => { S.shown = true; draw(); }; act.append(fin);
      const st = $(`<button class="btn ghost">${S.hints >= p.hints.length ? "No more nudges" : "I'm stuck"}</button>`); st.disabled = S.hints >= p.hints.length; st.onclick = () => { S.hints++; draw(); }; row.append(st);
      const hp = $(`<button class="btn ghost">Help</button>`); hp.onclick = () => helpMenu(p); row.append(hp); act.append(row); }
    else { act.append($(`<div class="say win"><b>Answer:</b> ${esc(p.answer || p.note || "See the steps")}</div>`));
      act.append($(`<div class="say"><b>How it works</b><ol class="steps">${(p.steps || []).map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>`));
      if (!done) { const q = $(`<div class="row"><button class="btn primary" id="y">Yes, I got it</button><button class="btn" id="n">Not quite</button></div>`); q.querySelector("#y").onclick = () => { hw.done[p.id] = true; persist(); S.msg = "Nailed it."; render(); }; q.querySelector("#n").onclick = () => { newAlt(p); go("alt"); }; act.append($(`<p class="lead" style="margin:0">Did you get it?</p>`)); act.append(q); }
      else act.append($(`<p class="done" style="margin:0">✓ ${esc(S.msg || "Marked done.")}</p>`));
      const hb = $(`<div class="row"></div>`); const w = $(`<button class="btn ghost">Why am I learning this?</button>`); w.onclick = () => openSheet("why", p); const u = $(`<button class="btn ghost">What does this use?</button>`); u.onclick = () => openSheet("deps", p); hb.append(w, u); act.append(hb); }
    const ga = $(`<button class="btn ghost big">Generate alternate</button>`); ga.onclick = () => { newAlt(p); go("alt"); }; act.append(ga); };
  if (window.mathseyeFeedback) card.append(mathseyeFeedback.button(() => ({ref: "#" + p.ref, text: p.text, where: "Homework · " + subTitle(p.sub) + " · " + p.label, extra: {nudges: S.hints, answerShown: !!S.shown, done: done}})));
  draw(); el.append(card); return el; },
alt(){ const A = S.alt, p = A.p, orig = PACK.problems.find(x => x.id === S.id); const el = $(`<div class="stack"></div>`);
  el.append(backBar("Back to my homework problem", () => go("prob")));
  const card = $(`<section class="card"><p class="eyebrow pe">Practice like ${esc(orig.label)} · new numbers</p><p class="problem">${esc(p.text)}</p><div class="vis">${visual(p)}</div><div class="in"></div><div class="say" ${A.msg ? "" : "hidden"} aria-live="polite"></div><ul class="nudges"></ul><div class="pic"></div><div class="act"></div><span class="ref" aria-label="Reference number">#${p.ref}</span></section>`);
  const inp = card.querySelector(".in"), say = card.querySelector(".say"), nud = card.querySelector(".nudges"), pic = card.querySelector(".pic"), act = card.querySelector(".act");
  const check = (v) => { if (v === null || v === "" || v === undefined) { A.msg = p.kind === "choice" ? "Pick an answer first." : "Type an answer first."; A.win = false; return draw(); }
    if (isSetup(p, v)) { A.win = false; A.msg = SETUP_MSG; A.input = ""; return draw(); }
    A.tries++; if (isRight(p, v)) { A.solved = true; A.win = true; A.msg = exprNote(p, v, true) + (A.tries === 1 && A.hints === 0 ? "You did that on your own. " : "") + "Nailed it."; draw(); burst(card.querySelector(".say.win")); return; } else { A.win = false; A.msg = exprNote(p, v, false) + "Not quite yet. Try again, or tap I'm stuck."; A.input = ""; } draw(); };
  const draw = () => { inp.innerHTML = ""; say.hidden = !A.msg; say.innerHTML = esc(A.msg) + (A.win ? `<p class="ans">Answer: ${esc(p.show)}</p>${shortWhy(p) ? `<p class="ans why">Why: ${esc(shortWhy(p))}</p>` : ""}` : ""); say.className = "say" + (A.win ? " win pop" : ""); nud.innerHTML = p.hints.slice(0, A.hints).map(h => `<li class="say">${esc(h)}</li>`).join(""); pic.innerHTML = p.bars ? (A.steps || A.solved ? barModel(p.bars, true) : A.hints >= 2 ? barModel(p.bars, false) : "") : ""; act.innerHTML = "";
    if (!A.solved) {
      if (p.kind === "choice") { const o = $(`<div class="opts">${p.options.map((t, i) => `<button aria-pressed="${A.pick === i}" data-i="${i}">${esc(t)}</button>`).join("")}</div>`); o.onclick = e => { const b = e.target.closest("button"); if (b) { A.pick = +b.dataset.i; draw(); } }; inp.append(o); }
      else { inp.append($(`<div class="answer" aria-live="polite">${A.input ? esc(A.input) : '<span class="ph">Tap the numbers below</span>'}</div>`), $(`<p class="tip">Type a number like 3/4 or 1 1/2. Use ( ) to write the setup first if it helps.</p>`)); const keys = ["7","8","9","⌫","4","5","6","−","1","2","3","/","0",".","(",")","×","÷","+","␣"]; const pad = $(`<div class="pad">${keys.map(k => `<button data-k="${k}" class="${k==='␣'?'sp':''}" aria-label="${k==='⌫'?'Delete':k==='␣'?'Space':k==='−'?'Minus':k==='('?'Open bracket':k===')'?'Close bracket':k}">${k==="␣"?"space":k}</button>`).join("")}<button class="go" data-k="go">Check</button></div>`);
        pad.onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k; if (k === "go") return check(A.input); A.input = k==="⌫" ? A.input.slice(0,-1) : (A.input.length < 14 ? A.input + (k==="␣" ? " " : k) : A.input); draw(); }; inp.append(pad); }
      const row = $(`<div class="row"></div>`); if (p.kind === "choice") { const c = $(`<button class="btn primary big">Check</button>`); c.onclick = () => check(A.pick); row.append(c); }
      const st = $(`<button class="btn ghost">${A.hints >= 3 ? "Show me how" : "I'm stuck"}</button>`); st.onclick = () => { if (A.hints >= 3) A.steps = true; else A.hints++; draw(); }; row.append(st);
      const hp = $(`<button class="btn ghost">Help</button>`); hp.onclick = () => helpMenu(p); row.append(hp); act.append(row);
    } else { const row = $(`<div class="row"></div>`); const nx = $(`<button class="btn primary big">Another one</button>`); nx.onclick = () => { newAlt(orig); render(); window.scrollTo(0, 0); }; row.append(nx); const sb = $(`<button class="btn quiet">${A.steps ? "Hide the steps" : "See how it works"}</button>`); sb.onclick = () => { A.steps = !A.steps; draw(); }; row.append(sb); act.append(row); if (p.sense) act.append(senseCard(p.sense)); }
    if (A.steps) act.append($(`<div class="say"><b>How it works</b><ol class="steps">${p.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol><p style="margin:0"><b>Answer:</b> ${esc(p.show)}</p></div>`));
    const back = $(`<button class="btn quiet">Back to my homework problem</button>`); back.onclick = () => go("prob"); act.append(back); };
  if (window.mathseyeFeedback) card.append(mathseyeFeedback.button(() => ({ref: "#" + p.ref, text: p.text, where: "Homework · practice like " + orig.label + " · new numbers", extra: {input: A.input || "", tries: A.tries, hints: A.hints, solved: !!A.solved}})));
  draw(); el.append(card); return el; }
};
