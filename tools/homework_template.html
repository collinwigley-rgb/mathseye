<script>
/* The Homework section never shows an answer, a worked solution or the steps that end in one: only questions to ask herself and nudges. */
/* "Check my work": she types her answer; the server says only "matches" or "not quite yet". The answers never reach this page. */
function typedCheck(p){
  const ck = p.ck, parts = ck.p || [ck], labels = ck.labels || null, active = i => parts[i].i !== "none";
  if (!S.ck || S.ck.id !== p.id) S.ck = {id:p.id, vals:parts.map(() => ""), i:Math.max(0, parts.findIndex((x, i) => active(i))), msg:"", res:null, busy:false, offline:false};
  const C = S.ck, part = parts[C.i], more = parts.findIndex((x, i) => i > C.i && active(i)), box = $(`<div class="say win ckbox"></div>`);
  box.append($(`<p style="margin:0"><b>Check my work</b></p>`), $(`<p class="muted" style="margin:4px 0 8px">Type what you got and I'll tell you if it matches. I never show the answer.</p>`));
  if (C.msg) box.append($(`<p class="say" role="status" style="margin:0 0 8px">${esc(C.msg)}</p>`));
  if (C.busy) { box.append($(`<p class="muted" style="margin:0">Checking…</p>`)); return box; }
  if (C.res || C.offline) {
    const row = $(`<div class="row"></div>`), again = $(`<button class="btn primary">Try again</button>`), me = $(`<button class="btn ghost">Check it myself instead</button>`);
    again.onclick = () => { if (C.res) { C.res.forEach((r, k) => { if (r === false) C.vals[k] = ""; }); C.i = Math.max(0, C.res.findIndex(r => r === false)); } C.res = null; C.offline = false; C.msg = ""; render(); };
    me.onclick = () => { S.ckSelf = p.id; render(); }; row.append(again); if (S.hints < p.hints.length) { const nd = $(`<button class="btn ghost">Give me a nudge</button>`); nd.onclick = () => { S.hints++; C.res = null; C.msg = ""; render(); }; row.append(nd); } row.append(me); box.append(row); return box;
  }
  if (labels) box.append($(`<p class="eyebrow" style="margin:8px 0 4px">${esc(labels[C.i])}</p>`));
  const submit = () => { C.busy = true; render();
    fetch("/api/check", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({unit:PACK.unit, id:p.id, parts:C.vals})}).then(r => r.json()).then(j => {
      C.busy = false; if (!j || !j.ok || !j.auto) { S.ckSelf = p.id; return render(); }
      if (j.result) { S.ck = null; setRes(p.id, "got"); S.msg = "That matches. Nailed it."; return render(); }
      C.res = j.parts; C.msg = j.parts.length > 1 ? j.parts.map((r, k) => r === null ? "" : `${labels ? labels[k] : "Part " + (k + 1)}: ${r ? "matches" : "not quite yet"}.`).filter(Boolean).join(" ") : "Not quite yet. Look it over, then try again."; render();
    }).catch(() => { C.busy = false; C.offline = true; C.msg = "I can't reach the checker right now. Check it yourself, or try again when you're online."; render(); }); };
  const next = () => { if (more >= 0) { C.i = more; render(); } else submit(); };
  if (part.i === "text") { const inp = $(`<input class="ckin" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type your answer" aria-label="Your answer">`); inp.value = C.vals[C.i]; inp.oninput = () => { C.vals[C.i] = inp.value; };
    inp.onkeydown = e => { if (e.key === "Enter") next(); }; box.append(inp); const go = $(`<button class="btn primary big">${more >= 0 ? "Next part" : "Check"}</button>`); go.onclick = next; box.append(go); }
  else { box.append($(`<div class="answer" aria-live="polite">${C.vals[C.i] ? esc(C.vals[C.i]) : '<span class="ph">Tap the numbers below</span>'}</div>`));
    const keys = ["7","8","9","⌫","4","5","6","−","1","2","3","/","0",".",part.pct ? "%" : "$","␣"];
    const pad = $(`<div class="pad">${keys.map(k => `<button data-k="${k}" aria-label="${k==='⌫'?'Delete':k==='−'?'Minus':k==='%'?'Percent sign':k==='$'?'Dollar sign':k==='␣'?'Space':k}">${k==='␣'?'space':k}</button>`).join("")}<button class="go" data-k="go">${more >= 0 ? "Next part" : "Check"}</button></div>`);
    pad.onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k; if (k === "go") return next(); C.vals[C.i] = k === "⌫" ? C.vals[C.i].slice(0, -1) : (C.vals[C.i].length < 14 ? C.vals[C.i] + (k === "␣" ? " " : k) : C.vals[C.i]); render(); }; box.append(pad); }
  return box; }
const checkBlock = p => $(`<div class="say win"><b>Check yourself</b><ul class="steps"><li>Read the question again. Did you answer what it asked?</li><li>Does the size of your answer make sense next to the numbers in the problem?</li>${p.method ? `<li>Try the idea once more: ${esc(p.method)}.</li>` : ""}</ul></div>`);
const thinkBlock = p => $(`<div class="say"><b>Think it through</b><ol class="steps">${(p.hints || []).map(h => `<li>${esc(h)}</li>`).join("")}${(p.shortcut || []).map(h => `<li>${esc(h)}</li>`).join("")}</ol></div>`);
const DATA = __DATA__;
const BRANDS = __BRANDS__;
__BURST__
const getBrand = () => { try { const v = localStorage.getItem("mathseye.brand"); if (BRANDS.some(b => b.id === v)) return v; } catch(e) {} return "classic"; };
const applyBrand = (id) => { document.documentElement.dataset.brand = id; };
applyBrand(getBrand());
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LV = {foundation:"Base skill", builds:"Builds on one earlier lesson", mixed:"Mixes several lessons"};
const LVTXT = {foundation:"This one mostly uses this lesson's skill plus things you learned in earlier grades.", builds:"This one uses this lesson's skill together with one earlier lesson from this unit.", mixed:"This one combines several lessons. If you get stuck, try the earlier lessons first."};
/*HELPERS*/
const MARK = `__MARK__`;
const PKEY = "__PACK_KEY__", HKEY = "__HW_KEY__" + (window.mathseyeNs || "");
let PACK = null; try { PACK = JSON.parse(localStorage.getItem(PKEY) || "null"); } catch(e) {}
let hw = {done:{}, res:{}}; try { Object.assign(hw, JSON.parse(localStorage.getItem(HKEY) || "{}")); } catch(e) {}
const persist = () => { try { localStorage.setItem(HKEY, JSON.stringify(hw)); } catch(e) {} window.mathseyeSync && mathseyeSync.touch(); };
const S = {view:"home", sub:null, id:null, hints:0, shown:false, steps:false, msg:"", alt:null, err:""};
const ORDER = __ORDER__;
const SHEETS = [["lesson","From the lesson pages"],["practice","Extra practice"],["review","Topic review"],["extra","Recovery packet"]];
const subTitle = (s) => s === "review" ? "Topic review" : s === "extra" ? "Recovery packet" : (DATA.lessons[s] ? DATA.lessons[s].title : s);
const whyFor = (sub) => (DATA.lessons[sub] && DATA.lessons[sub].why) || (PACK && PACK.why && PACK.why[sub]) || null;
const packBy = (sub) => PACK.problems.filter(p => p.sub === sub);
const isPack = (o) => o && o.format === "mathseye-homework-pack" && o.unit === __UNIT__ && Array.isArray(o.problems) && o.problems.length && o.problems.every(p => p.id && p.text && Array.isArray(p.hints) && p.sub);
function importText(text, cb){ try { const o = JSON.parse(text); if (!isPack(o)) throw new Error("That isn't a __UNIT_LABEL__ homework pack."); localStorage.setItem(PKEY, JSON.stringify(o)); PACK = o; cb(""); } catch(e) { cb(e.message || "Couldn't read the pack."); } }
/* The pack lives on the server (not in git). Fetch it when the page opens: show the saved copy right away, refresh quietly. */
let LOADING = !PACK, LOADFAIL = false;
function fetchPack(){ return fetch("/api/pack?unit=__UNIT__", {cache: "no-store"}).then(r => r.ok ? r.text() : Promise.reject(r.status)).then(t => {
    const had = PACK ? JSON.stringify(PACK) : ""; let o; try { o = JSON.parse(t); } catch(e) { throw 0; } if (!isPack(o)) throw 0;
    if (JSON.stringify(o) !== had) { try { localStorage.setItem(PKEY, JSON.stringify(o)); } catch(e) {} const first = !PACK; PACK = o; if (first || S.view === "home") render(); }
    LOADING = false; LOADFAIL = false; }).catch(() => { LOADING = false; if (!PACK) { LOADFAIL = true; render(); } }); }
function importFile(file, cb){ const r = new FileReader(); r.onerror = () => cb("Couldn't read that file."); r.onload = () => importText(r.result, cb); r.readAsText(file); }

/* ---------- help sheets ---------- */

      const st = $(`<button class="btn ghost">${A.hints >= 3 ? "Think it through" : "I'm stuck"}</button>`); st.onclick = () => { if (A.hints >= 3) A.steps = true; else A.hints++; draw(); }; row.append(st);
      const hp = $(`<button class="btn ghost">Help</button>`); hp.onclick = () => helpMenu(p); row.append(hp); act.append(row);
    } else { const row = $(`<div class="row"></div>`); const nx = $(`<button class="btn primary big">Another one</button>`); nx.onclick = () => { newAlt(orig); render(); window.scrollTo(0, 0); }; row.append(nx); const sb = $(`<button class="btn quiet">${A.steps ? "Hide the ideas" : "Think it through"}</button>`); sb.onclick = () => { A.steps = !A.steps; draw(); }; row.append(sb); act.append(row); if (p.sense) act.append(senseCard(p.sense)); }
    if (A.steps) act.append(thinkBlock(p));
    const back = $(`<button class="btn quiet">Back to my homework problem</button>`); back.onclick = () => go("prob"); act.append(back); };
  if (window.mathseyeFeedback) card.append(mathseyeFeedback.button(() => ({ref: "#" + p.ref, text: p.text, where: "Homework · practice like " + orig.label + " · new numbers", extra: {input: A.input || "", tries: A.tries, hints: A.hints, solved: !!A.solved}})));
  draw(); el.append(card); return el; }
};
render(); fetchPack();
</script>
