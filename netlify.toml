[build]
  command = "npm test && npm run build"
  publish = "dist"
  # Skip the build (and its credits) when a push only touches docs or notes
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public content index.html tools package.json package-lock.json vite.config.ts netlify.toml"

[build.environment]
  NODE_VERSION = "22"
