brk(){ let left = 120; const el = $(`<div class="stack"><header><h1>Intermission</h1><p class="sub">Your brain works better after a break. Pick any.</p></header><section class="card"><ul class="steps"><li>Stand up and stretch your arms up high.</li><li>Drink some water.</li><li>Look out a window for 20 seconds.</li></ul><div class="timer" id="tm" aria-live="off">2:00</div><button class="btn primary big" id="start">Start a 2-minute timer</button></section><button class="btn" id="home">Back to home</button></div>`);
  el.querySelector("#home").onclick = () => go("home"); el.querySelector("#start").onclick = e => { e.target.disabled = true; clearInterval(S.timer); S.timer = setInterval(() => { left--; const tm = document.getElementById("tm"); if (tm) tm.textContent = Math.floor(left/60) + ":" + String(left%60).padStart(2,"0"); if (left <= 0) { clearInterval(S.timer); if (tm) tm.textContent = "Ready when you are."; } }, 1000); }; return el; },
testIntro(){ const el = $(`<div class="stack"></div>`); el.append(backBar("Home", () => go("home")));
  const run = save.testRun && save.testRun.spec && save.testRun.spec.length ? save.testRun : null;
  if (run) { const c = $(`<section class="card"><p class="eyebrow">Test in progress</p><h2>Question ${Math.min(run.i + 1, run.spec.length)} of ${run.spec.length}</h2><p class="lead muted">You can pick up right where you stopped.</p><button class="btn primary big" id="rs">Keep going</button><button class="btn quiet" id="nw">Start over with a new test</button></section>`);
    c.querySelector("#rs").onclick = () => { S.test = {spec:run.spec, list:run.spec.map(fromSpec), i:Math.min(run.i, run.spec.length - 1), ans:run.ans || [], input:"", pick:null, t0:run.t0 || Date.now(), opts:run.opts || {help:false, must:false}, tries:run.tries || [], hints:run.hints || [], steps:run.steps || [], solved:run.solved || []}; go("testQ"); };
    c.querySelector("#nw").onclick = () => { save.testRun = null; persist(); render(); }; el.append(c); }
  const o = Object.assign({help:false, must:false}, save.testOpts || {});
  const opts = $(`<section class="card"><p class="eyebrow">Test options</p>
    <div class="tgl"><span><b>Allow help</b><small>Shows "I'm stuck" (hints, then the steps) and the Help menu on each question.</small></span><button type="button" class="sw2" role="switch" aria-label="Allow help" aria-checked="${o.help}" data-k="help"></button></div>
    <div class="tgl"><span><b>Must get it right to move on</b><small>Each answer is checked, and she can't go on until it's right. Only a right answer on the first try counts toward the score.</small></span><button type="button" class="sw2" role="switch" aria-label="Must get it right to move on" aria-checked="${o.must}" data-k="must"></button></div></section>`);
  opts.querySelectorAll(".sw2").forEach(b => b.onclick = () => { save.testOpts = Object.assign({}, o, {[b.dataset.k]: !o[b.dataset.k]}); persist(); render(); });
  const st = $(`<section class="card"><p class="eyebrow">Dress rehearsal</p><h2>Practice test: 14 questions${o.help ? "" : ", no hints"}</h2><p class="lead muted">Two from each lesson, mixed up like the real test. At the end you get an explanation for every one you missed, and the lesson to look at, right there. It is saved so you can come back to it later.</p><button class="btn primary big" id="st">Start the test</button></section>`);
  st.querySelector("#st").onclick = () => { const spec = []; DATA.subs.forEach(s => probs.filter(p => p.sub === s).sort(() => Math.random() - .5).slice(0, 2).forEach(p => spec.push({id:p.id, v:(p.variants && Math.random() < .6) ? Math.floor(Math.random() * p.variants.length) : -1})));
    spec.sort(() => Math.random() - .5); S.test = {spec, list:spec.map(fromSpec), i:0, ans:[], input:"", pick:null, t0:Date.now(), opts:{help:o.help, must:o.must}, tries:[], hints:[], steps:[], solved:[]};
    save.testRun = {spec, i:0, ans:[], t0:S.test.t0, opts:S.test.opts, tries:[], hints:[], steps:[], solved:[]}; persist(); go("testQ"); };
  const two = $(`<div class="cols"></div>`); two.append(opts, st); el.append(two);
  const hist = save.tests || []; if (hist.length) { el.append($(`<h2 class="hd" style="margin-top:6px">Past tests</h2>`)); hist.forEach(h => { const gr = mathseyeGrade.gradeOf(h.right, h.items.length), b = $(`<button class="item"><span><b>${h.right} of ${h.items.length} · ${gr.letter}</b><span class="snip">${mathseyeGrade.centralTime(h.t)}${h.song ? " · ♪ " + esc(h.song) : ""} · ${h.items.filter(x => !x.ok).length ? "tap to see what to review" : "every one right"}</span></span></button>`); b.onclick = () => go("testRes", {rv:h}); el.append(b); }); }
  return el; },
testQ(){ const T = S.test, p = T.list[T.i]; const el = $(`<div class="stack"></div>`);
  const O = T.opts || {help:false, must:false}; ["tries", "hints", "steps", "solved"].forEach(k => { T[k] = T[k] || []; });
  const top = $(`<div class="top"><button class="btn quiet" id="exit">✕ Stop for now</button><span class="muted">Question ${T.i+1} of ${T.list.length}</span></div>`); top.querySelector("#exit").onclick = () => go("home"); el.append(top, $(`<div class="bar" aria-hidden="true"><i style="width:${T.i/T.list.length*100}%"></i></div>`));
  if (T.ans[T.i] != null && T.input === "" && T.pick == null) { if (p.kind === "choice") T.pick = T.ans[T.i]; else T.input = String(T.ans[T.i]); }
  const last = T.i + 1 >= T.list.length;
  const c = $(`<section class="card split tq"><p class="problem">${esc(p.text)}</p><div class="vis">${visual(p)}</div><div class="in"></div><div class="say" hidden aria-live="polite"></div>${O.help ? '<ul class="nudges"></ul><div class="steps2"></div><div class="row hrow"></div>' : ""}<div class="row nav"><button class="btn ghost" id="pv" ${T.i === 0 ? "hidden" : ""}>← Previous</button><button class="btn primary big nx" disabled></button></div>${O.must ? "" : '<button class="btn quiet" id="sk">Skip this one</button>'}<span class="ref" aria-label="Reference number">#${p.ref}</span></section>`), inp = c.querySelector(".in"), nx = c.querySelector(".nx"), say = c.querySelector(".say");
  const answered = () => p.kind === "choice" ? T.pick != null : T.input.trim() !== "";
  const value = () => p.kind === "choice" ? T.pick : T.input;
  const gate = () => O.must && !T.solved[T.i];                        // must get it right: this question is not passed yet
  const draw = () => { inp.innerHTML = ""; nx.disabled = !answered() && gate() || (!gate() && !answered() && !O.must); nx.textContent = gate() ? "Check" : last ? "Finish" : "Next";
    if (O.must && T.solved[T.i]) nx.disabled = false;
    if (p.kind === "choice") { const o = $(`<div class="opts">${p.options.map((t,i)=>`<button aria-pressed="${T.pick===i}" data-i="${i}">${esc(t)}</button>`).join("")}</div>`); o.onclick = e => { const b = e.target.closest("button"); if (b && !(O.must && T.solved[T.i])) { T.pick = +b.dataset.i; say.hidden = true; draw(); } }; inp.append(o); }
    else if (!(O.must && T.solved[T.i])) { inp.append($(`<div class="answer">${T.input ? esc(T.input) : '<span class="ph">Tap the numbers below</span>'}</div>`)); const keys = ["7","8","9","⌫","4","5","6","−","1","2","3","/","0",".","(",")","×","÷","+","␣"]; const pad = $(`<div class="pad">${keys.map(k=>`<button data-k="${k}" class="${k==='␣'?'sp':''}">${k==="␣"?"space":k}</button>`).join("")}</div>`); pad.onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k; T.input = k==="⌫" ? T.input.slice(0,-1) : (T.input.length < 14 ? T.input + (k==="␣" ? " " : k) : T.input); say.hidden = true; draw(); }; inp.append(pad); }
    else inp.append($(`<div class="answer">${esc(T.input)}</div>`));
    if (O.help) helpDraw(); };
  /* Help (only when the option is on): hints one at a time, then the steps; a small Help menu. */
  const helpDraw = () => { const nud = c.querySelector(".nudges"), stp = c.querySelector(".steps2"), row = c.querySelector(".hrow"), h = T.hints[T.i] || 0, shown = !!T.steps[T.i];
    nud.innerHTML = p.hints.slice(0, h).map(x => `<li class="say">${esc(x)}</li>`).join(""); stp.innerHTML = shown ? `<div class="say"><b>How it works</b><ol class="steps">${p.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>` : "";
    row.innerHTML = ""; if (!shown && !(O.must && T.solved[T.i])) { const b = $(`<button class="btn ghost">${h >= p.hints.length ? "Show me how" : "I'm stuck"}</button>`); b.onclick = () => { if (h >= p.hints.length) T.steps[T.i] = true; else T.hints[T.i] = h + 1; keep(); helpDraw(); }; row.append(b); }
    const hb = $(`<button class="btn ghost">Help</button>`); hb.onclick = () => testHelp(p); row.append(hb); };
  const testHelp = q => { const root = document.getElementById("sheet"); root.innerHTML = ""; const bg = $(`<div class="sheetbg"><div class="sheet pop" role="dialog" aria-modal="true" aria-label="Help"><h2>Need something else?</h2><button class="btn" id="w">Why am I learning this?</button><button class="btn" id="u">What does this use?</button>${(q.facts || []).length || (q.shortcut || []).length ? '<button class="btn" id="f">Math facts that could help</button>' : ""}<button class="btn primary" id="c">Back to the question</button></div></div>`);
    const shut = () => { root.innerHTML = ""; }; bg.onclick = e => { if (e.target === bg) shut(); }; bg.querySelector("#c").onclick = shut; bg.querySelector("#w").onclick = () => openSheet("why", q); bg.querySelector("#u").onclick = () => openSheet("deps", q); const f = bg.querySelector("#f"); if (f) f.onclick = () => openSheet("facts", q); root.append(bg); bg.querySelector("#c").focus(); };
  const keep = () => { save.testRun = {spec:T.spec, i:T.i, ans:T.ans, t0:T.t0, opts:O, tries:T.tries, hints:T.hints, steps:T.steps, solved:T.solved}; persist(); };
  const move = d => { T.input = ""; T.pick = null; T.i += d; keep(); go(T.i < T.list.length ? "testQ" : "testDone"); };
  const take = () => { T.ans[T.i] = answered() ? value() : T.ans[T.i] != null ? T.ans[T.i] : null; };
  const check = () => { T.tries[T.i] = (T.tries[T.i] || 0) + 1; if (isRight(p, value())) { T.solved[T.i] = true; T.ans[T.i] = value(); say.className = "say win"; say.textContent = T.tries[T.i] === 1 ? "Right! On the first try." : "Right. Now you can move on."; say.hidden = false; keep(); draw(); }
    else { say.className = "say"; say.textContent = "Not quite yet. Try again" + (O.help ? ", or tap I'm stuck." : "."); say.hidden = false; T.input = ""; T.pick = null; keep(); draw(); } };
  const fillAll = wrongCount => { const n = T.list.length, bad = new Set(); while (bad.size < Math.min(wrongCount, n)) bad.add(Math.floor(Math.random() * n)); T.list.forEach((q, i) => { T.ans[i] = bad.has(i) ? devWrong(q) : devRight(q); T.tries[i] = 1; T.solved[i] = true; }); T.input = ""; T.pick = null; T.i = n; keep(); go("testDone"); };
  if (window.mathseyeDev) mathseyeDev.set([{label:"Fill RIGHT answer", fn:() => { if (p.kind === "choice") T.pick = devRight(p); else T.input = devRight(p); draw(); }}, {label:"Fill WRONG answer", fn:() => { if (p.kind === "choice") T.pick = devWrong(p); else T.input = devWrong(p); draw(); }}, {label:"Finish test: all right", fn:() => fillAll(0)}, {label:"Finish test: 6 wrong", fn:() => fillAll(6)}, {label:"Finish test: all wrong", fn:() => fillAll(99)}]);
  if (O.must && T.solved[T.i]) { say.className = "say win"; say.textContent = "Right. Now you can move on."; say.hidden = false; }
  draw(); nx.onclick = () => { if (gate()) { if (answered()) check(); return; } if (!O.must && !answered()) return; take(); move(1); };
  const sk = c.querySelector("#sk"); if (sk) sk.onclick = () => { T.ans[T.i] = null; move(1); };
  c.querySelector("#pv").onclick = () => { take(); move(-1); }; el.append(c); return el; },
testDone(){ const T = S.test; if (!T.saved) { const O = T.opts || {help:false, must:false}, items = T.list.map((p, i) => { const right = T.ans[i] != null && isRight(p, T.ans[i]), tries = T.tries && T.tries[i] || 0, helped = !!((T.hints && T.hints[i]) || (T.steps && T.steps[i]));
      return {id:p.id, v:T.spec[i].v, ref:p.ref, sub:p.sub, mine:T.ans[i] == null ? null : T.ans[i], ok:O.must ? right && tries <= 1 : right, tries, helped}; });
    T.rv = {t:Date.now(), right:items.filter(x => x.ok).length, items, opts:O}; items.forEach(x => flagTest(x.id, x.ok)); T.saved = true; mathseyeSongs.load().then(() => { if (ensureSong(T.rv, mathseyeGrade.gradeOf(T.rv.right, items.length).letter) && S.view === "testDone") render(); }); save.tests = [T.rv, ...(save.tests || [])].slice(0, 8); save.testRun = null; persist(); }
  return VIEWS.testRes(T.rv); },
testRes(rv){ rv = rv || S.rv; const items = rv.items, gr = mathseyeGrade.gradeOf(items.filter(x => x.ok).length, items.length), el = $(`<div class="stack"></div>`), miss = items.filter(x => !x.ok), got = items.filter(x => x.ok);
  const subs = [...new Set(miss.map(x => x.sub))].sort();
  el.append(backBar("Home", () => go("home")), $(`<header><h1>Test finished</h1></header>`), $(`<section class="card"><div class="big-n">${got.length}<span class="muted" style="font-size:1.6471rem"> of ${items.length}</span> <span class="grade" aria-label="Grade ${gr.letter}">${gr.letter}</span></div><p class="muted" style="margin:0">${gr.pct}%</p>${ensureSong(rv, gr.letter) ? `<p class="songline">♪ Your song for this test: <b>${esc(rv.song)}</b></p>` : ""}<p class="lead">${miss.length ? `${miss.length} to review. Each one has its explanation below, and now sits on your <b>Needs work (test)</b> list.` : "Every lesson looks solid. Nice work."}</p><p class="muted" style="margin:0">${mathseyeGrade.centralTime(rv.t)} · saved, so you can come back to it${items.some(x => x.helped) ? " · " + items.filter(x => x.helped).length + " question" + (items.filter(x => x.helped).length > 1 ? "s" : "") + " used help" : ""}${rv.opts && (rv.opts.help || rv.opts.must) ? " · " + [rv.opts.help ? "help was on" : "", rv.opts.must ? "had to get each one right" : ""].filter(Boolean).join(", ") : ""}</p></section>`));
  if (subs.length) { const r = $(`<div class="row lk"></div>`); subs.forEach(sb => { const b = $(`<button class="btn">Look at ${sb} · ${esc(DATA.lessons[sb].title)}</button>`); b.onclick = () => lessonSheet(sb); r.append(b); }); el.append(r); }
  miss.forEach(x => { const p = fromSpec(x), mine = x.mine == null ? "(skipped)" : (p.kind === "choice" ? p.options[x.mine] : x.mine);
    const c = $(`<section class="card"><p class="eyebrow">Lesson ${p.sub} · ${esc(DATA.lessons[p.sub].title)}</p><p class="problem">${esc(p.text)}</p><div class="vis">${visual(p)}</div><div class="say"><b>Your answer:</b> ${esc(mine)}${x.tries > 1 ? ` <small class="muted">· it took ${x.tries} tries</small>` : ""}${x.helped ? ` <small class="muted">· you used help</small>` : ""}</div><div class="say win"><b>Answer:</b> ${esc(p.show)}</div>${(p.steps || []).length ? `<div class="say"><b>How it works</b><ol class="steps">${p.steps.map(t => `<li>${esc(t)}</li>`).join("")}</ol></div>` : ""}<div class="row"><button class="btn" data-l>Look at lesson ${p.sub}</button><button class="btn primary" data-p>Practice lesson ${p.sub}</button></div><span class="ref" aria-label="Reference number">#${p.ref}</span></section>`);
    c.querySelector("[data-l]").onclick = () => lessonSheet(p.sub); c.querySelector("[data-p]").onclick = () => buildMission(p.sub); el.append(c); });
  if (got.length) { const d = $(`<details class="card"><summary><b>Got it (${got.length})</b>${got.filter(x => x.helped).length ? ` <span class="muted">· ${got.filter(x => x.helped).length} with help</span>` : ""}</summary><ul class="cl">${got.map(x => { const p = fromSpec(x); return `<li><span>${esc(p.text.length > 90 ? p.text.slice(0, 88) + "…" : p.text)} <small class="muted">#${p.ref}</small></span><span class="ok">✓${x.helped ? ` <small class="flag">help</small>` : ""}${x.tries > 1 ? ` <small class="flag">${x.tries} tries</small>` : ""}</span></li>`; }).join("")}</ul></details>`); el.append(d); }
  const nt = testWorkIn([]); if (nt) { const pr = $(`<button class="btn primary big">Practice the ones I missed (${nt})</button>`); pr.onclick = () => buildMission(null, "twork"); el.insertBefore(pr, el.children[2] || null); }
  const again = $(`<button class="btn ${nt ? "" : "primary "}big">Try a new test</button>`); again.onclick = () => go("testIntro"); el.append(again); return el; }
};
/* Coming back from MathFacts ("Practice it"): return to the same problem, hints and typing included. */
if (save.cur && save.mission && save.mission.ids[save.mission.i] === save.cur.id) { S.cur = save.cur; S.view = "mission"; }
if (save.cur) { save.cur = null; persist(); }
if (window.mathseyeSongs) mathseyeSongs.load();
/* Opened from the main selector with a lesson chosen (?lesson=2.3): preset the setup to that lesson. She still taps Start. */
{ const q = new URLSearchParams(location.search).get("lesson"); if (q) { if (DATA.subs.includes(q)) { save.plan = Object.assign(plan(), {lessons: [q]}); persist(); } try { history.replaceState(null, "", location.pathname); } catch(e) {} } }
render();
</script>
