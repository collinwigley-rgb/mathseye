than 8 of 20.", "why": {"goal": "Compare deals and speeds fairly by turning any rate into 'how much for ONE.'", "supports_future": "Every skill after this starts with a unit rate: equations, graphs, scale drawings, and later percent and slope.", "why_you_need_it": "Totals can fool you. 9 of 25 shots sounds better than 8 of 20, but per shot it's worse.", "real_life": "Grocery unit prices, miles per hour, steps per mile, pay per hour, phone plans.", "building_block": "Foundation. The first block of the unit; the rest is built from it."}}, "2.2": {"title": "Unit rates with fractions", "move": "Keep, change, flip, then cancel before you multiply.", "hook": "Flip the bottom.", "trap": "Flipping the wrong fraction. Only the divisor (the 'per' amount) flips.", "why": {"goal": "Do the same 'get to ONE' move when the amounts are fractions.", "supports_future": "Recipes, maps, and scale drawings use fraction rates. Equations y = kx (Lesson 2.4) and scale drawings (Lesson 2.8) depend on this.", "why_you_need_it": "Real measurements aren't always whole numbers: 3/4 cup, 1/6 hour, 2 1/2 miles.", "real_life": "Recipes, speed over a short time, fabric per item, map scales, medicine doses.", "building_block": "Builds on unit rates (Lesson 2.1), using fraction division from 6th grade."}}, "2.3": {"title": "Is it proportional?", "move": "Divide y ÷ x in EVERY row. All the same means proportional.", "hook": "Every row, same number, or no.", "trap": "Checking only two rows. One row that breaks the pattern makes it NOT proportional.", "why": {"goal": "Decide for sure whether two quantities are proportional.", "supports_future": "You can only use y = kx, a straight line through zero, or a scale factor when a relationship is truly proportional.", "why_you_need_it": "Lots of things look steady but aren't: a setup fee, or ages. Checking every row keeps you from using the wrong tool.", "real_life": "Is this a steady price per item, or is there a delivery fee? Phone plans, ride shares, memberships.", "building_block": "Gatekeeper skill: it decides whether the rest of the unit's tools apply."}}, "2.4": {"title": "y = kx", "move": "k = y ÷ x. Then write y = kx and use it.", "hook": "k is y over x.", "trap": "Using a group price as k. '3 lemons for $1.80' means k = 0.60, not 1.80.", "why": {"goal": "Write any proportional relationship as y = kx and use k to find anything.", "supports_future": "y = kx is your first linear equation. Slope, graphing lines, and Algebra start here.", "why_you_need_it": "An equation is a shortcut: once you know k, any amount takes one step.", "real_life": "Pay = hourly rate × hours. Cost = price × quantity. Distance = speed × time.", "building_block": "Turns the unit rate (Lesson 2.1) into an equation, and sets up graphs (Lesson 2.5) and slope later."}}, "2.5": {"title": "Graphs", "move": "Proportional = a straight line AND it goes through (0, 0). The point (1, k) shows k.", "hook": "Straight and through zero.", "trap": "Calling any straight line proportional. A line that starts at $3 is not.", "why": {"goal": "Recognize and read proportional relationships on a graph.", "supports_future": "Graphs of lines, slope, and comparing rates visually in 8th grade and science.", "why_you_need_it": "A picture shows at a glance whether something is proportional and which rate is bigger (steeper).", "real_life": "Charts of cost vs. amount, speed graphs, exchange rates, fitness apps.", "building_block": "Connects the table (Lesson 2.3) and the equation y = kx (Lesson 2.4) to a picture."}}, "2.6": {"title": "Times or plus?", "move": "Decide first: does doubling one double the other? If not, don't use a ratio.", "hook": "Times? Ratio. Plus? Just add.", "trap": "Using ratios on ages or on 'more helpers means less time' problems.", "why": {"goal": "Decide whether a problem is proportional before using ratios, then pick the right tool.", "supports_future": "Choosing the right model is the heart of word-problem solving in Algebra and science.", "why_you_need_it": "Not every steady problem is a ratio: ages add, and more helpers means less time.", "real_life": "Scaling a recipe, splitting work, planning for a crowd, checking a bill.", "building_block": "Mixes unit rates (Lesson 2.1), tables (Lesson 2.3), equations (Lesson 2.4) and graphs (Lesson 2.5) into one skill: decide first, then solve."}}, "2.8": {"title": "Scale drawings", "move": "Make the scale '1 inch = ? ft', then multiply. For area, convert each side first.", "hook": "One inch first, then multiply.", "trap": "Multiplying the drawing's area by the scale. Convert length and width first.", "why": {"goal": "Use a scale to move between a drawing or map and the real thing, including areas.", "supports_future": "Similar figures and geometry in 7th and 8th grade; blueprints and maps in real life.", "why_you_need_it": "Scale is a constant of proportionality: actual = k × drawing. Areas grow by k × k.", "real_life": "Maps, blueprints, floor plans, model kits, enlarging a photo or poster.", "building_block": "Applies y = kx (Lesson 2.4) in geometry, combining unit rates (Lesson 2.1), fractions (Lesson 2.2), and area."}}}, "concepts": {"div-decimals": {"name": "Dividing decimals", "plain": "Divide a money or measurement amount by a whole number.", "origin": "Grade 6"}, "mul-decimals": {"name": "Multiplying decimals", "plain": "Multiply a rate like $0.15 by a quantity.", "origin": "Grade 6"}, "div-fractions": {"name": "Dividing fractions", "plain": "Keep, change, flip, then cancel.", "origin": "Grade 6"}, "mul-fractions": {"name": "Multiplying fractions", "plain": "Multiply across and cancel first.", "origin": "Grades 5-6"}, "mixed-numbers": {"name": "Mixed numbers", "plain": "Turn 1 1/2 into 3/2 before you multiply or divide.", "origin": "Grades 5-6"}, "equiv-ratios": {"name": "Equivalent ratios and ratio tables", "plain": "Do the same multiply or divide to both rows.", "origin": "Grade 6"}, "unit-conversion": {"name": "Converting units", "plain": "Dozens, yard
