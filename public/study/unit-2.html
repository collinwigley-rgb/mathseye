<!doctype html>
<html lang="en"><head><meta charset="utf-8"></head><body>
<title>Unit 2 Study Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column on a dark stage. Tabs on top, one problem at a time, tools (hint, why, dependencies) beside the work. */
:root{--bg:#16131f;--panel:#201c2e;--panel2:#2b2640;--fg:#efe6d8;--muted:#b0a6c0;--accent:#f4b860;--accent-fg:#2a1d08;--good:#9fd3a8;--line:#3a3354;--focus:#f4b860;
 --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f2f8;--panel:#ffffff;--panel2:#e9e5f3;--fg:#241f35;--muted:#625a78;--accent:#a3600a;--accent-fg:#ffffff;--good:#2d7a45;--line:#d2cce2;--focus:#a3600a;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f2f8;--panel:#ffffff;--panel2:#e9e5f3;--fg:#241f35;--muted:#625a78;--accent:#a3600a;--accent-fg:#ffffff;--good:#2d7a45;--line:#d2cce2;--focus:#a3600a;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:17px/1.5 var(--body);padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px);letter-spacing:-.5px} h2{font-size:22px} h3{font-size:18px}
.sub{color:var(--muted);margin:4px 0 0}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;border-radius:14px}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:var(--panel);padding:12px 18px;font-weight:600;min-height:48px}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-fg)}
.card{background:var(--panel);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;font-weight:600;margin:0}
.move{font-size:19px;margin:0}.hook{margin:0;padding:10px 14px;background:var(--panel2);border-radius:12px;font-weight:600}
.trap{margin:0;color:var(--muted)} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--panel2);padding:12px 16px;min-height:48px;font-weight:500}.btn.primary{background:var(--accent);color:var(--accent-fg);font-weight:600}
.btn[aria-expanded=true]{outline:2px solid var(--accent)} .btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{background:var(--panel);padding:8px 14px;min-height:40px;font-weight:500}
.chips button[aria-pressed=true]{background:var(--panel2);outline:2px solid var(--accent)}
.problem{font-size:clamp(20px,4.4vw,26px);font-weight:500;margin:0}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
table.t{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:19px}table.t th,table.t td{border:1px solid var(--line);padding:8px 16px;text-align:center}table.t th{background:var(--panel2);font-family:var(--display)}
.tw{overflow-x:auto}
.answer{font-size:30px;min-height:48px;padding:6px 14px;background:var(--panel2);border-radius:14px;font-variant-numeric:tabular-nums;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.answer .ph{color:var(--muted);font-size:17px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px}.pad button{background:var(--panel2);min-height:60px;font-size:24px;font-variant-numeric:tabular-nums}
.pad .go{grid-column:span 2;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:20px}
.opts{display:flex;flex-direction:column;gap:10px}.opts button{background:var(--panel2);padding:16px;text-align:left;font-size:19px;min-height:56px}
.opts button[aria-pressed=true]{outline:3px solid var(--accent)}
.fb{margin:0;min-height:26px;color:var(--muted)}.fb.good{color:var(--good);font-weight:600}
.clues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}.clues li{background:var(--panel2);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.panel{background:var(--panel2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel dt{font-family:var(--display);font-weight:700;color:var(--accent);font-size:14px;text-transform:uppercase;letter-spacing:.08em}.panel dd{margin:0 0 6px}
.lvl{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:14px}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.cl li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.cl small{color:var(--muted)}
.tag{font-size:12.5px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
svg.g{width:100%;max-width:380px;height:auto}.g .ax{stroke:var(--muted);stroke-width:1.5}.g .gr{stroke:var(--line);stroke-width:1}.g text{fill:var(--muted);font:12px var(--body)}
.g .ln{stroke:var(--accent);stroke-width:3;fill:none}.g .ln2{stroke:var(--good);stroke-width:3;fill:none}.g .dot{fill:var(--accent)}.g .lb{fill:var(--fg);font-weight:600}
.bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.res{display:flex;flex-direction:column;gap:10px}.res .it{background:var(--panel2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ok{color:var(--good);font-weight:600}.rv{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion:no-preference){.clues li{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(4px)}}}
</style>
<div class="wrap" id="app"></div>
<script>
const DATA = {"problems": [{"sub": "2.1", "type": "A", "kind": "num", "text": "A 12-pack of juice boxes costs $4.68. What is the cost of one juice box (in dollars)?", "answer": 0.39, "show": "0.39 dollars", "hints": ["You want the cost for ONE box. What do you divide by?", "Get to ONE: divide the total cost by the number of boxes.", "4.68 ÷ 12 = ?"], "steps": ["'Per box' means divide by the 12 boxes.", "4.68 ÷ 12 = 0.39", "One juice box costs $0.39."], "id": "U2-01", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["unit-rate", "div-decimals"]}, "tol": 1e-09}, {"sub": "2.1", "type": "B", "kind": "choice", "text": "Brand X: 18 oz for $5.04. Brand Y: 30 oz for $8.10. Which costs less per ounce?", "options": ["Brand X", "Brand Y"], "correct": 1, "show": "Brand Y", "hints": ["Compare the cost of ONE ounce for each brand.", "Divide each price by its ounces.", "5.04 ÷ 18 and 8.10 ÷ 30. Which is smaller?"], "steps": ["Brand X: 5.04 ÷ 18 = 0.28 per ounce.", "Brand Y: 8.10 ÷ 30 = 0.27 per ounce.", "The smaller price per ounce is the better deal."], "id": "U2-02", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["unit-rate", "compare-rates", "div-decimals"]}}, {"sub": "2.1", "type": "C", "kind": "num", "text": "A printer prints 84 pages in 6 minutes. At that rate, how many pages in 25 minutes?", "answer": 350.0, "show": "350 pages", "hints": ["First, how many pages in ONE minute?", "84 ÷ 6 gives pages per minute.", "Then multiply by 25 minutes."], "steps": ["84 ÷ 6 = 14 pages per minute.", "14 × 25 = 350"], "id": "U2-03", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["unit-rate", "mul-decimals"]}, "tol": 1e-09}, {"sub": "2.1", "type": "D", "kind": "num", "text": "A class has 4 boys for every 5 girls. There are 35 girls. How many boys?", "answer": 28.0, "show": "28 boys", "hints": ["Make a ratio table: boys on one row, girls on the other.", "How do you get from 5 girls to 35 girls?", "Do the same to the 4 boys."], "steps": ["5 × 7 = 35, so multiply the boys by 7 too.", "4 × 7 = 28"], "id": "U2-04", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["equiv-ratios"]}, "tol": 1e-09}, {"sub": "2.1", "type": "E", "kind": "num", "text": "A recipe uses 3 cups of flour for every 12 muffins. Flour costs $0.40 per cup. What does the flour cost for 60 muffins (in dollars)?", "answer": 6.0, "show": "6 dollars", "hints": ["Two steps: cups of flour first, then cost.", "60 muffins is 5 times as many as 12 muffins.", "Cups × $0.40."], "steps": ["60 ÷ 12 = 5, so 3 × 5 = 15 cups of flour.", "15 × 0.40 = 6", "The flour costs $6.00."], "id": "U2-05", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["unit-rate", "multi-step", "mul-decimals"]}, "tol": 1e-09}, {"sub": "2.1", "type": "F", "kind": "num", "text": "Gloves are sold 3 dozen for $54. What does one pair cost (in dollars)?", "answer": 1.5, "show": "1.5 dollars", "hints": ["How many single pairs are in 3 dozen?", "1 dozen is 12, so 3 dozen is 36.", "54 ÷ 36"], "steps": ["3 dozen = 3 × 12 = 36 pairs.", "54 ÷ 36 = 1.5", "One pair costs $1.50."], "id": "U2-06", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["unit-rate", "unit-conversion", "div-decimals"]}, "tol": 1e-09}, {"sub": "2.1", "type": "B", "kind": "choice", "text": "Ava types 195 words in 5 minutes. Ben types 224 words in 7 minutes. Who types faster?", "options": ["Ava", "Ben"], "correct": 0, "show": "Ava", "hints": ["Faster means more words in ONE minute.", "Divide words by minutes for each person.", "195 ÷ 5 and 224 ÷ 7."], "steps": ["Ava: 195 ÷ 5 = 39 words per minute.", "Ben: 224 ÷ 7 = 32 words per minute.", "More words per minute is faster."], "id": "U2-07", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["unit-rate", "compare-rates", "div-decimals"]}}, {"sub": "2.2", "type": "A", "kind": "num", "text": "A hose fills 3/4 of a bucket in 1/2 minute. How many buckets per minute?", "answer": 1.5, "show": "1 1/2 buckets per minute", "hints": ["Per minute: what has to be 1?", "Divide: (3/4) ÷ (1/2).", "Keep, change, flip: 3/4 × 2/1."], "steps": ["(3/4) ÷ (1/2) = 3/4 × 2/1", "= 6/4 = 3/2", "That is 1 1/2 buckets per minute."], "id": "U2-08", "why_focus": "Practice keep-change-flip to get to ONE when the amounts are fractions.", "deps": {"level": "builds", "concepts": ["fraction-unit-rate", "div-fractions", "unit-rate"]}, "tol": 1e-09}, {"sub": "2.2", "type": "A", "kind": "num", "text": "A cyclist rides 5/6 mile in 1/12 hour. What is the speed in miles per hour?", "answer": 10.0, "show": "10 mph", "hints": ["Miles per hour: hours go on the bottom.", "(5/6) ÷ (1/12)", "Flip the 1/12 and cancel."], "steps": ["(5/6) ÷ (1/12) = 5/6 × 12/1", "Cancel 6 and 12: 5 × 2 = 10", "10 miles per hour."], "id": "U2-09", "why_focus": "Practice keep-change-flip to get to ONE when the amounts are fractions.", "deps": {"level": "builds", "concepts": ["fraction-unit-rate", "div-fractions", "unit-rate"]}, "tol": 1e-09}, {"sub": "2.2", "type": "B", "kind": "num", "text": "There are 120 Calories in 2/3 cup of cereal. How many Calories are in 2 cups?", "answer": 360.0, "show": "360 Calories", "hints": ["Find Calories in 1 cup first.", "120 ÷ (2/3) = 120 × 3/2.", "Then multiply by 2 cups."], "steps": ["120 ÷ 2/3 = 120 × 3/2 = 180 Calories per cup.", "180 × 2 = 360"], "id": "U2-10", "why_focus": "Practice keep-change-flip to get to ONE when the amounts are fractions.", "deps": {"level": "builds", "concepts": ["fraction-unit-rate", "div-fractions", "unit-rate", "mul-fractions"]}, "tol": 1e-09}, {"sub": "2.2", "type": "C", "kind": "choice", "text": "Runner A goes 1 1/2 miles in 1/4 hour. Runner B goes 2 1/4 miles in 1/3 hour. Who is faster?", "options": ["Runner A", "Runner B"], "correct": 1, "show": "Runner B", "hints": ["Find miles per ONE hour for each runner.", "Turn mixed numbers into fractions: 3/2 and 9/4.", "(3/2) ÷ (1/4) and (9/4) ÷ (1/3)."], "steps": ["A: (3/2) ÷ (1/4) = 3/2 × 4 = 6 mph.", "B: (9/4) ÷ (1/3) = 9/4 × 3 = 27/4 = 6.75 mph.", "Bigger speed wins."], "id": "U2-11", "why_focus": "Practice keep-change-flip to get to ONE when the amounts are fractions.", "deps": {"level": "builds", "concepts": ["fraction-unit-rate", "div-fractions", "compare-rates", "mixed-numbers"]}}, {"sub": "2.2", "type": "D", "kind": "num", "text": "On a map, 3/8 inch = 6 miles. How many real miles is 2 1/4 inches on the map?", "answer": 36.0, "show": "36 miles", "hints": ["Find miles for ONE inch first.", "6 ÷ 3/8 = 6 × 8/3.", "Then multiply by 2 1/4 (that's 9/4)."], "steps": ["6 ÷ 3/8 = 6 × 8/3 = 16 miles per inch.", "16 × 9/4 = 36"], "id": "U2-12", "why_focus": "Practice keep-change-flip to get to ONE when the amounts are fractions.", "deps": {"level": "builds", "concepts": ["fraction-unit-rate", "div-fractions", "unit-rate", "mixed-numbers"]}, "tol": 1e-09}, {"sub": "2.2", "type": "E", "kind": "num", "text": "A machine makes 5 parts in 2/3 hour. How many hours does ONE part take? (Fraction or decimal.)", "answer": 0.13333333333333333, "show": "2/15 hour", "hints": ["Hours per part: parts go on the bottom.", "(2/3) ÷ 5", "Dividing by 5 is multiplying by 1/5."], "steps": ["(2/3) ÷ 5 = 2/3 × 1/5", "= 2/15 of an hour (about 0.13 hour, or 8 minutes)."], "id": "U2-13", "why_focus": "Practice keep-change-flip to get to ONE when the amounts are fractions.", "deps": {"level": "foundation", "concepts": ["fraction-unit-rate", "div-fractions"]}, "tol": 0.006}, {"sub": "2.3", "type": "A", "kind": "choice", "text": "Is the relationship between x and y proportional?", "options": ["Yes", "No"], "correct": 0, "show": "Yes", "hints": ["Divide y ÷ x in EVERY column.", "7 ÷ 2, 14 ÷ 4, 21 ÷ 6, 28 ÷ 8.", "Are they all the same?"], "steps": ["7/2 = 3.5, 14/4 = 3.5, 21/6 = 3.5, 28/8 = 3.5.", "Every row gives 3.5, so it is proportional (k = 3.5)."], "table": {"x": ["2", "4", "6", "8"], "y": ["7", "14", "21", "28"]}, "id": "U2-14", "why_focus": "Practice testing EVERY row so a broken pattern can't fool you.", "deps": {"level": "builds", "concepts": ["proportional-test", "unit-rate"]}}, {"sub": "2.3", "type": "A", "kind": "choice", "text": "Is the relationship between x and y proportional?", "options": ["Yes", "No"], "correct": 1, "show": "No", "hints": ["Divide y ÷ x in EVERY column, including the last.", "5 ÷ 3, 10 ÷ 6, 15 ÷ 9, 21 ÷ 12.", "Do they all match?"], "steps": ["5/3 ≈ 1.67, 10/6 ≈ 1.67, 15/9 ≈ 1.67, but 21/12 = 1.75.", "The last column breaks the pattern, so it is NOT proportional."], "table": {"x": ["3", "6", "9", "12"], "y": ["5", "10", "15", "21"]}, "id": "U2-15", "why_focus": "Practice testing EVERY row so a broken pattern can't fool you.", "deps": {"level": "builds", "concepts": ["proportional-test", "unit-rate"]}}, {"sub": "2.3", "type": "C", "kind": "num", "text": "This table is proportional. What is y when x = 8?", "answer": 19.2, "show": "19.2", "hints": ["First find y ÷ x.", "12 ÷ 5 = 2.4", "Multiply 8 by that."], "steps": ["12 ÷ 5 = 2.4, and 24/10 = 2.4, 36/15 = 2.4, so k = 2.4.", "y = 2.4 × 8 = 19.2"], "table": {"x": ["5", "10", "15"], "y": ["12", "24", "36"]}, "id": "U2-16", "why_focus": "Practice testing EVERY row so a broken pattern can't fool you.", "deps": {"level": "builds", "concepts": ["proportional-test", "unit-rate", "mul-decimals"]}, "tol": 1e-09}, {"sub": "2.3", "type": "A", "kind": "choice", "text": "A game center charges $4 to get in plus $3 per game. The cost for 1, 2, 3 games is $7, $10, $13. Is the cost proportional to the number of games?", "options": ["Yes", "No"], "correct": 1, "show": "No", "hints": ["Divide cost ÷ games for each.", "What would 0 games cost?", "7 ÷ 1, 10 ÷ 2, 13 ÷ 3"], "steps": ["7/1 = 7, 10/2 = 5, 13/3 ≈ 4.33. The ratios are not equal.", "Also, 0 games still costs $4. A starting fee means NOT proportional."], "id": "U2-17", "why_focus": "Practice testing EVERY row so a broken pattern can't fool you.", "deps": {"level": "builds", "concepts": ["proportional-test", "unit-rate"]}}, {"sub": "2.3", "type": "C", "kind": "num", "text": "This table is proportional. What is y when x = 5?", "answer": 10.0, "show": "10", "hints": ["Find y ÷ x using a column.", "1 ÷ (1/2) = 2", "Multiply 5 by that."], "steps": ["(1) ÷ (1/2) = 2; 4 ÷ 2 = 2; 6 ÷ 3 = 2, so k = 2.", "y = 2 × 5 = 10"], "table": {"x": ["1/2", "2", "3"], "y": ["1", "4", "6"]}, "id": "U2-18", "why_focus": "Practice testing EVERY row so a broken pattern can't fool you.", "deps": {"level": "builds", "concepts": ["proportional-test", "unit-rate", "mul-decimals"]}, "tol": 1e-09}, {"sub": "2.3", "type": "F", "kind": "choice", "text": "Which table is proportional?", "options": ["x: 1, 2, 3 and y: 3, 6, 9", "x: 1, 2, 3 and y: 3, 5, 7"], "correct": 0, "show": "x: 1, 2, 3 and y: 3, 6, 9", "hints": ["Check y ÷ x for each table.", "First table: 3, 3, 3. Second table?", "The second one has 3, 2.5, 2.33."], "steps": ["First table: 3/1 = 6/2 = 9/3 = 3, always the same.", "Second table: 3/1 = 3, 5/2 = 2.5, 7/3 ≈ 2.33. Not the same."], "id": "U2-19", "why_focus": "Practice testing EVERY row so a broken pattern can't fool you.", "deps": {"level": "builds", "concepts": ["proportional-test", "unit-rate", "reading-tables"]}}, {"sub": "2.4", "type": "A", "kind": "num", "text": "A hiker walks 14 miles in 4 hours at a steady pace. What is the constant of proportionality k (miles per hour)?", "answer": 3.5, "show": "3.5 mph", "hints": ["k is y over x. What is y here, and what is x?", "y = miles, x = hours.", "14 ÷ 4"], "steps": ["k = y ÷ x = 14 ÷ 4", "k = 3.5 miles per hour."], "id": "U2-20", "why_focus": "Practice finding k and using y = kx to find any amount.", "deps": {"level": "builds", "concepts": ["k-const", "unit-rate"]}, "tol": 1e-09}, {"sub": "2.4", "type": "C", "kind": "num", "text": "y = 6.5x. What is y when x = 14?", "answer": 91.0, "show": "91", "hints": ["Replace x with 14.", "y = 6.5 × 14", "Break apart: 6.5 × 10 + 6.5 × 4."], "steps": ["y = 6.5(14)", "6.5 × 14 = 65 + 26 = 91"], "id": "U2-21", "why_focus": "Practice finding k and using y = kx to find any amount.", "deps": {"level": "foundation", "concepts": ["y-eq-kx", "k-const", "solve-1step"]}, "tol": 1e-09}, {"sub": "2.4", "type": "C", "kind": "num", "text": "y = 0.4x. What is x when y = 18?", "answer": 45.0, "show": "45", "hints": ["You know y. What undoes 'times 0.4'?", "Divide both sides by 0.4.", "18 ÷ 0.4 = 180 ÷ 4"], "steps": ["18 = 0.4x", "x = 18 ÷ 0.4 = 180 ÷ 4", "x = 45"], "id": "U2-22", "why_focus": "Practice finding k and using y = kx to find any amount.", "deps": {"level": "foundation", "concepts": ["y-eq-kx", "k-const", "solve-1step"]}, "tol": 1e-09}, {"sub": "2.4", "type": "B", "kind": "num", "text": "For every 5 tickets, the cost goes up $32.50. What is the cost of ONE ticket (that's k)?", "answer": 6.5, "show": "6.5 dollars", "hints": ["Is $32.50 the price of one ticket?", "Get to ONE: divide by 5.", "32.50 ÷ 5"], "steps": ["k = y ÷ x = 32.50 ÷ 5", "k = 6.5, so one ticket is $6.50."], "id": "U2-23", "why_focus": "Practice finding k and using y = kx to find any amount.", "deps": {"level": "builds", "concepts": ["y-eq-kx", "k-const", "unit-rate"]}, "tol": 1e-09}, {"sub": "2.4", "type": "B", "kind": "num", "text": "Tickets cost $6.50 each. The equation is y = 6.5x. What do 12 tickets cost (in dollars)?", "answer": 78.0, "show": "78 dollars", "hints": ["Use y = kx with x = 12.", "6.5 × 12", "6.5 × 10 + 6.5 × 2"], "steps": ["y = 6.5(12)", "65 + 13 = 78", "12 tickets cost $78.00."], "id": "U2-24", "why_focus": "Practice finding k and using y = kx to find any amount.", .28125], [3.5, 6.125], [3.75, 7.03125], [4.0, 8.0]], "label": ""}], "xmax": 5, "ymax": 12, "xl": "x", "yl": "y", "dots": []}, "id": "U2-30", "why_focus": "Practice the two graph tests: straight, and through (0, 0).", "deps": {"level": "builds", "concepts": ["proportional-graph", "proportional-test", "coordinate-plane"]}}, {"sub": "2.5", "type": "C", "kind": "num", "text": "A proportional graph is a straight line through (0, 0) and (5, 35). What is y when x = 1?", "answer": 7.0, "show": "7", "hints": ["The point (1, k) shows the constant of proportionality.", "k = y ÷ x using (5, 35).", "35 ÷ 5"], "steps": ["k = 35 ÷ 5 = 7", "So the point is (1, 7), and y = 7 when x = 1."], "id": "U2-31", "why_focus": "Practice the two graph tests: straight, and through (0, 0).", "deps": {"level": "builds", "concepts": ["proportional-graph", "k-const", "coordinate-plane"]}, "tol": 1e-09}, {"sub": "2.5", "type": "E", "kind": "choice", "text": "Two proportional graphs, Line A and Line B, both start at (0, 0). Which line has the bigger constant of proportionality k?", "options": ["Line A", "Line B"], "correct": 1, "show": "Line B", "hints": ["Find k for each: y ÷ x at the end point.", "A ends at (4, 6) and B ends at (4, 10).", "6 ÷ 4 and 10 ÷ 4."], "steps": ["A: k = 6 ÷ 4 = 1.5.", "B: k = 10 ÷ 4 = 2.5.", "The steeper line has the bigger k."], "graph": {"lines": [{"pts": [[0, 0], [4, 6]], "label": "A"}, {"pts": [[0, 0], [4, 10]], "label": "B"}], "xmax": 5, "ymax": 12, "xl": "x", "yl": "y", "dots": [[4, 6], [4, 10]]}, "id": "U2-32", "why_focus": "Practice the two graph tests: straight, and through (0, 0).", "deps": {"level": "mixed", "concepts": ["proportional-graph", "k-const", "compare-rates"]}}, {"sub": "2.6", "type": "A", "kind": "num", "text": "Mia is 4 years old when her cousin is 10. How old will her cousin be when Mia is 9?", "answer": 15.0, "show": "15 years old", "hints": ["Times or plus? Will they ever be the same age gap apart?", "Their ages keep a constant DIFFERENCE.", "The × 4 = 16 cups of nuts.", "It has 12, so it needs 16 − 12 = 4 more."], "id": "U2-36", "why_focus": "Practice deciding times or plus BEFORE you calculate.", "deps": {"level": "foundation", "concepts": ["equiv-ratios", "times-or-plus"]}, "tol": 1e-09}, {"sub": "2.6", "type": "E", "kind": "num", "text": "30 inches of ribbon cost $4.50. How much do 3 yards cost (in dollars)? (1 yard = 36 inches)", "answer": 16.2, "show": "16.2 dollars", "hints": ["Make the units match first.", "3 yards = 3 × 36 inches.", "Cost per inch: 4.50 ÷ 30."], "steps": ["3 yards = 108 inches.", "$4.50 ÷ 30 = $0.15 per inch.", "0.15 × 108 = 16.2"], "id": "U2-37", "why_focus": "Practice deciding times or plus BEFORE you calculate.", "deps": {"level": "mixed", "concepts": ["y-eq-kx", "unit-conversion", "unit-rate"]}, "tol": 1e-09}, {"sub": "2.6", "type": "A", "kind": "choice", "text": "A taxi charges $5 plus $2 per mile. Is the cost proportional to the number of miles?", "options": ["Yes", "No"], "correct": 1, "show": "No", "hints": ["What does a 0-mile ride cost?", "Is there a starting fee?", "Check cost ÷ miles for 1 and 2 miles."], "steps": ["1 mile: $7, 2 miles: $9. 7 ÷ 1 ≠ 9 ÷ 2.", "There is a $5 starting fee, so it is NOT proportional."], "id": "U2-38", "why_focus": "Practice deciding times or plus BEFORE you calculate.", "deps": {"level": "builds", "concepts": ["times-or-plus", "proportional-test"]}}, {"sub": "2.8", "type": "A", "kind": "num", "text": "Scale: 1 in. = 4 ft. A wall measures 7.5 in. on the drawing. How many feet long is the real wall?", "answer": 30.0, "show": "30 ft", "hints": ["Does the real wall come out bigger or smaller than the drawing?", "Each inch stands for 4 feet.", "7.5 × 4"], "steps": ["actual = scale × drawing", "4 × 7.5 = 30"], "id": "U2-39", "why_focus": "Practice using the scale, and converting each side before finding area.", "deps": {"level": "builds", "concepts": ["scale-factor", "k-const", "mul-decimals"]}, "tol": 1e-09}, {"sub": "2.8", "type": "B", "kind": "num", "text": "Scale: 2 in. = 9 ft. A room is 5 in. long on the drawing. How many feet long is the real room?", "answer": 22.5, "show": "22.5 ft", "hints": ["First make the scale 'ONE inch = ? ft'.", "9 ÷ 2 = 4.5 ft per inch.", "Then multiply by 5."], "steps": ["1 in. = 9 ÷ 2 = 4.5 ft.", "4.5 × 5 = 22.5"], "id": "U2-40", "why_focus": "Practice using the scale, and converting each side before finding area.", "deps": {"level": "builds", "concepts": ["scale-factor", "unit-rate", "div-decimals"]}, "tol": 1e-09}, {"sub": "2.8", "type": "C", "kind": "num", "text": "A drawing of a rectangle is 3 in. by 5 in. Scale: 1 in. = 6 ft. What is the REAL area in square feet?", "answer": 540.0, "show": "540 sq ft", "hints": ["Do not multiply the drawing's area by 6.", "Find the real length and the real width first.", "Then multiply them."], "steps": ["Real width: 3 × 6 = 18 ft. Real length: 5 × 6 = 30 ft.", "Area = 18 × 30 = 540 square feet."], "id": "U2-41", "why_focus": "Practice using the scale, and converting each side before finding area.", "deps": {"level": "foundation", "concepts": ["scale-factor", "area-rect", "mul-decimals"]}, "tol": 1e-09}, {"sub": "2.8", "type": "B", "kind": "num", "text": "A real 36-ft boat is 8 in. long in a scale drawing. 1 in. = how many feet?", "answer": 4.5, "show": "4.5 ft per inch", "hints": ["Scale means real size ÷ drawing size.", "You want feet for ONE inch.", "36 ÷ 8"], "steps": ["36 ft ÷ 8 in. = 4.5 ft per inch", "Scale: 1 in. = 4.5 ft."], "id": "U2-42", "why_focus": "Practice using the scale, and converting each side before finding area.", "deps": {"level": "builds", "concepts": ["scale-factor", "unit-rate", "div-decimals"]}, "tol": 1e-09}, {"sub": "2.8", "type": "D", "kind": "num", "text": "A logo drawing is 6 in. long at a scale of 1 in. = 5 ft. You redraw it 10 in. long. What is the new scale (feet per inch)?", "answer": 3.0, "show": "3 ft per inch", "hints": ["Find the REAL length first.", "6 × 5 = 30 ft.", "Real length ÷ new drawing length."], "steps": ["Real length: 6 × 5 = 30 ft.", "New scale: 30 ft ÷ 10 in. = 3 ft per inch."], "id": "U2-43", "why_focus": "Practice using the scale, and converting each side before finding area.", "deps": {"level": "mixed", "concepts": ["new-scale", "scale-factor", "k-const", "unit-rate"]}, "tol": 1e-09}, {"sub": "2.8", "type": "A", "kind": "num", "text": "Map scale: 1 in. = 25 miles. Two towns are 3 1/2 in. apart on the map. How many real miles apart are they?", "answer": 87.5, "show": "87.5 miles", "hints": ["Each inch stands for 25 miles.", "3 1/2 = 3.5", "25 × 3.5"], "steps": ["25 × 3.5 = 75 + 12.5", "= 87.5 miles."], "id": "U2-44", "why_focus": "Practice using the scale, and converting each side before finding area.", "deps": {"level": "builds", "concepts": ["scale-factor", "k-const", "mul-decimals"]}, "tol": 1e-09}], "lessons": {"2.1": {"title": "Unit rates", "move": "Divide to get to ONE, then multiply to scale up.", "hook": "Per means divide. Get to 1.", "trap": "Comparing totals instead of unit rates. Making 9 of 25 shots is worse than 8 of 20.", "why": {"goal": "Compare deals and speeds fairly by turning any rate into 'how much for ONE.'", "supports_future": "Every skill after this starts with a unit rate: equations, graphs, scale drawings, and later percent and slope.", "why_you_need_it": "Totals can fool you. 9 of 25 shots sounds better than 8 of 20, but per shot it's worse.", "real_life": "Grocery unit prices, miles per hour, steps per mile, pay per hour, phone plans.", "building_block": "Foundation. The first block of the unit; the rest is built from it."}}, "2.2": {"title": "Unit rates with fractions", "move": "Keep, change, flip, then cancel before you multiply.", "hook": "Flip the bottom.", "trap": "Flipping the wrong fraction. Only the divisor (the 'per' amount) flips.", "why": {"goal": "Do the same 'get to ONE' move when the amounts are fractions.", "supports_future": "Recipes, maps, and scale drawings use fraction rates. Lessons 2.4 and 2.8 depend on this.", "why_you_need_it": "Real measurements aren't always whole numbers: 3/4 cup, 1/6 hour, 2 1/2 miles.", "real_life": "Recipes, speed over a short time, fabric per item, map scales, medicine doses.", "building_block": "Builds on 2.1 plus fraction division from 6th grade."}}, "2.3": {"title": "Is it proportional?", "move": "Divide y ÷ x in EVERY row. All the same means proportional.", "hook": "Every row, same number, or no.", "trap": "Checking only two rows. One row that breaks the pattern makes it NOT proportional.", "why": {"goal": "Decide for sure whether two quantities are proportional.", "supports_future": "You can only use y = kx, a straight line through zero, or a scale factor when a relationship is truly proportional.", "why_you_need_it": "Lots of things look steady but aren't: a setup fee, or ages. Checking every row keeps you from using the wrong tool.", "real_life": "Is this a steady price per item, or is there a delivery fee? Phone plans, ride shares, memberships.", "building_block": "Gatekeeper skill: it decides whether the rest of the unit's tools apply."}}, "2.4": {"title": "y = kx", "move": "k = y ÷ x. Then write y = kx and use it.", "hook": "k is y over x.", "trap": "Using a group price as k. '3 lemons for $1.80' means k = 0.60, not 1.80.", "why": {"goal": "Write any proportional relationship as y = kx and use k to find anything.", "supports_future": "y = kx is your first linear equation. Slope, graphing lines, and Algebra start here.", "why_you_need_it": "An equation is a shortcut: once you know k, any amount takes one step.", "real_life": "Pay = hourly rate × hours. Cost = price × quantity. Distance = speed × time.", "building_block": "Turns the unit rate (2.1) into an equation, and sets up graphs (2.5) and slope later."}}, "2.5": {"title": "Graphs", "move": "Proportional = a straight line AND it goes through (0, 0). The point (1, k) shows k.", "hook": "Straight and through zero.", "trap": "Calling any straight line proportional. A line that starts at $3 is not.", "why": {"goal": "Recognize and read proportional relationships on a graph.", "supports_future": "Graphs of lines, slope, and comparing rates visually in 8th grade and science.", "why_you_need_it": "A picture shows at a glance whether something is proportional and which rate is bigger (steeper).", "real_life": "Charts of cost vs. amount, speed graphs, exchange rates, fitness apps.", "building_block": "Connects the table (2.3) and the equation (2.4) to a picture."}}, "2.6": {"title": "Times or plus?", "move": "Decide first: does doubling one double the other? If not, don't use a ratio.", "hook": "Times? Ratio. Plus? Just add.", "trap": "Using ratios on ages or on 'more helpers means less time' problems.", "why": {"goal": "Decide whether a problem is proportional before using ratios, then pick the right tool.", "supports_future": "Choosing the right model is the heart of word-problem solving in Algebra and science.", "why_you_need_it": "Not every steady problem is a ratio: ages add, and more helpers means less time.", "real_life": "Scaling a recipe, splitting work, planning for a crowd, checking a bill.", "building_block": "Mixes 2.1 to 2.5 into one skill: decide first, then solve."}}, "2.8": {"title": "Scale drawings", "move": "Make the scale '1 inch = ? ft', then multiply. For area, convert each side first.", "hook": "One inch first, then multiply.", "trap": "Multiplying the drawing's area by the scale. Convert length and width first.", "why": {"goal": "Use a scale to move between a drawing or map and the real thing, including areas.", "supports_future": "Similar figures and geometry in 7th and 8th grade; blueprints and maps in real life.", "why_you_need_it": "Scale is a constant of proportionality: actual = k × drawing. Areas grow by k × k.", "real_life": "Maps, blueprints, floor plans, model kits, enlarging a photo or poster.", "building_block": "Applies y = kx (2.4) in geometry, combining unit rates, fractions, and area."}}}, "concepts": {"div-decimals": {"name": "Dividing decimals", "plain": "Divide a money or measurement amount by a whole number.", "origin": "Grade 6"}, "mul-decimals": {"name": "Multiplying decimals", "plain": "Multiply a rate like $0.15 by a quantity.", "origin": "Grade 6"}, "div-fractions": {"name": "Dividing fractions", "plain": "Keep, change, flip, then cancel.", "origin": "Grade 6"}, "mul-fractions": {"name": "Multiplying fractions", "plain": "Multiply across and cancel first.", "origin": "Grades 5-6"}, "mixed-numbers": {"name": "Mixed numbers", "plain": "Turn 1 1/2 into 3/2 before you multiply or divide.", "origin": "Grades 5-6"}, "equiv-ratios": {"name": "Equivalent ratios and ratio tables", "plain": "Do the same multiply or divide to both rows.", "origin": "Grade 6"}, "unit-conversion": {"name": "Converting units", "plain": "Dozens, yards to inches, minutes to hours.", "origin": "Grades 5-6"}, "reading-tables": {"name": "Reading tables", "plain": "Pull pairs of numbers out of a table.", "origin": "Grades 4-6"}, "coordinate-plane": {"name": "Plotting and reading points", "plain": "(x, y): across, then up.", "origin": "Grades 5-6"}, "area-rect": {"name": "Area of a rectangle", "plain": "Length × width.", "origin": "Grades 3-6"}, "solve-1step": {"name": "Solving one-step equations", "plain": "Undo multiply with divide to find x.", "origin": "Grade 6"}, "compare-order": {"name": "Comparing numbers", "plain": "Decide which decimal or fraction is larger.", "origin": "Grades 5-6"}, "multi-step": {"name": "Multi-step word problems", "plain": "Break the story into steps and answer everything asked.", "origin": "Grade 6"}, "unit-rate": {"name": "Unit rates", "plain": "How much for exactly ONE.", "origin": "Lesson 2.1"}, "compare-rates": {"name": "Comparing rates", "plain": "Same units, then decide if bigger or smaller wins.", "origin": "Lesson 2.1"}, "fraction-unit-rate": {"name": "Unit rates with fractions", "plain": "Get to ONE when amounts are fractions.", "origin": "Lesson 2.2"}, "proportional-test": {"name": "Testing for proportional", "plain": "Same y ÷ x in every row, and 0 gives 0.", "origin": "Lesson 2.3"}, "k-const": {"name": "Constant of proportionality", "plain": "k = y ÷ x, the unit rate.", "origin": "Lesson 2.4"}, "y-eq-kx": {"name": "The equation y = kx", "plain": "Write and use the proportional equation.", "origin": "Lesson 2.4"}, "proportional-graph": {"name": "Proportional graphs", "plain": "Straight line through (0, 0); the point (1, k).", "origin": "Lesson 2.5"}, "times-or-plus": {"name": "Times or plus?", "plain": "Decide if it's proportional before using ratios.", "origin": "Lesson 2.6"}, "scale-factor": {"name": "Scale and scale factor", "plain": "Actual = k × drawing; area uses real sides.", "origin": "Lesson 2.8"}, "new-scale": {"name": "Changing the scale", "plain": "Find the real size first, then the new scale.", "origin": "Lesson 2.8"}}, "subs": ["2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.8"]};
const KEY = "mathseye.unit2.study.v1";
let save = {solved:{}}; try { save = Object.assign(save, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e) {} };
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LV = {foundation:"Base skill", builds:"Builds on one earlier lesson", mixed:"Mixes several lessons"};
const LVTXT = {foundation:"This problem mostly uses this lesson's skill plus skills from earlier grades.", builds:"This problem uses this lesson's skill together with one earlier lesson from this unit.", mixed:"This problem combines several lessons from this unit. Try the earlier ones first if you get stuck."};
const S = {tab:"toolkit", filter:"all", idx:0, cur:null, test:null};
function parseNum(s){ s = String(s).trim().replace(/[−–]/g,"-").replace(/[$,]/g,"").replace(/\s+/g," ");
  let m = s.match(/^(-?)(\d+) (\d+)\/(\d+)$/); if (m) return (m[1]?-1:1)*(+m[2] + m[3]/m[4]);
  m = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/); if (m) return m[1]/m[2];
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s); return NaN; }
const isRight = (p, v) => p.kind === "choice" ? v === p.correct : Math.abs(parseNum(v) - p.answer) <= (p.tol || 1e-9);
function graphSVG(g){ const W=380,H=270,L=46,B=38,T=14,R=18,pw=W-L-R,ph=H-T-B,X=v=>L+v/g.xmax*pw,Y=v=>T+ph-v/g.ymax*ph; let s=`<svg class="g" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graph">`;
  for(let i=0;i<=g.xmax;i++) s+=`<line class="gr" x1="${X(i)}" y1="${T}" x2="${X(i)}" y2="${T+ph}"/><text x="${X(i)}" y="${T+ph+18}" text-anchor="middle">${i}</text>`;
  const ys = g.ymax>10?2:1; for(let i=0;i<=g.ymax;i+=ys) s+=`<line class="gr" x1="${L}" y1="${Y(i)}" x2="${L+pw}" y2="${Y(i)}"/><text x="${L-8}" y="${Y(i)+4}" text-anchor="end">${i}</text>`;
  s+=`<line class="ax" x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}"/><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}"/>`;
  g.lines.forEach((ln,i)=>{ s+=`<polyline class="${i?'ln2':'ln'}" points="${ln.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`; if(ln.label){const e=ln.pts[ln.pts.length-1]; s+=`<text class="lb" x="${X(e[0])+6}" y="${Y(e[1])+4}">${ln.label}</text>`;}});
  (g.dots||[]).forEach(d=>{ s+=`<circle class="dot" cx="${X(d[0])}" cy="${Y(d[1])}" r="5"/><text class="lb" x="${X(d[0])-8}" y="${Y(d[1])-10}" text-anchor="end">(${d[0]}, ${d[1]})</text>`;});
  return s+`<text x="${L+pw/2}" y="${H-4}" text-anchor="middle">${g.xl}</text><text x="12" y="${T+ph/2}" transform="rotate(-90 12 ${T+ph/2})" text-anchor="middle">${g.yl}</text></svg>`; }
const tableHTML = (t) => `<div class="tw"><table class="t"><tr><th>x</th>${t.x.map(v=>`<td>${esc(v)}</td>`).join("")}</tr><tr><th>y</th>${t.y.map(v=>`<td>${esc(v)}</td>`).join("")}</tr></table></div>`;
function whyHTML(p){ const w = DATA.lessons[p.sub].why; return `<div class="panel" role="region" aria-label="Why"><p style="margin:0"><b>${esc(p.why_focus)}</b></p><dl style="margin:0"><dt>The goal</dt><dd>${esc(w.goal)}</dd><dt>How it helps later</dt><dd>${esc(w.supports_future)}</dd><dt>Why you need it</dt><dd>${esc(w.why_you_need_it)}</dd><dt>Where you'll see it</dt><dd>${esc(w.real_life)}</dd><dt>Building block</dt><dd>${esc(w.building_block)}</dd></dl></div>`; }
function depsHTML(p){ const d=p.deps; return `<div class="panel" role="region" aria-label="Dependencies"><div><span class="lvl">${LV[d.level]}</span></div><p style="margin:0">${LVTXT[d.level]}</p><ul class="cl">${d.concepts.map(c=>{const k=DATA.concepts[c];return `<li><span><b>${esc(k.name)}</b><br><small>${esc(k.plain)}</small></span><span class="tag">${esc(k.origin)}</span></li>`}).join("")}</ul></div>`; }

function lessonCard(sub){ const L = DATA.lessons[sub]; const c = $(`<section class="card"><p class="eyebrow">Lesson ${sub}</p><h2>${esc(L.title)}</h2><p class="move">${esc(L.move)}</p><p class="hook">${esc(L.hook)}</p><p class="trap"><b>Watch out:</b> ${esc(L.trap)}</p><div class="row"><button class="btn" aria-expanded="false">Why this matters</button><button class="btn go">Practice ${sub}</button></div><div class="slot"></div></section>`);
  const [why, go] = c.querySelectorAll("button"); why.onclick = () => { const open = why.getAttribute("aria-expanded")==="true"; why.setAttribute("aria-expanded", !open); c.querySelector(".slot").innerHTML = open ? "" : whyHTML({sub, why_focus: L.hook}); };
  go.onclick = () => { S.tab="practice"; S.filter=sub; S.idx=0; S.cur=null; render(); window.scrollTo(0,0); }; return c; }
function toolkit(root){ root.append($(`<div class="card"><p class="eyebrow">Your toolkit</p><h2>One move per lesson</h2><p class="move">Proportional means y is always the same number times x. That number is k, and it is the unit rate.</p></div>`)); DATA.subs.forEach(s => root.append(lessonCard(s))); }

function pool(){ return DATA.problems.filter(p => S.filter==="all" || p.sub===S.filter); }
function practice(root){
  const chips = $(`<div class="chips" role="group" aria-label="Lesson filter">${["all",...DATA.subs].map(s=>`<button aria-pressed="${S.filter===s}" data-s="${s}">${s==="all"?"All lessons":s}</button>`).join("")}</div>`);
  chips.onclick = e => { const b=e.target.closest("button"); if(!b) return; S.filter=b.dataset.s; S.idx=0; S.cur=null; render(); }; root.append(chips);
  const ps = pool(); const done = ps.filter(p=>save.solved[p.id]).length; root.append($(`<div><div class="meta"><span>${done} of ${ps.length} solved</span><span>Problem ${S.idx+1} of ${ps.length}</span></div><div class="bar"><i style="width:${ps.length?done/ps.length*100:0}%"></i></div></div>`));
  const p = ps[S.idx]; if (!S.cur || S.cur.id !== p.id) S.cur = {id:p.id, input:"", pick:null, tries:0, hints:0, solved:!!save.solved[p.id], steps:false, why:false, deps:false};
  root.append(problemCard(p, S.cur, ps)); }
function problemCard(p, st, ps){
  const card = $(`<section class="card"><div class="meta"><span class="eyebrow">Lesson ${p.sub}</span><span>${LV[p.deps.level]}</span></div><p class="problem">${esc(p.text)}</p><div class="vis"></div><div class="in"></div><p class="fb" aria-live="polite"></p><ul class="clues"></ul><div class="row tools"></div><div class="slot"></div></section>`);
  const vis = card.querySelector(".vis"), inp = card.querySelector(".in"), fb = card.querySelector(".fb"), clues = card.querySelector(".clues"), tools = card.querySelector(".tools"), slot = card.querySelector(".slot");
  if (p.graph) vis.innerHTML = graphSVG(p.graph); if (p.table) vis.innerHTML = tableHTML(p.table);
  function draw(){
    inp.innerHTML = ""; 
    if (p.kind==="choice") { const o=$(`<div class="opts">${p.options.map((t,i)=>`<button aria-pressed="${st.pick===i}" data-i="${i}">${esc(t)}</button>`).join("")}</div>`); o.onclick=e=>{const b=e.target.closest("button"); if(!b||st.solved) return; st.pick=+b.dataset.i; draw(); }; inp.append(o); inp.append($(`<div class="row" style="margin-top:10px"><button class="btn primary chk">Check</button></div>`)); inp.querySelector(".chk").onclick=()=>check(st.pick); }
    else { inp.append($(`<div class="answer" aria-live="polite">${st.solved?esc(p.show):(st.input?esc(st.input):'<span class="ph">Your answer</span>')}</div>`));
      if(!st.solved){ const keys=["7","8","9","⌫","4","5","6","−","1","2","3","/","0",".","␣"]; const pad=$(`<div class="pad">${keys.map(k=>`<button data-k="${k}" aria-label="${k==='⌫'?'Delete':k==='␣'?'Space':k}">${k==="␣"?"space":k}</button>`).join("")}<button class="go" data-k="go">Check</button></div>`);
        pad.onclick=e=>{const b=e.target.closest("button"); if(!b) return; const k=b.dataset.k; if(k==="go") return check(st.input); st.input = k==="⌫"?st.input.slice(0,-1):(st.input.length<14?st.input+(k==="␣"?" ":k):st.input); draw(); }; inp.append(pad); } }
    clues.innerHTML = p.hints.slice(0,st.hints).map(h=>`<li>${esc(h)}</li>`).join("");
    tools.innerHTML = ""; const mk=(t,fn,dis,exp)=>{const b=$(`<button class="btn"${dis?" disabled":""}${exp!==undefined?` aria-expanded="${exp}"`:""}>${t}</button>`); b.onclick=fn; tools.append(b); return b;};
    if(!st.solved) mk(st.hints<3?`Hint ${st.hints+1} of 3`:"No more hints", ()=>{st.hints++; draw();}, st.hints>=3);
    if(!st.solved) mk("Show the steps", ()=>{st.steps=!st.steps; draw();}, !(st.tries>0||st.hints>=3), st.steps); else mk("See the steps", ()=>{st.steps=!st.steps; draw();}, false, st.steps);
    mk("Why", ()=>{st.why=!st.why; draw();}, false, st.why); mk("Dependencies", ()=>{st.deps=!st.deps; draw();}, false, st.deps);
    slot.innerHTML = (st.steps?`<div class="panel"><b>Worked steps</b><ol class="steps">${p.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><p style="margin:0"><b>Answer:</b> ${esc(p.show)}</p></div>`:"") + (st.why?whyHTML(p):"") + (st.deps?depsHTML(p):"");
    if(st.solved){ const nx=$(`<button class="btn primary">${S.idx+1<ps.length?"Next problem":"Back to the first"}</button>`); nx.onclick=()=>{S.idx=(S.idx+1)%ps.length; S.cur=null; render(); window.scrollTo(0,0);}; tools.append(nx); }
  }
  function check(v){ if(v===null||v===""||v===undefined){ fb.textContent = p.kind==="choice"?"Pick an answer first.":"Type an answer first."; return; }
    st.tries++; if(isRight(p,v)){ st.solved=true; save.solved[p.id]=true; persist(); fb.className="fb good"; fb.textContent = st.tries===1&&st.hints===0?"Nice, you got that on your own.":"You got it."; }
    else { fb.className="fb"; fb.textContent = "Not yet. Try again, or take a hint."; st.input=""; }
    draw(); }
  draw(); if(st.solved){ fb.className="fb good"; fb.textContent="You got it."; } return card; }

function startTest(){ const picks=[]; DATA.subs.forEach(s=>{ const a=DATA.problems.filter(p=>p.sub===s).sort(()=>Math.random()-.5).slice(0,2); picks.push(...a); }); S.test={list:picks.sort(()=>Math.random()-.5), i:0, ans:[], input:"", pick:null, done:false}; }
function testView(root){
  if(!S.test){ root.append($(`<div class="card"><p class="eyebrow">Practice test</p><h2>14 mixed problems, no hints</h2><p class="move">Two from each lesson, in a mixed order, like the real test. You see how you did at the end, and which lessons to go back to.</p><div class="row"><button class="btn primary" id="st">Start the test</button></div></div>`)); root.querySelector("#st").onclick=()=>{startTest(); render();}; return; }
  const T=S.test;
  if(T.done){ const right=T.list.filter((p,i)=>isRight(p,T.ans[i])).length; const rev=[...new Set(T.list.filter((p,i)=>!isRight(p,T.ans[i])).map(p=>p.sub))];
    root.append($(`<div class="card"><p class="eyebrow">Finished</p><h2>${right} of ${T.list.length} on your own</h2><p class="move">${rev.length?"Lessons to look at again: "+rev.map(s=>"<b>"+s+"</b>").join(", ")+".":"Every lesson looks solid. Nice work."}</p><div class="row">${rev.map(s=>`<button class="btn" data-s="${s}">Practice ${s}</button>`).join("")}<button class="btn primary" id="again">Try a new test</button></div></div>`));
    root.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.tab="practice";S.filter=b.dataset.s;S.idx=0;S.cur=null;render();}); root.querySelector("#again").onclick=()=>{S.test=null;render();};
    const res=$(`<div class="res"></div>`); T.list.forEach((p,i)=>{ const ok=isRight(p,T.ans[i]); const mine=p.kind==="choice"?(T.ans[i]===null?"(no answer)":p.options[T.ans[i]]):(T.ans[i]||"(no answer)"); res.append($(`<div class="it"><span>${esc(p.text)}</span><span>Your answer: ${esc(mine)}</span>${ok?'<span class="ok">Got it ✓</span>':`<span class="rv">Revisit lesson ${p.sub}. Answer: ${esc(p.show)}</span>`}</div>`)); }); root.append(res); return; }
  const p=T.list[T.i]; root.append($(`<div><div class="meta"><span>Question ${T.i+1} of ${T.list.length}</span></div><div class="bar"><i style="width:${T.i/T.list.length*100}%"></i></div></div>`));
  const c=$(`<section class="card"><p class="problem">${esc(p.text)}</p><div class="vis"></div><div class="in"></div><div class="row"><button class="btn primary nx">${T.i+1<T.list.length?"Next":"Finish"}</button></div></section>`);
  if(p.graph) c.querySelector(".vis").innerHTML=graphSVG(p.graph); if(p.table) c.querySelector(".vis").innerHTML=tableHTML(p.table); const inp=c.querySelector(".in");
  const draw=()=>{ inp.innerHTML=""; if(p.kind==="choice"){ const o=$(`<div class="opts">${p.options.map((t,i)=>`<button aria-pressed="${T.pick===i}" data-i="${i}">${esc(t)}</button>`).join("")}</div>`); o.onclick=e=>{const b=e.target.closest("button"); if(b){T.pick=+b.dataset.i; draw();}}; inp.append(o); }
    else { inp.append($(`<div class="answer">${T.input?esc(T.input):'<span class="ph">Your answer</span>'}</div>`)); const keys=["7","8","9","⌫","4","5","6","−","1","2","3","/","0",".","␣"]; const pad=$(`<div class="pad">${keys.map(k=>`<button data-k="${k}">${k==="␣"?"space":k}</button>`).join("")}</div>`); pad.onclick=e=>{const b=e.target.closest("button"); if(!b) return; const k=b.dataset.k; T.input=k==="⌫"?T.input.slice(0,-1):(T.input.length<14?T.input+(k==="␣"?" ":k):T.input); draw();}; inp.append(pad); } };
  draw(); c.querySelector(".nx").onclick=()=>{ T.ans[T.i]=p.kind==="choice"?T.pick:T.input; T.input=""; T.pick=null; if(T.i+1<T.list.length) T.i++; else T.done=true; render(); window.scrollTo(0,0); }; root.append(c); }

function render(){ const app=document.getElementById("app"); app.innerHTML="";
  app.append($(`<header><h1>Unit 2 Study Guide</h1><p class="sub">Proportional relationships, lessons 2.1 to 2.8</p></header>`));
  const tabs=$(`<div class="tabs" role="tablist">${[["toolkit","Toolkit"],["practice","Practice"],["test","Practice test"]].map(([k,t])=>`<button role="tab" aria-selected="${S.tab===k}" data-k="${k}">${t}</button>`).join("")}</div>`); tabs.onclick=e=>{const b=e.target.closest("button"); if(b){S.tab=b.dataset.k; render();}}; app.append(tabs);
  const body=$(`<div style="display:flex;flex-direction:column;gap:16px;min-width:0"></div>`); app.append(body);
  ({toolkit,practice,test:testView})[S.tab](body); }
render();
