<!doctype html>
<html lang="en"><head><meta charset="utf-8"></head><body>
<title>Unit 2 Study Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column. One main action per screen; help tools live in a sheet so the problem stays the focus. */
:root{--bg:#16131f;--panel:#221e31;--panel2:#2d2845;--fg:#f1e9dc;--muted:#b9afc9;--accent:#f4b860;--accent-fg:#2a1d08;--good:#9fd3a8;--good-bg:#1f3a2c;--line:#403959;--focus:#f4b860;
 --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f2f8;--panel:#ffffff;--panel2:#ebe7f5;--fg:#241f35;--muted:#5d5473;--accent:#a3600a;--accent-fg:#ffffff;--good:#23683b;--good-bg:#dff1e4;--line:#d2cce2;--focus:#a3600a;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f2f8;--panel:#ffffff;--panel2:#ebe7f5;--fg:#241f35;--muted:#5d5473;--accent:#a3600a;--accent-fg:#ffffff;--good:#23683b;--good-bg:#dff1e4;--line:#d2cce2;--focus:#a3600a;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:19px/1.55 var(--body);padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
#app{max-width:640px;margin:0 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,7vw,42px);letter-spacing:-.5px}h2{font-size:clamp(24px,5.4vw,30px)}h1:focus,h2:focus{outline:none}
.sub{color:var(--muted);margin:6px 0 0}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;border-radius:16px}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.card{background:var(--panel);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:14px;font-weight:600;margin:0}
.lead{margin:0;font-size:20px}.muted{color:var(--muted)}
.btn{background:var(--panel2);padding:14px 20px;min-height:56px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg)}.btn.big{min-height:68px;font-size:22px;width:100%}
.btn.ghost{background:transparent;border:2px solid var(--line)}.btn:disabled{opacity:.45;cursor:default}
.btn.quiet{background:none;color:var(--muted);text-decoration:underline;text-underline-offset:4px;min-height:48px;font-weight:500}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>.btn{flex:1 1 150px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.dots{display:flex;gap:8px;align-items:center}.dots i{width:14px;height:14px;border-radius:50%;background:var(--panel2);border:2px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}.dots i.now{border-color:var(--accent);background:transparent}
.bar{height:10px;background:var(--panel2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .4s}
.tile{background:var(--panel);padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:104px;width:100%}
.tile b{font-family:var(--display);font-size:20px}.tile small{color:var(--muted);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.acc{background:var(--panel);width:100%;text-align:left;padding:18px 20px;min-height:64px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.accb{background:var(--panel);border-radius:0 0 20px 20px;margin-top:-10px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px}
.hook{margin:0;padding:12px 16px;background:var(--panel2);border-radius:14px;font-weight:600;font-size:20px}
.problem{font-size:clamp(23px,5.4vw,30px);font-weight:500;margin:0;line-height:1.35}
table.t{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:22px}table.t th,table.t td{border:1px solid var(--line);padding:10px 18px;text-align:center}table.t th{background:var(--panel2);font-family:var(--display)}
.tw{overflow-x:auto}
.answer{font-size:34px;min-height:64px;padding:8px 16px;background:var(--panel2);border-radius:16px;font-variant-numeric:tabular-nums;color:var(--accent);display:flex;align-items:center}
.answer .ph{color:var(--muted);font-size:19px}.tip{margin:0 0 6px;color:var(--muted);font-size:16px}
.in:empty,.vis:empty,.nudges:empty,.act:empty{display:none}
.ans{margin:6px 0 0;font-weight:600}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pad button{background:var(--panel2);min-height:66px;font-size:26px;font-variant-numeric:tabular-nums}
.pad .go{grid-column:span 4;min-height:72px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:22px}
.opts{display:flex;flex-direction:column;gap:12px}.opts button{background:var(--panel2);padding:18px 20px;text-align:left;font-size:21px;min-height:66px;border:3px solid transparent}
.opts button[aria-pressed=true]{border-color:var(--accent)}
.say{margin:0;padding:14px 18px;border-radius:18px;background:var(--panel2);border-left:5px solid var(--accent)}
.say.win{background:var(--good-bg);border-left-color:var(--good);font-weight:600}
.nudges{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:8px}
.sheetbg{position:fixed;inset:0;background:rgba(10,8,18,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:28px 28px 0 0;padding:24px max(20px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.lvl{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:16px}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}.cl li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.cl small{color:var(--muted);display:block;font-size:16px}
.tag{font-size:14px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
dl{margin:0}dt{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;text-transform:uppercase;letter-spacing:.08em}dd{margin:0 0 10px}
svg.g{width:100%;max-width:400px;height:auto}.g .ax{stroke:var(--muted);stroke-width:1.5}.g .gr{stroke:var(--line);stroke-width:1}.g text{fill:var(--muted);font:12px var(--body)}
.g .ln{stroke:var(--accent);stroke-width:3.5;fill:none}.g .ln2{stroke:var(--good);stroke-width:3.5;fill:none}.g .dot{fill:var(--accent)}.g .lb{fill:var(--fg);font-weight:600}
.big-n{font-family:var(--display);font-size:56px;line-height:1;color:var(--accent)}
.res{display:flex;flex-direction:column;gap:10px}.res .it{background:var(--panel2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:17px}.ok{color:var(--good);font-weight:600}.rv{color:var(--accent);font-weight:600}
.timer{font-family:var(--display);font-size:64px;text-align:center;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.97)}}.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}.nudges li{animation:fadein .3s}@keyframes fadein{from{opacity:0;transform:translateY(5px)}}}
</style>
<div id="app"></div><div id="sheet"></div>
<script>
const DATA = {"problems": [{"sub": "2.1", "type": "A", "kind": "num", "text": "A 12-pack of juice boxes costs $4.68. What is the cost of one juice box (in dollars)?", "answer": 0.39, "show": "0.39 dollars", "hints": ["You want the cost for ONE box. What do you divide by?", "Get to ONE: divide the total cost by the number of boxes.", "4.68 ÷ 12 = ?"], "steps": ["'Per box' means divide by the 12 boxes.", "4.68 ÷ 12 = 0.39", "One juice box costs $0.39."], "id": "U2-01", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["unit-rate", "div-decimals"]}, "tol": 1e-09}, {"sub": "2.1", "type": "B", "kind": "choice", "text": "Brand X: 18 oz for $5.04. Brand Y: 30 oz for $8.10. Which costs less per ounce?", "options": ["Brand X", "Brand Y"], "correct": 1, "show": "Brand Y", "hints": ["Compare the cost of ONE ounce for each brand.", "Divide each price by its ounces.", "5.04 ÷ 18 and 8.10 ÷ 30. Which is smaller?"], "steps": ["Brand X: 5.04 ÷ 18 = 0.28 per ounce.", "Brand Y: 8.10 ÷ 30 = 0.27 per ounce.", "The smaller price per ounce is the better deal."], "id": "U2-02", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["unit-rate", "compare-rates", "div-decimals"]}}, {"sub": "2.1", "type": "C", "kind": "num", "text": "A printer prints 84 pages in 6 minutes. At that rate, how many pages in 25 minutes?", "answer": 350.0, "show": "350 pages", "hints": ["First, how many pages in ONE minute?", "84 ÷ 6 gives pages per minute.", "Then multiply by 25 minutes."], "steps": ["84 ÷ 6 = 14 pages per minute.", "14 × 25 = 350"], "id": "U2-03", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["unit-rate", "mul-decimals"]}, "tol": 1e-09}, {"sub": "2.1", "type": "D", "kind": "num", "text": "A class has 4 boys for every 5 girls. There are 35 girls. How many boys?", "answer": 28.0, "show": "28 boys", "hints": ["Make a ratio table: boys on one row, girls on the other.", "How do you get from 5 girls to 35 girls?", "Do the same to the 4 boys."], "steps": ["5 × 7 = 35, so multiply the boys by 7 too.", "4 × 7 = 28"], "id": "U2-04", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["equiv-ratios"]}, "tol": 1e-09}, {"sub": "2.1", "type": "E", "kind": "num", "text": "A recipe uses 3 cups of flour for every 12 muffins. Flour costs $0.40 per cup. What does the flour cost for 60 muffins (in dollars)?", "answer": 6.0, "show": "6 dollars", "hints": ["Two steps: cups of flour first, then cost.", "60 muffins is 5 times as many as 12 muffins.", "Cups × $0.40."], "steps": ["60 ÷ 12 = 5, so 3 × 5 = 15 cups of flour.", "15 × 0.40 = 6", "The flour costs $6.00."], "id": "U2-05", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["unit-rate", "multi-step", "mul-decimals"]}, "tol": 1e-09}, {"sub": "2.1", "type": "F", "kind": "num", "text": "Gloves are sold 3 dozen for $54. What does one pair cost (in dollars)?", "answer": 1.5, "show": "1.5 dollars", "hints": ["How many single pairs are in 3 dozen?", "1 dozen is 12, so 3 dozen is 36.", "54 ÷ 36"], "steps": ["3 dozen = 3 × 12 = 36 pairs.", "54 ÷ 36 = 1.5", "One pair costs $1.50."], "id": "U2-06", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["unit-rate", "unit-conversion", "div-decimals"]}, "tol": 1e-09}, {"sub": "2.1", "type": "B", "kind": "choice", "text": "Ava types 195 words in 5 minutes. Ben types 224 words in 7 minutes. Who types faster?", "options": ["Ava", "Ben"], "correct": 0, "show": "Ava", "hints": ["Faster means more words in ONE minute.", "Divide words by minutes for each person.", "195 ÷ 5 and 224 ÷ 7."], "steps": ["Ava: 195 ÷ 5 = 39 words per minute.", "Ben: 224 ÷ 7 = 32 words per minute.", "More words per minute is faster."], "id": "U2-07", "why_focus": "Practice getting to ONE, the move every other problem in this unit uses.", "deps": {"level": "foundation", "concepts": ["unit-rate", "compare-rates", "div-decimals"]}}, {"sub": "2.2", "type": "A", "kind": "num", "text": "A hose fills 3/4 of a bucket in 1/2 minute. How many buckets per minute?", "answer": 1.5, "show": "1 1/2 buckets per minute", "hints": ["Per minute: what has to be 1?", "Divide: (3/4) ÷ (1/2).", "Keep, change, flip: 3/4 × 2/1."], "steps": ["(3/4) ÷ (1/2) = 3/4 × 2/1", "= 6/4 = 3/2", "That is 1 1/2 buckets per minute."], "id": "U2-08", "why_focus": "Practice keep-change-flip to get to ONE when the amounts are fractions.", "deps": {"level": "builds", "concepts": ["fraction-unit-rate", "div-fractions", "unit-rate"]}, "tol": 1e-09}, {"sub": "2.2", "type": "A", "kind": "num", "text": "A cyclist rides 5/6 mile in 1/12 hour. What is the speed in miles per hour?", "answer": 10.0, "show": "10 mph", "hints": ["Miles per hour: hours go on the bottom.", "(5/6) ÷ (1/12)", "Flip the 1/12 and cancel."], "steps": ["(5/6) ÷ (1/12) = 5/6 × 12/1", "Cancel 6 and 12: 5 × 2 = 10", "10 miles per hour."], "id": "U2-09", "why_focus": "Practice keep-change-flip to get to ONE when the amounts are fractions.", "deps": {"level": "builds", "concepts": ["fraction-unit-rate", "div-fractions", "unit-rate"]}, "tol": 1e-09}, {"sub": "2.2", "type": "B", "kind": "num", "text": "There are 120 Calories in 2/3 cup of cereal. How many Calories are in 2 cups?", "answer": 360.0, "show": "360 Calories", "hints": ["Find Calories in 1 cup first.", "120 ÷ (2/3) = 120 × 3/2.", "Then multiply by 2 cups."], "steps": ["120 ÷ 2/3 = 120 × 3/2 = 180 Calories per cup.", "180 × 2 = 360"], "id": "U2-10", "why_focus": "Practice keep-change-flip to get to ONE when the amounts are fractions.", "deps": {"level": "builds", "concepts": ["fraction-unit-rate", "div-fractions", "unit-rate", "mul-fractions"]}, "tol": 1e-09}, {"sub": "2.2", "type": "C", "kind": "choice", "text": "Runner A goes 1 1/2 miles in 1/4 hour. Runner B goes 2 1/4 miles in 1/3 hour. Who is faster?", "options": ["Runner A", "Runner B"], "correct": 1, "show": "Runner B", "hints": ["Find miles per ONE hour for each runner.", "Turn mixed numbers into fractions: 3/2 and 9/4.", "(3/2) ÷ (1/4) and (9/4) ÷ (1/3)."], "steps": ["A: (3/2) ÷ (1/4) = 3/2 × 4 = 6 mph.", "B: (9/4) ÷ (1/3) = 9/4 × 3 = 27/4 = 6.75 mph.", "Bigger speed wins."], "id": "U2-11", "why_focus": "Practice keep-change-flip to get to ONE when the amounts are fractions.", "deps": {"level": "builds", "concepts": ["fraction-unit-rate", "div-fractions", "compare-rates", "mixed-numbers"]}}, {"sub": "2.2", "type": "D", "kind": "num", "text": "On a map, 3/8 inch = 6 miles. How many real miles is 2 1/4 inches on the map?", "answer": 36.0, "show": "36 miles", "hints": ["Find miles for ONE inch first.", "6 ÷ 3/8 = 6 × 8/3.", "Then multiply by 2 1/4 (that's 9/4)."], "steps": ["6 ÷ 3/8 = 6 × 8/3 = 16 miles per inch.", "16 × 9/4 = 36"], "id": "U2-12", "why_focus": "Practice keep-change-flip to get to ONE when the amounts are fractions.", "deps": {"level": "builds", "concepts": ["fraction-unit-rate", "div-fractions", "unit-rate", "mixed-numbers"]}, "tol": 1e-09}, {"sub": "2.2", "type": "E", "kind": "num", "text": "A machine makes 5 parts in 2/3 hour. How many hours does ONE part take? (Fraction or decimal.)", "answer": 0.13333333333333333, "show": "2/15 hour", "hints": ["Hours per part: parts go on the bottom.", "(2/3) ÷ 5", "Dividing by 5 is multiplying by 1/5."], "steps": ["(2/3) ÷ 5 = 2/3 × 1/5", "= 2/15 of an hour (about 0.13 hour, or 8 minutes)."], "id": "U2-13", "why_focus": "Practice keep-change-flip to get to ONE when the amounts are fractions.", "deps": {"level": "foundation", "concepts": ["fraction-unit-rate", "div-fractions"]}, "tol": 0.006}, {"sub": "2.3", "type": "A", "kind": "choice", "text": "Is the relationship between x and y proportional?", "options": ["Yes", "No"], "correct": 0, "show": "Yes", "hints": ["Divide y ÷ x in EVERY column.", "7 ÷ 2, 14 ÷ 4, 21 ÷ 6, 28 ÷ 8.", "Are they all the same?"], "steps": ["7/2 = 3.5, 14/4 = 3.5, 21/6 = 3.5, 28/8 = 3.5.", "Every row gives 3.5, so it is proportional (k = 3.5)."], "table": {"x": ["2", "4", "6", "8"], "y": ["7", "14", "21", "28"]}, "id": "U2-14", "why_focus": "Practice testing EVERY row so a broken pattern can't fool you.", "deps": {"level": "builds", "concepts": ["proportional-test", "unit-rate"]}}, {"sub": "2.3", "type": "A", "kind": "choice", "text": "Is the relationship between x and y proportional?", "options": ["Yes", "No"], "correct": 1, "show": "No", "hints": ["Divide y ÷ x in EVERY column, including the last.", "5 ÷ 3, 10 ÷ 6, 15 ÷ 9, 21 ÷ 12.", "Do they all match?"], "steps": ["5/3 ≈ 1.67, 10/6 ≈ 1.67, 15/9 ≈ 1.67, but 21/12 = 1.75.", "The last column breaks the pattern, so it is NOT proportional."], "table": {"x": ["3", "6", "9", "12"], "y": ["5", "10", "15", "21"]}, "id": "U2-15", "why_focus": "Practice testing EVERY row so a broken pattern can't fool you.", "deps": {"level": "builds", "concepts": ["proportional-test", "unit-rate"]}}, {"sub": "2.3", "type": "C", "kind": "num", "text": "This table is proportional. What is y when x = 8?", "answer": 19.2, "show": "19.2", "hints": ["First find y ÷ x.", "12 ÷ 5 = 2.4", "Multiply 8 by that."], "steps": ["12 ÷ 5 = 2.4, and 24/10 = 2.4, 36/15 = 2.4, so k = 2.4.", "y = 2.4 × 8 = 19.2"], "table": {"x": ["5", "10", "15"], "y": ["12", "24", "36"]}, "id": "U2-16", "why_focus": "Practice testing EVERY row so a broken pattern can't fool you.", "deps": {"level": "builds", "concepts": ["proportional-test", "unit-rate", "mul-decimals"]}, "tol": 1e-09}, {"sub": "2.3", "type": "A", "kind": "choice", "text": "A game center charges $4 to get in plus $3 per game. The cost for 1, 2, 3 games is $7, $10, $13. Is the cost proportional to the number of games?", "options": ["Yes", "No"], "correct": 1, "show": "No", "hints": ["Divide cost ÷ games for each.", "What would 0 games cost?", "7 ÷ 1, 10 ÷ 2, 13 ÷ 3"], "steps": ["7/1 = 7, 10/2 = 5, 13/3 ≈ 4.33. The ratios are not equal.", "Also, 0 games still costs $4. A starting fee means NOT proportional."], "id": "U2-17", "why_focus": "Practice testing EVERY row so a broken pattern can't fool you.", "deps": {"level": "builds", "concepts": ["proportional-test", "unit-rate"]}}, {"sub": "2.3", "type": "C", "kind": "num", "text": "This table is proportional. What is y when x = 5?", "answer": 10.0, "show": "10", "hints": ["Find y ÷ x using a column.", "1 ÷ (1/2) = 2", "Multiply 5 by that."], "steps": ["(1) ÷ (1/2) = 2; 4 ÷ 2 = 2; 6 ÷ 3 = 2, so k = 2.", "y = 2 × 5 = 10"], "table": {"x": ["1/2", "2", "3"], "y": ["1", "4", "6"]}, "id": "U2-18", "why_focus": "Practice testing EVERY row so a broken pattern can't fool you.", "deps": {"level": "builds", "concepts": ["proportional-test", "unit-rate", "mul-decimals"]}, "tol": 1e-09}, {"sub": "2.3", "type": "F", "kind": "choice", "text": "Which table is proportional?", "options": ["x: 1, 2, 3 and y: 3, 6, 9", "x: 1, 2, 3 and y: 3, 5, 7"], "correct": 0, "show": "x: 1, 2, 3 and y: 3, 6, 9", "hints": ["Check y ÷ x for each table.", "First table: 3, 3, 3. Second table?", "The second one has 3, 2.5, 2.33."], "steps": ["First table: 3/1 = 6/2 = 9/3 = 3, always the same.", "Second table: 3/1 = 3, 5/2 = 2.5, 7/3 ≈ 2.33. Not the same."], "id": "U2-19", "why_focus": "Practice testing EVERY row so a broken pattern can't fool you.", "deps": {"level": "builds", "concepts": ["proportional-test", "unit-rate", "reading-tables"]}}, {"sub": "2.4", "type": "A", "kind": "num", "text": "A hiker walks 14 miles in 4 hours at a steady pace. What is the constant of proportionality k (miles per hour)?", "answer": 3.5, "show": "3.5 mph", "hints": ["k is y over x. What is y here, and what is x?", "y = miles, x = hours.", "14 ÷ 4"], "steps": ["k = y ÷ x = 14 ÷ 4", "k = 3.5 miles per hour."], "id": "U2-20", "why_focus": "Practice finding k and using y = kx to find any amount.", "deps": {"level": "builds", "concepts": ["k-const", "unit-rate"]}, "tol": 1e-09}, {"sub": "2.4", "type": "C", "kind": "num", "text": "y = 6.5x. What is y when x = 14?", "answer": 91.0, "show": "91", "hints": ["Replace x with 14.", "y = 6.5 × 14", "Break apart: 6.5 × 10 + 6.5 × 4."], "steps": ["y = 6.5(14)", "6.5 × 14 = 65 + 26 = 91"], "id": "U2-21", "why_focus": "Practice finding k and using y = kx to find any amount.", "deps": {"level": "foundation", "concepts": ["y-eq-kx", "k-const", "solve-1step"]}, "tol": 1e-09}, {"sub": "2.4", "type": "C", "kind": "num", "text": "y = 0.4x. What is x when y = 18?", "answer": 45.0, "show": "45", "hints": ["You know y. What undoes 'times 0.4'?", "Divide both sides by 0.4.", "18 ÷ 0.4 = 180 ÷ 4"], "steps": ["18 = 0.4x", "x = 18 ÷ 0.4 = 180 ÷ 4", "x = 45"], "id": "U2-22", "why_focus": "Practice finding k and using y = kx to find any amount.", "deps": {"level": "foundation", "concepts": ["y-eq-kx", "k-const", "solve-1step"]}, "tol": 1e-09}, {"sub": "2.4", "type": "B", "kind": "num", "text": "For every 5 tickets, the cost goes up $32.50. What is the cost of ONE ticket (that's k)?", "answer": 6.5, "show": "6.5 dollars", "hints": ["Is $32.50 the price of one ticket?", "Get to ONE: divide by 5.", "32.50 ÷ 5"], "steps": ["k = y ÷ x = 32.50 ÷ 5", "k = 6.5, so one ticket is $6.50."], "id": "U2-23", "why_focus": "Practice finding k and using y = kx to find any amount.", "deps": {"level": "builds", "concepts": ["y-eq-kx", "k-const", "unit-rate"]}, "tol": 1e-09}, {"sub": "2.4", "type": "B", "kind": "num", "text": "Tickets cost $6.50 each. The equation is y = 6.5x. What do 12 tickets cost (in dollars)?", "answer": 78.0, "show": "78 dollars", "hints": ["Use y = kx with x = 12.", "6.5 × 12", "6.5 × 10 + 6.5 × 2"], "steps": ["y = 6.5(12)", "65 + 13 = 78", "12 tickets cost $78.00."], "id": "U2-24", "why_focus": "Practice finding k and using y = kx to find any amount.", um", "text": "Scale: 2 in. = 9 ft. A room is 5 in. long on the drawing. How many feet long is the real room?", "answer": 22.5, "show": "22.5 ft", "hints": ["First make the scale 'ONE inch = ? ft'.", "9 ÷ 2 = 4.5 ft per inch.", "Then multiply by 5."], "steps": ["1 in. = 9 ÷ 2 = 4.5 ft.", "4.5 × 5 = 22.5"], "id": "U2-40", "why_focus": "Practice using the scale, and converting each side before finding area.", "deps": {"level": "builds", "concepts": ["scale-factor", "unit-rate", "div-decimals"]}, "tol": 1e-09}, {"sub": "2.8", "type": "C", "kind": "num", "text": "A drawing of a rectangle is 3 in. by 5 in. Scale: 1 in. = 6 ft. What is the REAL area in square feet?", "answer": 540.0, "show": "540 sq ft", "hints": ["Do not multiply the drawing's area by 6.", "Find the real length and the real width first.", "Then multiply them."], "steps": ["Real width: 3 × 6 = 18 ft. Real length: 5 × 6 = 30 ft.", "Area = 18 × 30 = 540 square feet."], "id": "U2-41", "why_focus": "Practice using the scale, and converting each side before finding area.", "deps": {"level": "foundation", "concepts": ["scale-factor", "area-rect", "mul-decimals"]}, "tol": 1e-09}, {"sub": "2.8", "type": "B", "kind": "num", "text": "A real 36-ft boat is 8 in. long in a scale drawing. 1 in. = how many feet?", "answer": 4.5, "show": "4.5 ft per inch", "hints": ["Scale means real size ÷ drawing size.", "You want feet for ONE inch.", "36 ÷ 8"], "steps": ["36 ft ÷ 8 in. = 4.5 ft per inch", "Scale: 1 in. = 4.5 ft."], "id": "U2-42", "why_focus": "Practice using the scale, and converting each side before finding area.", "deps": {"level": "builds", "concepts": ["scale-factor", "unit-rate", "div-decimals"]}, "tol": 1e-09}, {"sub": "2.8", "type": "D", "kind": "num", "text": "A logo drawing is 6 in. long at a scale of 1 in. = 5 ft. You redraw it 10 in. long. What is the new scale (feet per inch)?", "answer": 3.0, "show": "3 ft per inch", "hints": ["Find the REAL length first.", "6 × 5 = 30 ft.", "Real length ÷ new drawing leng nd on this.", "why_you_need_it": "Real measurements aren't always whole numbers: 3/4 cup, 1/6 hour, 2 1/2 miles.", "real_life": "Recipes, speed over a short time, fabric per item, map scales, medicine doses.", "building_block": "Builds on 2.1 plus fraction division from 6th grade."}}, "2.3": {"title": "Is it proportional?", "move": "Divide y ÷ x in EVERY row. All the same means proportional.", "hook": "Every row, same number, or no.", "trap": "Checking only two rows. One row that breaks the pattern makes it NOT proportional.", "why": {"goal": "Decide for sure whether two quantities are proportional.", "supports_future": "You can only use y = kx, a straight line through zero, or a scale factor when a relationship is truly proportional.", "why_you_need_it": "Lots of things look steady but aren't: a setup fee, or ages. Checking every row keeps you from using the wrong tool.", "real_life": "Is this a steady price per item, or is there a delivery fee? Phone plans, ride shares, memberships.", "building_block": "Gatekeeper skill: it decides whether the rest of the unit's tools apply."}}, "2.4": {"title": "y = kx", "move": "k = y ÷ x. Then write y = kx and use it.", "hook": "k is y over x.", "trap": "Using a group price as k. '3 lemons for $1.80' means k = 0.60, not 1.80.", "why": {"goal": "Write any proportional relationship as y = kx and use k to find anything.", "supports_future": "y = kx is your first linear equation. Slope, graphing lines, and Algebra start here.", "why_you_need_it": "An equation is a shortcut: once you know k, any amount takes one step.", "real_life": "Pay = hourly rate × hours. Cost = price × quantity. Distance = speed × time.", "building_block": "Turns the unit rate (2.1) into an equation, and sets up graphs (2.5) and slope later."}}, "2.5": {"title": "Graphs", "move": "Proportional = a straight line AND it goes through (0, 0). The point (1, k) shows k.", "hook": "Straight and through zero.", "trap": "Calling any straight line proportional. A line t   function helpMenu(p){ const bg = $(`<div class="sheetbg"><div class="sheet pop" role="dialog" aria-modal="true" aria-label="Help"><h2>Need something else?</h2><button class="btn" id="w">Why am I learning this?</button><button class="btn" id="u">What does this use?</button><button class="btn primary" id="c">Back to the problem</button></div></div>`);
    const root = document.getElementById("sheet"); root.innerHTML = ""; root.append(bg); const shut = () => { root.innerHTML = ""; }; bg.onclick = e => { if (e.target === bg) shut(); };
    bg.querySelector("#c").onclick = shut; bg.querySelector("#w").onclick = () => openSheet("why", p); bg.querySelector("#u").onclick = () => openSheet("deps", p); bg.querySelector("#c").focus(); }
  function check(v){ if (v === null || v === "" || v === undefined) { st.msg = p.kind==="choice" ? "Pick an answer first." : "Type an answer first."; st.win = false; return draw(); }
    res.tries++; if (isRight(p, v)) { res.done = true; save.solved[p.id] = true; const clean = res.tries === 1 && res.hints === 0; if (clean) save.clean[p.id] = true; bump(); persist(); st.win = true; st.msg = clean ? "You did that on your own. " + WIN[(m.i*2)%WIN.length] : WIN[(m.i*2+1)%WIN.length]; S.cur = st; render(); return; }
    st.win = false; st.msg = "Not quite yet. Try again, or tap I'm stuck."; st.input = ""; st.shake = true; persist(); render(); }
  const solvedNow = res.done; if (solvedNow && !st.msg) { st.win = true; st.msg = "Got it!"; }
  draw(); el.append(card); return el; },
summary(){ const m = save.mission, n = m ? m.ids.length : 0, ok = m ? m.ids.filter(id => m.res[id] && m.res[id].done).length : 0, clean = m ? m.ids.filter(id => save.clean[id] && m.res[id] && m.res[id].tries === 1 && m.res[id].hints === 0).length : 0;
  const el = $(`<div class="stack"><header><h1>Mission done!</h1></header><section class="card"><div class="big-n">${ok}</div><p class="lead">problem${ok===1?"":"s"} solved${clean?`, ${clean} with no help`:""}. That's real progress.</p></section>
  <button class="btn primary big" id="again">Another mission</button><div class="row"><button class="btn" id="brk">Take a 2-minute break</button><button class="btn" id="home">I'm done for now</button></div></div>`);
  save.mission = null; persist(); el.querySelector("#again").onclick = () => buildMission(null); el.querySelector("#brk").onclick = () => go("brk"); el.querySelector("#home").onclick = () => go("home"); return el; },
brk(){ let left = 120; const el = $(`<div class="stack"><header><h1>Quick break</h1><p class="sub">Your brain works better after one. Pick any.</p></header><section class="card"><ul class="steps"><li>Stand up and stretch your arms up high.</li><li>Drink some water.</li><li>Look out a window for 20 seconds.</li></ul><div class="timer" id="tm" aria-live="off">2:00</div><button class="btn primary big" id="start">Start a 2-minute timer</button></section><button class="btn" id="home">Back to home</button></div>`);
  el.querySelector("#home").onclick = () => go("home"); el.querySelector("#start").onclick = e => { e.target.disabled = true; clearInterval(S.timer); S.timer = setInterval(() => { left--; const tm = document.getElementById("tm"); if (tm) tm.textContent = Math.floor(left/60) + ":" + String(left%60).padStart(2,"0"); if (left <= 0) { clearInterval(S.timer); if (tm) tm.textContent = "Ready when you are."; } }, 1000); }; return el; },
testIntro(){ const el = $(`<div class="stack"></div>`); el.append(backBar("Home", () => go("home")), $(`<section class="card"><p class="eyebrow">Practice test</p><h2>14 questions, no hints</h2><p class="lead muted">Two from each lesson, mixed up like the real test. At the end you see which lessons to look at again. You can stop anytime.</p><button class="btn primary big" id="st">Start the test</button></section>`)); el.querySelector("#st").onclick = () => { const picks = []; DATA.subs.forEach(s => picks.push(...probs.filter(p => p.sub === s).sort(() => Math.random()-.5).slice(0,2))); S.test = {list:picks.sort(() => Math.random()-.5), i:0, ans:[], input:"", pick:null, all:false}; go("testQ"); }; return el; },
testQ(){ const T = S.test, p = T.list[T.i]; const el = $(`<div class="stack"></div>`);
  const top = $(`<div class="top"><button class="btn quiet" id="exit">✕ Stop</button><span class="muted">Question ${T.i+1} of ${T.list.length}</span></div>`); top.querySelector("#exit").onclick = () => go("home"); el.append(top, $(`<div class="bar" aria-hidden="true"><i style="width:${T.i/T.list.length*100}%"></i></div>`));
  const c = $(`<section class="card"><p class="problem">${esc(p.text)}</p><div class="vis">${visual(p)}</div><div class="in"></div><button class="btn primary big nx">${T.i+1<T.list.length?"Next":"Finish"}</button></section>`), inp = c.querySelector(".in");
  const draw = () => { inp.innerHTML = ""; if (p.kind === "choice") { const o = $(`<div class="opts">${p.options.map((t,i)=>`<button aria-pressed="${T.pick===i}" data-i="${i}">${esc(t)}</button>`).join("")}</div>`); o.onclick = e => { const b = e.target.closest("button"); if (b) { T.pick = +b.dataset.i; draw(); } }; inp.append(o); }
    else { inp.append($(`<div class="answer">${T.input ? esc(T.input) : '<span class="ph">Tap the numbers below</span>'}</div>`)); const keys = ["7","8","9","⌫","4","5","6","−","1","2","3","/","0",".","␣"]; const pad = $(`<div class="pad">${keys.map(k=>`<button data-k="${k}">${k==="␣"?"space":k}</button>`).join("")}</div>`); pad.onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k; T.input = k==="⌫" ? T.input.slice(0,-1) : (T.input.length < 14 ? T.input + (k==="␣" ? " " : k) : T.input); draw(); }; inp.append(pad); } };
  draw(); c.querySelector(".nx").onclick = () => { T.ans[T.i] = p.kind==="choice" ? T.pick : T.input; T.input = ""; T.pick = null; if (T.i+1 < T.list.length) { T.i++; go("testQ"); } else go("testDone"); }; el.append(c); return el; },
testDone(){ const T = S.test, right = T.list.filter((p,i) => isRight(p, T.ans[i])).length, rev = [...new Set(T.list.filter((p,i) => !isRight(p, T.ans[i])).map(p => p.sub))].sort();
  const el = $(`<div class="stack"><header><h1>Test finished</h1></header><section class="card"><div class="big-n">${right}<span class="muted" style="font-size:28px"> of ${T.list.length}</span></div><p class="lead">${rev.length ? "Look at these lessons again:" : "Every lesson looks solid. Nice work."}</p><div class="row">${rev.map(s=>`<button class="btn" data-s="${s}">${s} · ${esc(DATA.lessons[s].title)}</button>`).join("")}</div></section><button class="btn primary big" id="again">Try a new test</button><button class="btn" id="see">${T.all?"Hide my answers":"See my answers"}</button><button class="btn quiet" id="home">Home</button></div>`);
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => buildMission(b.dataset.s)); el.querySelector("#again").onclick = () => go("testIntro"); el.querySelector("#home").onclick = () => go("home"); el.querySelector("#see").onclick = () => { T.all = !T.all; render(); };
  if (T.all) { const res = $(`<div class="res"></div>`); T.list.forEach((p,i) => { const ok = isRight(p, T.ans[i]), mine = p.kind==="choice" ? (T.ans[i]==null ? "(no answer)" : p.options[T.ans[i]]) : (T.ans[i] || "(no answer)"); res.append($(`<div class="it"><span>${esc(p.text)}</span><span>Your answer: ${esc(mine)}</span>${ok?'<span class="ok">Got it ✓</span>':`<span class="rv">Look at lesson ${p.sub}. Answer: ${esc(p.show)}</span>`}</div>`)); }); el.insertBefore(res, el.querySelector("#home")); } return el; }
};
render();
</script>

</body></html>
