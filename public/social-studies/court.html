*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.5 var(--body);padding:18px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));user-select:none;-webkit-user-select:none}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top a{color:var(--accent);text-decoration:none;font:800 .95rem var(--display);letter-spacing:.2em}
.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;font-weight:700}
h1{font:800 2rem/1.15 var(--display);color:var(--fg)}
.muted{color:var(--muted)}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 22px 26px;display:flex;flex-direction:column;gap:14px}
.btn{font:700 1.1rem var(--body);min-height:60px;border-radius:18px;border:2px solid var(--line);background:var(--panel2);color:var(--fg);padding:12px 18px;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn.pressed,.opt.pressed{transform:scale(.985)}
.link{background:none;border:0;color:var(--accent);font:600 1rem var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:12px 6px;min-height:44px}
.link.quiet{color:var(--muted)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.meter{display:flex;height:18px;border-radius:99px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.meter i{display:block;height:100%}
.meter .solid,.dot.solid{background:var(--accent)}
.meter .getting,.dot.getting{background:var(--accent2,var(--accent));opacity:.65}
.meter .shaky,.dot.shaky{background:repeating-linear-gradient(45deg,var(--accent2,var(--accent)) 0 4px,transparent 4px 8px)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--accent)}

<body>
<div id="app"></div>
<script>
(function(){try{var b=localStorage.getItem('mathseye.brand');if(b)document.documentElement.setAttribute('data-brand',b)}catch(e){}})();
</script>
<script src="../profile.js"></script>
<script src="../press.js"></script>
<script src="../build.js"></script>
<script src="../feedback.js"></script>
<script src="../sync.js"></script>
<script src="./court.js"></script>
<script>
(function(){
var C = window.courtDeck, KEY = C.KEY + (window.mathseyeNs || ''), app = document.getElementById('app');
var data = load(), S = { again: {}, scope: 'all', sel: [], last: '', queue: null, screen: 'home', mode: 'all', recent: [], retry: [], asked: 0, right: 0, missed: {}, cur: null, picked: null };

/* ---- saved progress: { cards: { id: {seen, s, m, l, u} } } ---- */
function load(){
  var d = null;
  try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
  if (!d) { try { d = JSON.parse(localStorage.getItem(KEY + '.bak') || 'null'); } catch(e) {} }
  return d && d.cards ? d : { cards: {} };
}
function scopeIds(sc){ return C.DECK.filter(function(id){ var tf = /^tf/.test(id); return sc === 'tf' ? tf : sc === 'case' ? !tf : true; }); }
var lastBak = 0;
function persist(){
  try {
    var prev = localStorage.getItem(KEY), now = Date.now();
    if (prev && now - lastBak > 60000) { localStorage.setItem(KEY + '.bak', prev); lastBak = now; }
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch(e) {}
  if (window.mathseyeSync) mathseyeSync.touch();
}
function reload(){ data = load(); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---- screens ---- */
function render(){
  if (S.screen === 'home') home(); else if (S.screen === 'quiz') quiz(); else if (S.screen === 'know') know(); else if (S.screen === 'done') done();
  window.scrollTo(0, 0);
}
function top(){ return '<div class="top"><a href="../" aria-label="Mathseye, back to home">MATHSEYE</a></div>'; }
function meter(t, cls){ var n = t.total || 1; return '<div class="meter ' + (cls||'') + '" role="img" aria-label="' + t.solid + ' solid, ' + t.getting + ' getting there, ' + t.shaky + ' shaky, ' + t.new + ' not started">'
  + '<i class="solid" style="width:' + (100*t.solid/n) + '%"></i><i class="getting" style="width:' + (100*t.getting/n) + '%"></i><i class="shaky" style="width:' + (100*t.shaky/n) + '%"></i></div>'; }
function legend(t){ return '<div class="legend"><span><i class="dot solid"></i>Solid ' + t.solid + '</span><span><i class="dot getting"></i>Getting there ' + t.getting + '</span><span><i class="dot shaky"></i>Still shaky ' + t.shaky + '</span><span><i class="dot new"></i>Not started ' + t.new + '</span></div>'; }

function section(sc, title, desc){
  var ids = scopeIds(sc), t = C.tally(ids, data.cards), working = t.shaky + t.getting + t.new;
  return '<div class="card"><h2>' + title + '</h2><p class="muted">' + desc + '</p><div><span class="big">' + t.solid + '</span> <span class="muted">of ' + t.total + ' solid</span></div>' + meter(t)
    + (sc === 'case'
      ? '<div class="row"><button class="btn primary" data-sample="both">Practice the two from the guide</button><button class="btn primary" data-go="case" data-mode="all">Generate two new cases</button></div>'
        + '<div class="row"><button class="btn" data-go="case" data-mode="weak"' + (working ? '' : ' disabled') + '>Just the case types I\u2019m still working on</button></div>'
      : '<div class="row"><button class="btn primary" data-go="' + sc + '" data-mode="all">Practice ' + title + '</button><button class="btn" data-go="' + sc + '" data-mode="weak"' + (working ? '' : ' disabled') + '>Just what I’m still working on</button></div>') + '</div>';
}
function home(){
  var y = window.scrollY;
  var t = C.tally(C.DECK, data.cards), working = t.shaky + t.getting + t.new;
  var rows = C.TOPICS.filter(function(tp){ return tp.id !== 'cases'; }).map(function(tp){
    var ids = C.DECK.filter(function(id){ return C.topicOf(id) === tp.id; }), tt = C.tally(ids, data.cards);
    return '<div class="topic"><b>' + tp.label + '</b><span class="n">' + tt.solid + '/' + tt.total + '</span><small>' + tp.sub + '</small>' + meter(tt) + '</div>';
  }).join('');
  var msg = t.new === t.total ? 'Nothing started yet. A round is 20 true/false statements plus the two court cases, like the test.' : working === 0 ? 'Everything is solid. Nice work!' : 'Every round has both court cases. Cards you miss come back sooner, and a card counts as solid after two right answers in a row.';
  app.innerHTML = top()
    + '<div><p class="eyebrow">Social Studies 7 · Bar Exam Part II</p><h1>Civil &amp; Criminal Court</h1></div>'
    + '<div class="card"><div><span class="big">' + t.solid + '</span> <span class="muted">of ' + t.total + ' solid</span></div>' + meter(t) + legend(t) + '<p class="muted">' + msg + '</p>'
    + '<div class="row"><button class="btn primary" data-go="all" data-mode="all">Start a round</button><button class="btn" data-go="all" data-mode="weak"' + (working ? '' : ' disabled') + '>Just what I’m still working on</button></div>'
    + '<button class="link" id="know">See what I know and what I don’t</button></div>'
    + section('tf', 'True or False', 'The 28 true/false statements from the study guide. Most of them will be on the test as written.')
    + section('case', 'Court Cases', 'The test has two court cases. Practice the two printed on the study guide, or generate a new pair (one criminal, one civil). A case only counts when every answer in it is right.')
    + '<div class="card"><h3>Pick specific statements</h3><p class="muted">Tap the numbers on the study guide\u2019s true/false list. Filled = solid, outlined = getting there, striped = still shaky, dashed = not started.</p>'
    + '<div class="pick" id="pick">' + C.TF.map(function(f){ var id = 'tf' + f.n; return '<button class="pk ' + C.statusOf(data.cards[id]) + '" data-id="' + id + '" aria-pressed="' + (S.sel.indexOf(id) >= 0) + '" aria-label="Statement ' + f.n + ', ' + C.statusOf(data.cards[id]) + '">' + f.n + '</button>'; }).join('') + '</div>'
    + '<p class="pv" id="pv" aria-live="polite">' + esc(S.last) + '</p>'
    + '<div class="row"><button class="btn primary" id="pgo"' + (S.sel.length ? '' : ' disabled') + '>Practice ' + (S.sel.length || '') + ' picked</button><button class="btn" id="pclr"' + (S.sel.length ? '' : ' disabled') + '>Clear</button></div></div>'
    + '<div class="card"><h3>True or False, by topic</h3>' + rows + '</div>'
    + '<button class="link quiet" id="reset">Reset my progress on this</button>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function(b){ b.onclick = function(){ start(b.getAttribute('data-mode'), b.getAttribute('data-go')); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-sample]'), function(b){ b.onclick = function(){ start('pick', 'all', b.getAttribute('data-sample')); }; });
  document.getElementById('know').onclick = function(){ S.screen = 'know'; render(); };
  Array.prototype.forEach.call(document.querySelectorAll('.pk'), function(b){ b.onclick = function(){
    var id = b.getAttribute('data-id'), i = S.sel.indexOf(id);
    if (i >= 0) S.sel.splice(i, 1); else S.sel.push(id);
    var m = /^tf(\d+)$/.exec(id); S.last = m[1] + '. ' + C.TF[Number(m[1]) - 1].t;
    home(); window.scrollTo(0, y); }; });
  document.getElementById('pgo').onclick = function(){ start('pick'); };
  document.getElementById('pclr').onclick = function(){ S.sel = []; S.last = ''; home(); };
  document.getElementById('reset').onclick = function(){
    if (!confirm('Erase what the app knows about your progress on this study guide?')) return;
    data = { cards: {} }; persist(); if (window.mathseyeSync) mathseyeSync.reset('court'); render();
  };
}

function start(mode, scope, sample){ S.scope = scope || 'all'; S.guide = sample ? (sample === 'both' ? ['swade', 'davison'] : [sample]) : null; S.gno = 0; S.caseSet = null;
  if (!sample && scope === 'case') {   // a set of two cases like the test: one criminal and one civil, in either order
    var types = C.COURT_IDS.filter(function(id){ return mode !== 'weak' || C.statusOf(data.cards[id]) !== 'solid'; }).map(function(id){ return C.COURT[id].civil; });
    if (Math.random() < 0.5) types.reverse(); S.caseSet = types;
  }
  S.gtotal = S.guide ? S.guide.length : S.caseSet ? S.caseSet.length : 0; S.run = null; S.queue = (sample || S.caseSet) ? [] : mode === 'pick' ? S.sel.slice().sort(function(a, b){ return C.DECK.indexOf(a) - C.DECK.indexOf(b); }) : null; S.mode = sample ? 'pick' : mode; if (sample) S.scope = 'case'; S.recent = []; S.retry = []; S.again = {}; S.asked = 0; S.right = 0; S.missed = {}; S.screen = 'quiz'; S.cur = null;
  if (!sample && !S.caseSet && mode !== 'pick' && S.scope === 'all') S.queue = buildRound(mode);
  next(); }
/* A mixed round is like the test: up to ROUND_TF statements (the ones she needs most come first in line) plus the two court cases, a criminal one and a civil one, dropped in at random places. */
var ROUND_TF = 20;
function buildRound(mode){
  var pool = scopeIds('tf').filter(function(id){ return mode !== 'weak' || C.statusOf(data.cards[id]) !== 'solid'; }), plan = [];
  while (plan.length < ROUND_TF && pool.length) { var id = C.pickNext(pool, data.cards, {}); plan.push(id); pool.splice(pool.indexOf(id), 1); }
  C.COURT_IDS.filter(function(id){ return mode !== 'weak' || C.statusOf(data.cards[id]) !== 'solid'; }).forEach(function(id){ plan.splice(Math.floor(Math.random() * (plan.length + 1)), 0, id); });
  return plan;
}
function beginCase(fixed, civil){
  var seed = fixed ? null : Math.floor(Math.random() * 99999) + 1, ids;
  if (fixed) { ids = C.SAMPLES[fixed].qs.slice(); civil = C.SAMPLES[fixed].civil; }
  else ids = ['case-civil', 'case-party', 'case-def', Math.random() < 0.5 ? 'case-end' : 'case-proof', 'case-plaintiff', 'case-crime'];
  if (S.guide || S.caseSet) S.gno++;
  S.run = { fixed: fixed, seed: seed, civil: !!civil, card: civil ? 'court-civil' : 'court-criminal', ids: ids, i: 0, ans: [], q: C.ask(ids[0], seed, fixed, civil), picked: null, phase: 'ask', no: (S.guide || S.caseSet) ? S.gno : 0 };
}
function next(){
  S.run = null;
  if (S.guide && S.guide.length) { beginCase(S.guide.shift()); S.cur = null; return render(); }
  if (S.caseSet && S.caseSet.length) { beginCase(null, S.caseSet.shift()); S.cur = null; return render(); }
  var id = null;
  for (var i = 0; i < S.retry.length; i++) if (S.retry[i].at <= S.asked) { id = S.retry[i].id; S.retry.splice(i, 1); break; }
  if (!id && S.queue) { id = S.queue.shift() || (S.retry.length ? S.retry.shift().id : null); }
  else if (!id) id = C.pickNext(scopeIds(S.scope), data.cards, { recent: S.recent, mode: S.mode });
  if (!id) { S.cur = null; S.screen = 'done'; return render(); }
  if (/^court-/.test(id)) { beginCase(null, C.COURT[id].civil); S.cur = null; S.recent.push(id); if (S.recent.length > 12) S.recent.shift(); return render(); }
  S.cur = C.ask(id); S.picked = null; S.recent.push(id); if (S.recent.length > 12) S.recent.shift();
  render();
}
function runView(){
  var r = S.run, q = r.q, t = C.tally(C.DECK, data.cards), ended = r.phase === 'end', answered = r.picked != null && !ended;
  var shown = r.ans.slice(0, answered ? r.ans.length - 1 : r.ans.length);
  function row(a, n){ return '<div class="dr' + (a.ok ? '' : ' miss') + '"><span class="n">' + n + '</span><span>' + esc(a.q.text) + (a.ok ? '' : '<small>You said ' + esc(a.picked) + ' \u00b7 it\u2019s ' + esc(a.q.answer) + '</small>') + '</span><span class="a' + (a.ok ? ' ok' : '') + '">' + esc(a.q.answer) + '</span></div>'; }
  var rows = shown.map(function(a, i){ return row(a, i + 1); }).join('');
  var tag = r.no ? 'Court case ' + r.no + ' of ' + S.gtotal : 'Court case';
  var head = '<div class="qhead"><div class="meter mini" aria-hidden="true"><i class="solid" style="width:' + (100*t.solid/t.total) + '%"></i></div><span class="muted">' + t.solid + ' of ' + t.total + ' solid</span><button class="link" id="stop">I\u2019m done</button></div>';
  if (ended) {
    var right = r.ans.filter(function(a){ return a.ok; }).length, passed = right === r.ids.length, gmore = S.guide && S.guide.length, smore = S.caseSet && S.caseSet.length, more = gmore || smore;
    var lbl = gmore ? 'Next case: ' + C.SAMPLES[S.guide[0]].text : smore ? 'Next case' : (S.guide || S.caseSet) ? 'Finish' : 'Keep going';
    app.innerHTML = top() + head + '<div class="card sum"><p class="eyebrow">' + tag + ' \u00b7 case closed</p><div class="case">' + esc(q.caseText) + '</div><h2>' + (passed ? 'Case solved \u2713' : right + ' of ' + r.ids.length + ' right') + '</h2><p class="muted">' + (passed ? 'Every answer was right, so this counts.' : 'A case counts only when every answer is right, so it goes back to Still shaky and will come back.') + '</p><div class="done">' + rows + '</div>'
      + '<div class="row"><button class="btn primary" id="cnext">' + esc(lbl) + '</button><button class="btn" id="cstop">Stop for now</button></div></div>';
    document.getElementById('cnext').onclick = next;
    document.getElementById('cstop').onclick = function(){ S.screen = 'done'; render(); };
    document.getElementById('stop').onclick = function(){ S.screen = 'done'; render(); };
    return;
  }
  var ok = answered && r.picked === q.answer, cls = q.opts.length === 2 ? 'two' : q.opts.length === 3 ? 'three' : '';
  var opts = q.opts.map(function(o, i){ var c = 'opt'; if (answered) { if (o === q.answer) c += ' right'; else if (o === r.picked) c += ' mine'; } return '<button class="' + c + '" data-i="' + i + '"' + (answered ? ' disabled' : '') + '>' + esc(o) + '</button>'; }).join('');
  var last = r.i === r.ids.length - 1;
  var fb = answered ? '<div class="fb" role="status"><b>' + (ok ? 'Got it \u2713' : 'Not quite \u2014 it\u2019s ' + esc(q.answer)) + '</b>' + esc(q.why) + (ok ? '' : '<br><span class="muted">Keep going. This case now counts as not yet, and it will come back.</span>') + '</div><button class="btn primary" id="cq">' + (last ? 'See how it went' : 'Next question') + '</button>' : '';
  var st = C.statusOf(data.cards[r.card]), sd = C.STATUS[st], left = r.ids.length - 1 - r.i;
  var dots = r.ids.map(function(_, i){ return '<i class="' + (i < r.i || (i === r.i && answered) ? 'on' : i === r.i ? 'now' : '') + '"></i>'; }).join('');
  app.innerHTML = top() + head + '<div class="card" id="card"><div class="hdr"><p class="eyebrow">' + tag + '</p><button class="stat" id="stat" type="button" aria-label="Status: ' + sd.label + '. ' + esc(sd.def) + '"><i class="dot ' + st + '"></i>' + sd.label + '</button><div class="steps" aria-hidden="true">' + dots + '</div></div>'
    + '<div class="case">' + esc(q.caseText) + '</div>' + (rows ? '<div class="done">' + rows + '</div>' : '')
    + '<div class="cur"><p class="eyebrow">Question ' + (r.i + 1) + ' of ' + r.ids.length + '</p><p class="q">' + esc(q.text) + '</p><div class="opts ' + cls + '">' + opts + '</div>' + fb + '</div>'
    + (left && !answered ? '<p class="later">' + left + ' more question' + (left === 1 ? '' : 's') + ' about this case</p>' : '') + '<span class="ref">' + esc(q.ref) + '</span></div>';
  if (window.mathseyeFeedback) document.getElementById('card').appendChild(mathseyeFeedback.button(function(){ return { ref: q.ref, text: q.caseText + ' \u2014 ' + q.text, where: 'Social Studies \u00b7 Court case', extra: { picked: r.picked || '' } }; }));
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){ b.onclick = function(){ answer(q.opts[Number(b.getAttribute('data-i'))]); }; });
  holdTip(document.getElementById('stat'), document.getElementById('card'), sd);
  var cq = document.getElementById('cq');
  if (cq) cq.onclick = function(){ if (last) { r.phase = 'end'; var allOk = r.ans.every(function(a){ return a.ok; }); data.cards[r.card] = C.grade(data.cards[r.card], allOk, Date.now()); if (!allOk) S.missed[r.card] = 1; persist(); } else { r.i++; r.q = C.ask(r.ids[r.i], r.seed, r.fixed); r.picked = null; } render(); };
  document.getElementById('stop').onclick = function(){ S.screen = S.asked ? 'done' : 'home'; render(); };
}
function quiz(){
  if (S.run) return runView();
  var q = S.cur, t = C.tally(C.DECK, data.cards), done = S.picked != null, ok = done && S.picked === q.answer;
  var cls = q.opts.length === 2 ? 'two' : q.opts.length === 3 ? 'three' : '';
  var opts = q.opts.map(function(o, i){
    var c = 'opt';
    if (done) { if (o === q.answer) c += ' right'; else if (o === S.picked) c += ' mine'; }
    return '<button class="' + c + '" data-i="' + i + '"' + (done ? ' disabled' : '') + '>' + esc(o) + '</button>';
  }).join('');
  var fb = '';
  if (done) fb = '<div class="fb" role="status"><b>' + (ok ? 'Got it ✓' : 'Not quite — it’s ' + esc(q.answer)) + '</b>' + esc(q.why) + (ok ? '' : '<br><span class="muted">This one will come back soon.</span>') + '</div>'
    + '<button class="btn primary" id="next">Next</button>';
  var topic = C.TOPICS.filter(function(x){ return x.id === q.topic; })[0];
  var st = C.statusOf(data.cards[q.id]), sd = C.STATUS[st];
  app.innerHTML = top()
    + '<div class="qhead"><div class="meter mini" aria-hidden="true"><i class="solid" style="width:' + (100*t.solid/t.total) + '%"></i></div><span class="muted">' + t.solid + ' of ' + t.total + ' solid</span><button class="link" id="stop">I’m done</button></div>'
    + '<div class="card" id="card"><div class="srow"><p class="eyebrow">' + esc(topic ? topic.label : '') + '</p><button class="stat" id="stat" type="button" aria-label="Status: ' + sd.label + '. ' + esc(sd.def) + '"><i class="dot ' + st + '"></i>' + sd.label + '</button></div>'
    + (q.caseText ? '<div class="case">' + esc(q.caseText) + '</div><p class="q">' + esc(q.text) + '</p>' : '<p class="q">' + esc(q.text) + '</p>')
    + '<div class="opts ' + cls + '">' + opts + '</div>' + fb + '<span class="ref">' + esc(q.ref) + '</span></div>';
  if (window.mathseyeFeedback) document.getElementById('card').appendChild(mathseyeFeedback.button(function(){ return { ref: q.ref, text: (q.caseText ? q.caseText + ' — ' : '') + q.text, where: 'Social Studies · Court study guide', extra: { picked: S.picked || '' } }; }));
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){ b.onclick = function(){ answer(q.opts[Number(b.getAttribute('data-i'))]); }; });
  holdTip(document.getElementById('stat'), document.getElementById('card'), sd);
  if (done) { document.getElementById('next').onclick = next; }
  document.getElementById('stop').onclick = function(){ S.screen = S.asked ? 'done' : 'home'; render(); };
}
/* Press and hold the status chip to read what the status means (Enter or Space does the same for keyboards). */
function holdTip(chip, card, sd){
  var timer = null, hideT = null, tip = null;
  function show(){ clearTimeout(hideT); if (tip) return; tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'tooltip'); tip.innerHTML = '<b>' + esc(sd.label) + '</b>' + esc(sd.def); card.appendChild(tip); }
  function hide(){ clearTimeout(timer); if (tip) { var t = tip; tip = null; t.parentNode && t.parentNode.removeChild(t); } }
  function release(){ clearTimeout(timer); clearTimeout(hideT); hideT = setTimeout(hide, 2200); }
  chip.addEventListener('pointerdown', function(){ clearTimeout(hideT); timer = setTimeout(show, 350); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function(ev){ chip.addEventListener(ev, release); });
  chip.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  chip.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (tip) hide(); else { show(); hideT = setTimeout(hide, 4000); } } });
  chip.addEventListener('blur', hide);
}
function answer(o){
  if (S.run) {
    var r = S.run; if (r.picked != null) return;
    var rq = r.q, rok = o === rq.answer; r.picked = o; S.asked++; if (rok) S.right++;
    r.ans.push({ q: rq, picked: o, ok: rok }); return render();
  }
  if (S.picked != null) return;
  var q = S.cur, ok = o === q.answer; S.picked = o; S.asked++; if (ok) S.right++; else { S.missed[q.id] = 1; if (!S.again[q.key]) { S.again[q.key] = 1; S.retry.push({ id: q.key, at: S.asked + 3 }); } }
  data.cards[q.id] = C.grade(data.cards[q.id], ok, Date.now()); persist(); render();
}

function done(){
  var t = C.tally(C.DECK, data.cards), missed = Object.keys(S.missed);
  var list = missed.map(function(id){ var cc = C.COURT[id]; if (cc) return '<div class="item">' + cc.label + '<small>' + cc.sub + '</small></div>'; return '<div class="item">' + esc(C.ask(id).text) + '</div>'; }).join('');
  var all = S.mode === 'weak' && !S.cur ? 'You went through everything that wasn’t solid.' : '';
  app.innerHTML = top() + '<div class="card"><p class="eyebrow">Nice round</p>'
    + '<h1>' + S.right + ' right out of ' + S.asked + '</h1>' + (all ? '<p>' + all + '</p>' : '')
    + meter(t) + legend(t)
    + (missed.length ? '<div class="grp"><h3>Ones that tripped you up this round</h3>' + list + '</div>' : '<p>No misses this round.</p>')
    + '<div class="row"><button class="btn primary" id="again">' + (S.mode === 'pick' ? 'Mix it up' : 'Keep going') + '</button><button class="btn" id="back">Back to the start</button></div></div>';
  document.getElementById('again').onclick = function(){ start('all', S.mode === 'pick' ? 'all' : S.scope); };
  document.getElementById('back').onclick = function(){ S.screen = 'home'; render(); };
}

function know(){
  var groups = { shaky: [], getting: [], solid: [], new: [] };
  C.DECK.forEach(function(id){ groups[C.statusOf(data.cards[id])].push(id); });
  function label(id){ var m = /^tf(\d+)$/.exec(id); return m ? C.TF[Number(m[1]) - 1].t : C.COURT[id].label + ' (' + C.COURT[id].sub + ')'; }
  function sec(key, title, dot, hint){
    var ids = groups[key]; if (!ids.length) return '';
    return '<div class="grp"><h3><i class="dot ' + dot + '"></i>' + title + ' (' + ids.length + ')</h3>' + (hint ? '<p class="muted">' + hint + '</p>' : '')
      + ids.map(function(id){ var r = data.cards[id]; return '<div class="item">' + esc(label(id)) + (r ? '<small>asked ' + r.seen + ' · missed ' + (r.m || 0) + '</small>' : '') + '</div>'; }).join('') + '</div>';
  }
  app.innerHTML = top() + '<div class="card"><h1>What I know</h1>'
    + sec('shaky', 'Still shaky', 'shaky', 'You missed these last time. Practice brings them back first.')
    + sec('getting', 'Getting there', 'getting', 'Right once. One more right in a row makes it solid.')
    + sec('solid', 'Solid', 'solid', '')
    + sec('new', 'Not started', 'new', '')
    + '<button class="btn primary" id="back">Back</button></div>';
  document.getElementById('back').onclick = function(){ S.screen = 'home'; render(); };
}

render();
/* Cloud sync: pull this player's saved progress; redraw the home screen if something new arrived. */
if (window.mathseyeSync) mathseyeSync.sync().then(function(r){ if (r && r.changed) { reload(); if (S.screen === 'home') render(); } });
})();
</script>
</body></html>
